name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools git zip unzip openjdk-17-jdk wget tar curl

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade buildozer cython

      - name: Configure Java 17
        run: |
          JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===== JAVA ====="
          java -version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Android SDK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===== JAVA ====="
          java -version

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip \
            -O /tmp/cmdline-tools.zip

          rm -rf "$SDK/cmdline-tools/latest"
          rm -rf "$SDK/cmdline-tools/cmdline-tools"

          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -r \
            "$SDK/cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          rm -rf "$SDK/cmdline-tools/cmdline-tools"

          echo "===== SDKMANAGER MODERNE ====="

          export PATH="$JAVA_HOME/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          which sdkmanager
          sdkmanager --version

          echo "===== COMPATIBILITE BUILDOZER ====="

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "sdkmanager attendu par Buildozer :"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo "===== TEST SDKMANAGER BUILDOZER ====="

          "$SDK/tools/bin/sdkmanager" --version

          echo "===== VARIABLES ANDROID ====="

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Android NDK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== JAVA ====="
          java -version

          echo "===== SDKMANAGER ====="
          "$SDK/tools/bin/sdkmanager" --version

          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/tools/bin/sdkmanager" "ndk;28.0.13004108"

          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== SDKMANAGER ====="
          "$SDK/tools/bin/sdkmanager" --version

          echo "===== BUILD TOOLS ====="
          ls -la "$SDK/build-tools"

          echo "===== AIDL ====="
          ls -l "$SDK/build-tools/33.0.2/aidl"

          "$SDK/build-tools/33.0.2/aidl" --version

          echo "===== PLATFORM ====="
          ls -la "$SDK/platforms/android-33"

          echo "===== NDK ====="
          ls -la "$SDK/ndk/28.0.13004108"

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$JAVA_HOME/bin:$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== JAVA AVANT BUILDOZER ====="
          java -version

          echo "===== SDKMANAGER ====="
          "$SDK/tools/bin/sdkmanager" --version

          echo "===== BUILDOZER ====="
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "===== APK GENERE ====="

          find bin -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERREUR : aucun APK généré"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-maintenance-apk
          path: bin/*.apk

