# ================================================================
# WORKFLOW GITHUB ACTIONS - SUIVI AUTO
# ================================================================
#
# Ce workflow construit automatiquement l'application Android
# "Suivi Auto" avec :
#
#   - Python 3.10
#   - Java 17
#   - Buildozer 1.6.0
#   - Cython 0.29.37
#   - Android API 33
#   - Android Build Tools 34.0.0
#   - Android NDK 28c
#   - architectures arm64-v8a et armeabi-v7a
#
# Le workflow :
#
#   1. récupère le dépôt
#   2. installe Python
#   3. installe Java
#   4. installe les dépendances système
#   5. installe Buildozer et Cython
#   6. installe le SDK Android
#   7. accepte les licences Android
#   8. installe API 33 et Build Tools 34.0.0
#   9. installe le NDK 28c
#  10. vérifie l'environnement Android
#  11. vérifie buildozer.spec
#  12. vérifie que ReportLab est totalement supprimé
#  13. nettoie le cache Buildozer du projet
#  14. construit l'APK
#  15. publie l'APK comme artefact GitHub
#
# IMPORTANT :
#
# Le projet n'utilise plus ReportLab.
# La génération PDF a été supprimée.
# L'export Excel reste disponible.
#
# IMPORTANT :
#
# Ne pas ajouter "cache: gradle" à setup-java.
# Ce projet n'est PAS un projet Gradle.
#
# IMPORTANT :
#
# Ne pas utiliser :
#
#   yes | sdkmanager --licenses
#
# Cette méthode peut provoquer :
#
#   yes: standard output: Broken pipe
#
# Le workflow utilise à la place un fichier contenant
# suffisamment de réponses "y".
# ================================================================


name: Build Android APK - Suivi Auto


# ================================================================
# DÉCLENCHEMENT DU WORKFLOW
# ================================================================
#
# Le workflow est lancé :
#
#   - lors d'un push sur main
#   - lors d'un push sur master
#   - manuellement depuis GitHub Actions
#
# Le déclenchement manuel est particulièrement utile pour tester
# le workflow sans devoir créer un nouveau commit.
# ================================================================

on:

  push:
    branches:
      - main
      - master

  workflow_dispatch:


# ================================================================
# JOB PRINCIPAL
# ================================================================

jobs:

  build-android:

    # Ubuntu 22.04 est utilisé comme environnement de construction.
    runs-on: ubuntu-22.04


    # ============================================================
    # VARIABLES D'ENVIRONNEMENT
    # ============================================================
    #
    # Les versions sont centralisées ici afin d'éviter de répéter
    # les numéros de version dans plusieurs étapes.
    # ============================================================

    env:

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      PYTHON_VERSION: "3.10"


      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------

      JAVA_VERSION: "17"


      # ----------------------------------------------------------
      # Buildozer / Cython
      # ----------------------------------------------------------

      BUILDOZER_VERSION: "1.6.0"
      CYTHON_VERSION: "0.29.37"


      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------

      ANDROID_API: "33"
      ANDROID_MIN_API: "24"
      ANDROID_BUILD_TOOLS: "34.0.0"


      # ----------------------------------------------------------
      # Android NDK
      #
      # Le buildozer.spec utilise :
      #
      #   android.ndk = 28c
      #
      # Le package SDK correspondant utilisé ici est :
      #
      #   ndk;28.2.13676358
      # ----------------------------------------------------------

      ANDROID_NDK_VERSION: "28.2.13676358"


      # ----------------------------------------------------------
      # Emplacement du SDK Android
      #
      # Le SDK est installé dans le workspace GitHub Actions.
      # ----------------------------------------------------------

      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk


    # ============================================================
    # ÉTAPES DU BUILD
    # ============================================================

    steps:


      # ==========================================================
      # 1 - RÉCUPÉRATION DU CODE SOURCE
      # ==========================================================

      - name: "1 - Checkout du dépôt"
        uses: actions/checkout@v4


      # ==========================================================
      # 2 - INSTALLATION DE PYTHON
      # ==========================================================
      #
      # Python 3.10 est utilisé pour rester cohérent avec
      # l'environnement de construction du projet.
      #
      # Aucun cache pip n'est activé ici.
      #
      # Cela évite que setup-python cherche obligatoirement un
      # requirements.txt qui pourrait ne pas exister dans le dépôt.
      # ==========================================================

      - name: "2 - Installer Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ==========================================================
      # 3 - INSTALLATION DE JAVA 17
      # ==========================================================
      #
      # Java 17 est utilisé par l'écosystème Android actuel utilisé
      # par Buildozer / python-for-android.
      #
      # IMPORTANT :
      #
      # NE PAS ajouter :
      #
      #   cache: gradle
      #
      # Le projet n'est pas un projet Gradle.
      # L'utilisation de ce cache provoquait l'erreur :
      #
      #   No file ... matched to [**/*.gradle* ...]
      #
      # ==========================================================

      - name: "3 - Installer Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 4 - VÉRIFICATION DE PYTHON ET JAVA
      # ==========================================================

      - name: "4 - Vérifier Python et Java"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "PYTHON"
          echo "================================================"

          python --version
          python -m pip --version


          echo
          echo "================================================"
          echo "JAVA"
          echo "================================================"

          java -version
          javac -version


      # ==========================================================
      # 5 - INSTALLATION DES DÉPENDANCES SYSTÈME
      # ==========================================================
      #
      # Ces paquets sont nécessaires à Buildozer, Cython,
      # python-for-android et à certaines compilations natives.
      # ==========================================================

      - name: "5 - Installer les dépendances système"
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            rsync \
            file \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

          echo
          echo "Dépendances système installées avec succès."


      # ==========================================================
      # 6 - INSTALLATION DE BUILDOZER ET CYTHON
      # ==========================================================
      #
      # Les versions sont volontairement figées afin que le build
      # ne change pas de comportement simplement parce qu'une
      # nouvelle version Python ou Buildozer est publiée.
      # ==========================================================

      - name: "6 - Installer Buildozer et Cython"
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}" \
            "cython==${CYTHON_VERSION}"


          echo
          echo "================================================"
          echo "VERSIONS INSTALLÉES"
          echo "================================================"

          buildozer --version
          cython --version


      # ==========================================================
      # 7 - INSTALLATION DES ANDROID COMMAND LINE TOOLS
      # ==========================================================
      #
      # Le SDK Android est installé manuellement afin de maîtriser
      # précisément :
      #
      #   - l'emplacement du SDK
      #   - la version des outils
      #   - l'API Android
      #   - les Build Tools
      #   - le NDK
      #
      # Version des Command Line Tools utilisée :
      #
      #   11076708
      # ==========================================================

      - name: "7 - Installer Android SDK Command Line Tools"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"
          CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest"

          echo "SDK Android : $SDK_ROOT"

          mkdir -p "$SDK_ROOT/cmdline-tools"


          # ------------------------------------------------------
          # Installation uniquement si sdkmanager n'existe pas.
          # ------------------------------------------------------

          if [ ! -x "$CMDLINE_TOOLS/bin/sdkmanager" ]; then

            echo
            echo "Téléchargement des Android Command Line Tools..."

            cd "$RUNNER_TEMP"

            rm -f commandlinetools.zip

            wget -q \
              -O commandlinetools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"


            # ----------------------------------------------------
            # Extraction dans un répertoire temporaire.
            # ----------------------------------------------------

            rm -rf "$RUNNER_TEMP/cmdline-tools"

            unzip -q \
              commandlinetools.zip


            # ----------------------------------------------------
            # Mise en place du répertoire "latest".
            # ----------------------------------------------------

            rm -rf "$CMDLINE_TOOLS"

            mkdir -p "$CMDLINE_TOOLS"

            cp -a \
              "$RUNNER_TEMP/cmdline-tools/." \
              "$CMDLINE_TOOLS/"

          fi


          echo
          echo "================================================"
          echo "SDKMANAGER"
          echo "================================================"

          "$CMDLINE_TOOLS/bin/sdkmanager" --version


      # ==========================================================
      # 8 - CONFIGURATION DE L'ENVIRONNEMENT ANDROID
      # ==========================================================
      #
      # GITHUB_PATH permet de conserver les chemins pour les étapes
      # suivantes.
      #
      # GITHUB_ENV permet de conserver les variables d'environnement.
      # ==========================================================

      - name: "8 - Configurer Android SDK"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"


          # ------------------------------------------------------
          # Ajouter les outils Android au PATH.
          # ------------------------------------------------------

          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"


          # ------------------------------------------------------
          # Conserver les variables Android pour les étapes
          # suivantes.
          # ------------------------------------------------------

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"


          echo
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"


      # ==========================================================
      # 9 - ACCEPTATION DES LICENCES ANDROID
      # ==========================================================
      #
      # IMPORTANT :
      #
      # NE PAS faire :
      #
      #   yes | sdkmanager --licenses
      #
      # "yes" peut continuer à écrire alors que sdkmanager a fermé
      # son entrée standard.
      #
      # Cela provoque :
      #
      #   Broken pipe
      #
      # Le workflow utilise donc un fichier contenant 100 réponses
      # "y". Il n'y a ainsi aucun pipeline "yes | ...".
      # ==========================================================

      - name: "9 - Accepter les licences Android"
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          LICENSE_INPUT="$RUNNER_TEMP/android-license-input.txt"


          echo "================================================"
          echo "ACCEPTATION DES LICENCES ANDROID"
          echo "================================================"


          # ------------------------------------------------------
          # Création du dossier des licences.
          # ------------------------------------------------------

          mkdir -p "$ANDROID_HOME/licenses"


          # ------------------------------------------------------
          # Création d'un fichier contenant 100 réponses "y".
          #
          # Cela remplace :
          #
          #   yes | sdkmanager --licenses
          # ------------------------------------------------------

          rm -f "$LICENSE_INPUT"

          for i in $(seq 1 100); do
            printf 'y\n'
          done > "$LICENSE_INPUT"


          echo
          echo "Lancement de sdkmanager --licenses..."


          # ------------------------------------------------------
          # On capture volontairement la sortie et le code retour.
          # ------------------------------------------------------

          set +e

          LICENSE_OUTPUT=$(
            "$SDKMANAGER" --licenses \
              < "$LICENSE_INPUT" \
              2>&1
          )

          SDKMANAGER_EXIT_CODE=$?

          set -e


          echo
          echo "$LICENSE_OUTPUT"


          echo
          echo "Code retour sdkmanager : $SDKMANAGER_EXIT_CODE"


          # ------------------------------------------------------
          # Vérification des fichiers de licences.
          # ------------------------------------------------------

          echo
          echo "================================================"
          echo "LICENCES INSTALLÉES"
          echo "================================================"

          find "$ANDROID_HOME/licenses" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort


          LICENSE_COUNT=$(
            find "$ANDROID_HOME/licenses" \
              -maxdepth 1 \
              -type f |
              wc -l
          )


          echo
          echo "Nombre de fichiers de licences : $LICENSE_COUNT"


          # ------------------------------------------------------
          # Cas normal :
          # sdkmanager confirme que toutes les licences sont
          # acceptées.
          # ------------------------------------------------------

          if echo "$LICENSE_OUTPUT" |
            grep -q "All SDK package licenses accepted"; then

            echo
            echo "Toutes les licences Android sont acceptées."
            exit 0

          fi


          # ------------------------------------------------------
          # Certaines versions peuvent ne pas afficher exactement
          # le même message.
          #
          # Si sdkmanager retourne 0 et que des licences existent,
          # on considère également l'étape réussie.
          # ------------------------------------------------------

          if [ "$SDKMANAGER_EXIT_CODE" -eq 0 ] &&
             [ "$LICENSE_COUNT" -gt 0 ]; then

            echo
            echo "Licences Android installées avec succès."
            exit 0

          fi


          echo
          echo "ERREUR : impossible de confirmer l'acceptation"
          echo "des licences Android."

          exit 1


      # ==========================================================
      # 10 - INSTALLATION DU SDK ANDROID
      # ==========================================================
      #
      # Installation :
      #
      #   platform-tools
      #   Android API 33
      #   Build Tools 34.0.0
      # ==========================================================

      - name: "10 - Installer Android SDK API 33"
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"


          echo "================================================"
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "================================================"


          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"


      # ==========================================================
      # 11 - INSTALLATION DU NDK 28c
      # ==========================================================
      #
      # Le buildozer.spec utilise :
      #
      #   android.ndk = 28c
      #
      # Le SDK Android utilise cependant un identifiant complet :
      #
      #   ndk;28.2.13676358
      #
      # Il ne faut donc PAS faire :
      #
      #   sdkmanager "ndk;28c"
      #
      # ==========================================================

      - name: "11 - Installer Android NDK 28c"
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_PACKAGE="ndk;${ANDROID_NDK_VERSION}"
          NDK_DIR="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"


          echo "================================================"
          echo "NDK ANDROID"
          echo "================================================"

          echo "Package : $NDK_PACKAGE"
          echo "Dossier : $NDK_DIR"


          # ------------------------------------------------------
          # Vérifier que la version demandée existe avant de tenter
          # l'installation.
          # ------------------------------------------------------

          echo
          echo "Vérification de disponibilité..."


          if ! "$SDKMANAGER" --list 2>/dev/null |
            grep -Fq "$NDK_PACKAGE"; then

            echo
            echo "ERREUR : le package NDK demandé n'est pas disponible :"
            echo "$NDK_PACKAGE"


            echo
            echo "Versions NDK 28 disponibles :"

            "$SDKMANAGER" --list 2>/dev/null |
              grep -E 'ndk;28\.' ||
              true

            exit 1

          fi


          # ------------------------------------------------------
          # Installation du NDK.
          # ------------------------------------------------------

          echo
          echo "Installation du NDK..."

          "$SDKMANAGER" "$NDK_PACKAGE"


          # ------------------------------------------------------
          # Vérification du dossier.
          # ------------------------------------------------------

          echo
          echo "Vérification du NDK..."


          if [ ! -d "$NDK_DIR" ]; then

            echo
            echo "ERREUR : le dossier NDK n'existe pas :"
            echo "$NDK_DIR"

            exit 1

          fi


          # ------------------------------------------------------
          # source.properties permet de confirmer qu'il s'agit
          # bien d'une installation NDK valide.
          # ------------------------------------------------------

          if [ ! -f "$NDK_DIR/source.properties" ]; then

            echo
            echo "ERREUR : source.properties absent du NDK."

            exit 1

          fi


          echo
          cat "$NDK_DIR/source.properties"


          echo
          echo "NDK correctement installé."


      # ==========================================================
      # 12 - VÉRIFICATION COMPLÈTE DE L'ENVIRONNEMENT ANDROID
      # ==========================================================

      - name: "12 - Vérifier Android SDK et NDK"
        shell: bash
        run: |
          set -euo pipefail


          # ------------------------------------------------------
          # Reconstituer le PATH explicitement pour cette étape.
          # ------------------------------------------------------

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"


          echo "================================================"
          echo "SDKMANAGER"
          echo "================================================"

          command -v sdkmanager
          sdkmanager --version


          echo
          echo "================================================"
          echo "ADB"
          echo "================================================"

          command -v adb
          adb version


          echo
          echo "================================================"
          echo "AAPT"
          echo "================================================"

          command -v aapt
          aapt version


          echo
          echo "================================================"
          echo "ANDROID API"
          echo "================================================"


          if [ ! -d "$ANDROID_HOME/platforms/android-${ANDROID_API}" ]; then

            echo "ERREUR : Android API ${ANDROID_API} absente."

            exit 1

          fi


          echo "Android API ${ANDROID_API} : OK."


          echo
          echo "================================================"
          echo "BUILD TOOLS"
          echo "================================================"


          if [ ! -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" ]; then

            echo "ERREUR : Build Tools ${ANDROID_BUILD_TOOLS} absents."

            exit 1

          fi


          echo "Build Tools ${ANDROID_BUILD_TOOLS} : OK."


          echo
          echo "================================================"
          echo "NDK"
          echo "================================================"


          if [ ! -f "$ANDROID_NDK_HOME/source.properties" ]; then

            echo "ERREUR : NDK absent :"
            echo "$ANDROID_NDK_HOME"

            exit 1

          fi


          cat "$ANDROID_NDK_HOME/source.properties"


          echo
          echo "================================================"
          echo "ENVIRONNEMENT ANDROID VALIDE"
          echo "================================================"


      # ==========================================================
      # 13 - VÉRIFICATION DE BUILDOZER.SPEC
      # ==========================================================
      #
      # Cette étape affiche le fichier afin de rendre le log GitHub
      # Actions suffisamment explicite en cas de problème.
      # ==========================================================

      - name: "13 - Vérifier buildozer.spec"
        shell: bash
        run: |
          set -euo pipefail


          if [ ! -f buildozer.spec ]; then

            echo "ERREUR : buildozer.spec introuvable."

            exit 1

          fi


          echo "================================================"
          echo "buildozer.spec"
          echo "================================================"

          cat buildozer.spec


          echo
          echo "================================================"
          echo "PARAMÈTRES ANDROID"
          echo "================================================"


          grep -n "^requirements" buildozer.spec || true
          grep -n "^android.api" buildozer.spec || true
          grep -n "^android.minapi" buildozer.spec || true
          grep -n "^android.sdk_build_tools" buildozer.spec || true
          grep -n "^android.ndk" buildozer.spec || true
          grep -n "^android.archs" buildozer.spec || true


      # ==========================================================
      # 14 - VÉRIFICATION DE LA SUPPRESSION DE REPORTLAB
      # ==========================================================
      #
      # ReportLab a été supprimé du projet.
      #
      # Cette vérification porte uniquement sur les fichiers qui
      # peuvent réellement influencer le build Android.
      #
      # Le workflow lui-même et le README sont volontairement
      # exclus de cette recherche, car ils peuvent mentionner
      # ReportLab pour documenter sa suppression.
      # ==========================================================

      - name: "14 - Vérifier suppression de ReportLab"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VÉRIFICATION REPORTLAB"
          echo "================================================"


          # ------------------------------------------------------
          # Vérification des fichiers Python de l'application.
          # ------------------------------------------------------

          echo
          echo "Recherche dans les fichiers Python..."

          if grep -RniE \
            "reportlab|generer_rapport_pdf" \
            . \
            --include="*.py" \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=.android-sdk; then

            echo
            echo "ERREUR : une référence ReportLab existe encore"
            echo "dans le code Python."

            exit 1

          fi


          # ------------------------------------------------------
          # Vérification du buildozer.spec.
          # ------------------------------------------------------

          echo
          echo "Recherche dans buildozer.spec..."

          if grep -niE \
            "reportlab|generer_rapport_pdf|p4a\.local_recipes" \
            buildozer.spec; then

            echo
            echo "ERREUR : buildozer.spec contient encore"
            echo "une référence interdite."

            exit 1

          fi


          # ------------------------------------------------------
          # Vérification de requirements.txt.
          # ------------------------------------------------------

          if [ -f requirements.txt ]; then

            echo
            echo "Recherche dans requirements.txt..."

            if grep -niE \
              "^[[:space:]]*reportlab([<>=!~]|$)" \
              requirements.txt; then

              echo
              echo "ERREUR : ReportLab est encore présent"
              echo "dans requirements.txt."

              exit 1

            fi

          fi


          # ------------------------------------------------------
          # Vérification des recettes Python-for-Android locales.
          # ------------------------------------------------------

          if [ -d p4a-recipes ]; then

            echo
            echo "Vérification du répertoire p4a-recipes..."

            if find p4a-recipes \
              -iname "*reportlab*" \
              -print |
              grep -q .; then

              echo
              echo "ERREUR : une recette ReportLab existe encore"
              echo "dans p4a-recipes/."

              find p4a-recipes \
                -iname "*reportlab*" \
                -print

              exit 1

            fi

          fi


          # ------------------------------------------------------
          # Vérification terminée.
          # ------------------------------------------------------

          echo
          echo "================================================"
          echo "REPORTLAB : ABSENT DU BUILD"
          echo "================================================"

          echo
          echo "Aucune référence ReportLab détectée dans les"
          echo "fichiers utilisés pour la compilation Android."


      # ==========================================================
      # 15 - NETTOYAGE DU BUILD BUILDOZER
      # ==========================================================
      #
      # On supprime le .buildozer du dépôt afin d'éviter qu'un
      # ancien état de compilation interfère avec le nouveau build.
      #
      # IMPORTANT :
      #
      # On ne supprime PAS $ANDROID_HOME.
      #
      # Le SDK Android installé précédemment doit rester disponible.
      # ==========================================================

      - name: "15 - Nettoyer le cache Buildozer du projet"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer

          echo
          echo "Cache Buildozer du projet supprimé."


      # ==========================================================
      # 16 - CONSTRUCTION DE L'APK
      # ==========================================================
      #
      # C'est ici que Buildozer lance python-for-android et construit
      # l'APK Android.
      # ==========================================================

      - name: "16 - Construire l'APK avec Buildozer"
        shell: bash
        run: |
          set -euo pipefail


          # ------------------------------------------------------
          # S'assurer que tous les outils Android sont accessibles.
          # ------------------------------------------------------

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"


          echo "================================================"
          echo "BUILD ANDROID"
          echo "================================================"


          echo
          echo "Python :"
          python --version


          echo
          echo "Java :"
          java -version


          echo
          echo "Buildozer :"
          buildozer --version


          echo
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"


          echo
          echo "Lancement de Buildozer..."


          buildozer android debug


      # ==========================================================
      # 17 - RECHERCHE DE L'APK
      # ==========================================================

      - name: "17 - Rechercher l'APK généré"
        if: success()
        shell: bash
        run: |
          set -euo pipefail


          echo "================================================"
          echo "FICHIERS ANDROID GÉNÉRÉS"
          echo "================================================"


          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
            \) \
            -not -path "./.git/*" \
            -print


          # ------------------------------------------------------
          # Vérification qu'un APK existe bien dans bin/.
          # ------------------------------------------------------

          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" 2>/dev/null |
              wc -l
          )


          if [ "$APK_COUNT" -eq 0 ]; then

            echo
            echo "ERREUR : aucun APK trouvé dans bin/."

            exit 1

          fi


          echo
          echo "APK trouvé avec succès."


      # ==========================================================
      # 18 - AFFICHER LES INFORMATIONS SUR L'APK
      # ==========================================================

      - name: "18 - Informations sur l'APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail


          echo "================================================"
          echo "CONTENU DU RÉPERTOIRE bin/"
          echo "================================================"

          ls -lah bin/


          echo
          echo "================================================"
          echo "TYPE DES FICHIERS"
          echo "================================================"

          file bin/*.apk


      # ==========================================================
      # 19 - PUBLIER L'APK COMME ARTEFACT
      # ==========================================================
      #
      # L'APK sera disponible dans :
      #
      #   GitHub Actions
      #       -> workflow
      #       -> run
      #       -> Artifacts
      #
      # Nom de l'artefact :
      #
      #   suivi-auto-apk
      # ==========================================================

      - name: "19 - Publier l'APK comme artefact"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 20 - DIAGNOSTICS EN CAS D'ÉCHEC
      # ==========================================================
      #
      # Cette étape ne s'exécute que si une étape précédente échoue.
      #
      # Elle permet d'obtenir dans le log GitHub Actions :
      #
      #   - les versions
      #   - les variables Android
      #   - les licences
      #   - les packages SDK
      #   - la version du NDK
      #   - les fichiers de build
      #
      # Cela facilite fortement l'identification du véritable
      # problème sans devoir modifier immédiatement le workflow.
      # ==========================================================

      - name: "20 - Diagnostics en cas d'échec"
        if: failure()
        shell: bash
        run: |

          echo
          echo "============================================================"
          echo "DIAGNOSTICS BUILD ANDROID"
          echo "============================================================"


          echo
          echo "-------------------- ENVIRONNEMENT --------------------"


          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"


          echo
          echo "Python :"
          python --version || true


          echo
          echo "Java :"
          java -version || true


          echo
          echo "Buildozer :"
          buildozer --version || true


          echo
          echo "-------------------- SDK --------------------"


          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --version ||
            true


          echo
          echo "-------------------- SDK PACKAGES --------------------"


          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --list 2>/dev/null |
            grep -E \
              "platform-tools|platforms;android-${ANDROID_API}|build-tools;${ANDROID_BUILD_TOOLS}|ndk;28" |
            head -50 ||
            true


          echo
          echo "-------------------- LICENCES --------------------"


          find "$ANDROID_HOME/licenses" \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null |
            sort ||
            true


          echo
          echo "-------------------- NDK --------------------"


          if [ -f "$ANDROID_NDK_HOME/source.properties" ]; then

            cat "$ANDROID_NDK_HOME/source.properties"

          else

            echo "source.properties du NDK introuvable."

          fi


          echo
          echo "-------------------- FICHIERS BUILD --------------------"


          find .buildozer \
            -maxdepth 5 \
            -type f \
            \( \
              -name "*.log" \
              -o -name "build.log" \
            \) \
            -print 2>/dev/null |
            head -50 ||
            true


          echo
          echo "-------------------- BIN --------------------"


          ls -lah bin/ 2>/dev/null || true


          echo
          echo "============================================================"
          echo "FIN DES DIAGNOSTICS"
          echo "============================================================"
