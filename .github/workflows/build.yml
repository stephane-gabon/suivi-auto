name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      ANDROID_NDK_VERSION: "28c"

      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ------------------------------------------------------------
      # 3. Java 17
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # 4. Dépendances Linux
      # ------------------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            gettext \
            gettext-base \
            libffi-dev \
            libssl-dev \
            zlib1g-dev


      # ------------------------------------------------------------
      # 5. Installer Buildozer
      # ------------------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          buildozer --version


      # ------------------------------------------------------------
      # 6. Préparer les répertoires Android
      # ------------------------------------------------------------
      - name: Prepare Android directories
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"
          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$SDK/platform-tools"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # 7. Installer Android Command Line Tools
      # ------------------------------------------------------------
      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TEMP="$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$TEMP"

          rm -rf "$SDK/cmdline-tools/latest"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" \
            -O "$TEMP/cmdline-tools.zip"

          unzip -q \
            "$TEMP/cmdline-tools.zip" \
            -d "$TEMP"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$TEMP/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "===== sdkmanager ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --version


      # ------------------------------------------------------------
      # 8. Créer le chemin legacy attendu par Buildozer 1.6.0
      # ------------------------------------------------------------
      - name: Create Buildozer sdkmanager compatibility path
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "===== Compatibility ====="

          ls -la "$SDK/tools/bin"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version


      # ------------------------------------------------------------
      # 9. Accepter les licences Android
      # ------------------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          for i in $(seq 1 30); do
            printf 'y\n'
          done | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "Licences Android traitées."


      # ------------------------------------------------------------
      # 10. Installer SDK 33 + Build Tools
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "===== SDK ====="

          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "SDK 33 OK"
          echo "Build Tools 35 OK"


      # ------------------------------------------------------------
      # 11. Installer réellement NDK r28c
      # ------------------------------------------------------------

      - name: Install Android NDK r28c
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "======================================"
          echo "INSTALLATION NDK r28c"
          echo "======================================"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          echo "======================================"
          echo "VERIFICATION NDK"
          echo "======================================"

          test -f "$NDK/source.properties"

          cat "$NDK/source.properties"

          # Le fichier source.properties contient :
          # Pkg.Revision = 28.2.13676358
          # et non :
          # Pkg.Revision=28.2.13676358

          grep -q \
            "Pkg.Revision = 28.2.13676358" \
            "$NDK/source.properties"

          grep -q \
            "Pkg.ReleaseName = r28c" \
            "$NDK/source.properties"

          echo
          echo "======================================"
          echo " NDK r28c CORRECTEMENT INSTALLE"
          echo "======================================"

          echo "NDK : $NDK"
          echo "Version : 28.2.13676358"
          echo "Release : r28c"


      # ------------------------------------------------------------
      # 12. Variables NDK finales
      # ------------------------------------------------------------
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # 13. Vérification complète
      # ------------------------------------------------------------
      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo "======================================"
          echo "SDK"
          echo "======================================"

          test -d "$SDK"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/35.0.0"

          echo "SDK OK"

          echo "======================================"
          echo "SDKMANAGER"
          echo "======================================"

          test -x "$SDK/tools/bin/sdkmanager"
          "$SDK/tools/bin/sdkmanager" --version

          echo "sdkmanager OK"

          echo "======================================"
          echo "AIDL"
          echo "======================================"

          test -x "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "AIDL OK"

          echo "======================================"
          echo "NDK"
          echo "======================================"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          grep "Pkg.Revision" \
            "$NDK/source.properties"

          echo "NDK r28c OK"

          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          env | grep -E '^ANDROID' | sort || true


      # ------------------------------------------------------------
      # 14. Cache Buildozer
      # ------------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ------------------------------------------------------------
      # 15. Nettoyer uniquement les anciens builds
      # ------------------------------------------------------------
      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

          echo "Ancien build supprimé."


      # ------------------------------------------------------------
      # 16. Build APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        timeout-minutes: 90
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export ANDROIDNDK="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"

          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "ENVIRONNEMENT FINAL"
          echo "======================================"

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo
          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          echo
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "NDK:"
          grep "Pkg.Revision" "$NDK/source.properties"

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          buildozer -v android debug


      # ------------------------------------------------------------
      # 17. Vérifier APK
      # ------------------------------------------------------------
      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "APK PRODUIT"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"

          echo "APK trouvé : $APK"

          ls -lh "$APK"


      # ------------------------------------------------------------
      # 18. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error

