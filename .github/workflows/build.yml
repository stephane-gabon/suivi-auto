# ================================================================
# WORKFLOW GITHUB ACTIONS
# Projet : Suivi Auto
# Fichier : .github/workflows/build.yml
# ================================================================
#
# OBJECTIF
# --------
# Construire automatiquement l'APK Android de l'application Kivy
# "Suivi Auto" avec Buildozer sur GitHub Actions.
#
#
# ENVIRONNEMENT ANDROID UTILISÉ
# -----------------------------
# Python          : 3.10
# Java            : 17
# Buildozer       : 1.6.0
# Cython          : 0.29.37
# Android API     : 33
# Android min API : 24
# Build Tools     : 34.0.0
# Android NDK     : 28.2.13676358 (= 28c côté Buildozer)
#
#
# ARCHITECTURES
# -------------
# arm64-v8a
# armeabi-v7a
#
#
# DÉPENDANCES PYTHON
# ------------------
# python3
# kivy
# plyer
# openpyxl
# pandas
#
# ReportLab est volontairement supprimé.
#
#
# IMPORTANT
# ---------
# Le SDK Android est installé dans :
#
#   ${GITHUB_WORKSPACE}/.android-sdk
#
# Le buildozer.spec doit contenir dans [app] :
#
#   android.sdk_path = .android-sdk
#   android.skip_update = 1
#
# Cela évite que Buildozer utilise son ancien SDK interne :
#
#   /home/runner/.buildozer/android/platform/android-sdk
#
# et évite également qu'il tente de sélectionner une version
# différente des Build Tools, par exemple build-tools;37.0.0.
#
#
# COMPATIBILITÉ SDKMANAGER
# ------------------------
# Les Android Command-Line Tools modernes installent sdkmanager
# dans :
#
#   .android-sdk/cmdline-tools/latest/bin/sdkmanager
#
# Certaines versions de Buildozer / python-for-android recherchent
# encore sdkmanager dans :
#
#   .android-sdk/tools/bin/sdkmanager
#
# Le workflow crée donc un lien symbolique de compatibilité :
#
#   tools/bin -> cmdline-tools/latest/bin
#
# Le SDK moderne reste ainsi utilisé, tout en étant compatible
# avec les outils qui utilisent encore l'ancien chemin.
# ================================================================


# ================================================================
# NOM DU WORKFLOW
# ================================================================

name: Build Android APK - Suivi Auto


# ================================================================
# DÉCLENCHEMENT DU WORKFLOW
# ================================================================
#
# Le workflow est lancé :
#
# - à chaque push sur la branche principale ;
# - manuellement depuis l'onglet Actions de GitHub.
#
# Le déclenchement manuel est particulièrement pratique pour
# relancer une compilation sans créer un nouveau commit.
# ================================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ================================================================
# VARIABLES GLOBALES
# ================================================================

env:

  # --------------------------------------------------------------
  # Versions Python / Java
  # --------------------------------------------------------------

  PYTHON_VERSION: "3.10"

  JAVA_VERSION: "17"


  # --------------------------------------------------------------
  # Versions Buildozer / Cython
  # --------------------------------------------------------------

  BUILDOZER_VERSION: "1.6.0"

  CYTHON_VERSION: "0.29.37"


  # --------------------------------------------------------------
  # Configuration Android
  # --------------------------------------------------------------

  ANDROID_API: "33"

  ANDROID_MIN_API: "24"

  ANDROID_BUILD_TOOLS: "34.0.0"

  # Version complète réellement utilisée par sdkmanager.
  #
  # ATTENTION :
  # sdkmanager n'accepte pas "28c".
  #
  # Il faut utiliser :
  #
  #   ndk;28.2.13676358
  #
  # Buildozer utilise ensuite :
  #
  #   android.ndk = 28c
  #
  ANDROID_NDK_VERSION: "28.2.13676358"


  # --------------------------------------------------------------
  # Répertoire du SDK Android
  # --------------------------------------------------------------
  #
  # Le SDK est installé dans le dépôt GitHub Actions.
  #
  # Cela permet d'avoir exactement le même SDK pour :
  #
  # 1. sdkmanager
  # 2. Buildozer
  # 3. python-for-android
  #
  ANDROID_SDK_ROOT_PATH: "${{ github.workspace }}/.android-sdk"


  # --------------------------------------------------------------
  # Version des Command Line Tools Android
  # --------------------------------------------------------------
  #
  # Cette version fournit sdkmanager.
  #
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"


# ================================================================
# JOB PRINCIPAL
# ================================================================

jobs:

  build-android:

    # --------------------------------------------------------------
    # Machine virtuelle utilisée par GitHub Actions.
    # --------------------------------------------------------------

    runs-on: ubuntu-latest


    # --------------------------------------------------------------
    # PERMISSIONS
    # --------------------------------------------------------------
    #
    # Le workflow n'a pas besoin de permissions particulières
    # sur le dépôt.
    #
    # Le contenu du dépôt peut être lu et l'artefact peut être
    # envoyé via l'action upload-artifact.
    # --------------------------------------------------------------

    permissions:
      contents: read


    # ============================================================
    # ÉTAPES
    # ============================================================

    steps:


      # ==========================================================
      # 1 - RÉCUPÉRATION DU PROJET
      # ==========================================================

      - name: "1 - Récupérer le dépôt"
        uses: actions/checkout@v4

        # --------------------------------------------------------
        # Cette étape récupère :
        #
        # - main.py
        # - buildozer.spec
        # - requirements.txt
        # - screens/
        # - utils/
        # - etc.
        #
        # dans le runner GitHub Actions.
        # --------------------------------------------------------


      # ==========================================================
      # 2 - INSTALLATION DE PYTHON
      # ==========================================================

      - name: "2 - Installer Python 3.10"
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

        # --------------------------------------------------------
        # On utilise Python 3.10 afin de conserver un environnement
        # stable pour Buildozer / python-for-android / Kivy.
        #
        # Aucun cache pip n'est utilisé ici volontairement.
        #
        # Cela évite notamment les problèmes liés à un fichier
        # requirements.txt interprété avant que le dépôt soit
        # correctement préparé.
        # --------------------------------------------------------


      # ==========================================================
      # 3 - INSTALLATION DE JAVA 17
      # ==========================================================

      - name: "3 - Installer Java 17"
        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

        # --------------------------------------------------------
        # Java 17 est utilisé par l'environnement Android/Gradle.
        #
        # On ne demande PAS :
        #
        #   cache: gradle
        #
        # car le projet ne contient pas encore de fichier Gradle
        # nécessitant ce mécanisme de cache.
        # --------------------------------------------------------


      # ==========================================================
      # 4 - VÉRIFICATION DE PYTHON ET JAVA
      # ==========================================================

      - name: "4 - Vérifier Python et Java"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERSIONS DE L'ENVIRONNEMENT"
          echo "================================================"

          echo
          echo "Python :"
          python --version

          echo
          echo "Pip :"
          python -m pip --version

          echo
          echo "Java :"
          java -version

          echo
          echo "JAVA_HOME :"
          echo "${JAVA_HOME}"

          echo
          echo "================================================"
          echo "ENVIRONNEMENT PYTHON/JAVA : OK"
          echo "================================================"


      # ==========================================================
      # 5 - INSTALLATION DES DÉPENDANCES SYSTÈME
      # ==========================================================

      - name: "5 - Installer les dépendances système Linux"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "INSTALLATION DES OUTILS LINUX"
          echo "================================================"

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            rsync \
            file \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses-dev

          echo
          echo "================================================"
          echo "DÉPENDANCES LINUX : OK"
          echo "================================================"


      # ==========================================================
      # 6 - MISE À JOUR DE PIP
      # ==========================================================

      - name: "6 - Mettre à jour pip et les outils Python"
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel


      # ==========================================================
      # 7 - INSTALLATION DE BUILDOZER ET CYTHON
      # ==========================================================

      - name: "7 - Installer Buildozer et Cython"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "INSTALLATION BUILDOZER"
          echo "================================================"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}" \
            "Cython==${CYTHON_VERSION}"

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "Cython :"
          cython --version

          echo
          echo "================================================"
          echo "BUILDOZER / CYTHON : OK"
          echo "================================================"


      # ==========================================================
      # 8 - PRÉPARATION DU SDK ANDROID
      # ==========================================================
      #
      # Le SDK Android est volontairement placé dans le projet :
      #
      #   .android-sdk
      #
      # et NON dans :
      #
      #   ~/.buildozer/android/platform/android-sdk
      #
      # Cette distinction est essentielle.
      # ==========================================================

      - name: "8 - Préparer le SDK Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          echo "================================================"
          echo "PRÉPARATION DU SDK ANDROID"
          echo "================================================"

          echo
          echo "SDK_ROOT :"
          echo "${SDK_ROOT}"

          # ------------------------------------------------------
          # Création du répertoire du SDK.
          # ------------------------------------------------------

          mkdir -p "${SDK_ROOT}/cmdline-tools"

          # ------------------------------------------------------
          # Téléchargement des Android Command Line Tools.
          # ------------------------------------------------------

          CMDLINE_ZIP="${RUNNER_TEMP}/commandlinetools.zip"

          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"

          echo
          echo "Téléchargement :"
          echo "${CMDLINE_URL}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "${CMDLINE_ZIP}" \
            "${CMDLINE_URL}"

          # ------------------------------------------------------
          # Installation des Command Line Tools.
          # ------------------------------------------------------

          rm -rf "${SDK_ROOT}/cmdline-tools/latest"

          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"

          rm -rf "${RUNNER_TEMP}/android-cmdline-tools"

          mkdir -p "${RUNNER_TEMP}/android-cmdline-tools"

          unzip \
            -q \
            "${CMDLINE_ZIP}" \
            -d "${RUNNER_TEMP}/android-cmdline-tools"

          # ------------------------------------------------------
          # Le ZIP officiel contient généralement un dossier :
          #
          #   cmdline-tools/
          #
          # que nous plaçons dans :
          #
          #   .android-sdk/cmdline-tools/latest/
          # ------------------------------------------------------

          cp -R \
            "${RUNNER_TEMP}/android-cmdline-tools/cmdline-tools/." \
            "${SDK_ROOT}/cmdline-tools/latest/"

          # ------------------------------------------------------
          # Vérification de sdkmanager.
          # ------------------------------------------------------

          if [ ! -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo
            echo "ERREUR : sdkmanager est introuvable."

            find "${SDK_ROOT}" \
              -maxdepth 6 \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1
          fi

          echo
          echo "sdkmanager :"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --version

          echo
          echo "================================================"
          echo "COMMAND LINE TOOLS : OK"
          echo "================================================"


      # ==========================================================
      # 9 - CONFIGURATION DES VARIABLES ANDROID
      # ==========================================================

      - name: "9 - Configurer les variables Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          # ------------------------------------------------------
          # Variables Android persistantes pour les étapes
          # suivantes du workflow.
          # ------------------------------------------------------

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "$GITHUB_ENV"

          # ------------------------------------------------------
          # PATH.
          # ------------------------------------------------------

          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "${SDK_ROOT}/tools/bin" >> "$GITHUB_PATH"

          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          echo "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo
          echo "================================================"
          echo "VARIABLES ANDROID"
          echo "================================================"

          echo
          echo "ANDROID_HOME=${SDK_ROOT}"

          echo
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}"

          echo
          echo "ANDROID_NDK_HOME=${NDK_ROOT}"


      # ==========================================================
      # 10 - ACCEPTATION DES LICENCES ANDROID
      # ==========================================================
      #
      # IMPORTANT :
      #
      # Nous n'utilisons PAS :
      #
      #   yes | sdkmanager --licenses
      #
      # car cette méthode peut provoquer :
      #
      #   yes: standard output: Broken pipe
      #
      # et faire échouer GitHub Actions avec le code 1.
      #
      # À la place, nous créons un fichier contenant un nombre
      # fini de réponses "y".
      # ==========================================================

      - name: "10 - Accepter les licences Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          LICENSE_INPUT="${RUNNER_TEMP}/android-license-input.txt"

          echo "================================================"
          echo "ACCEPTATION DES LICENCES ANDROID"
          echo "================================================"

          # ------------------------------------------------------
          # Création d'un nombre suffisant de réponses "y".
          #
          # Le fichier est fini : aucune commande yes infinie
          # n'est utilisée.
          # ------------------------------------------------------

          for i in $(seq 1 100); do
            printf 'y\n'
          done > "${LICENSE_INPUT}"

          # ------------------------------------------------------
          # Exécution de sdkmanager --licenses.
          #
          # set +e est temporairement utilisé afin de pouvoir
          # analyser proprement le résultat de sdkmanager.
          # ------------------------------------------------------

          set +e

          LICENSE_OUTPUT="$(
            "${SDKMANAGER}" --licenses \
              < "${LICENSE_INPUT}" \
              2>&1
          )"

          SDKMANAGER_EXIT_CODE=$?

          set -e

          echo "${LICENSE_OUTPUT}"

          # ------------------------------------------------------
          # Certaines versions de sdkmanager peuvent retourner
          # un code non nul malgré des licences correctement
          # enregistrées.
          #
          # Nous vérifions donc également la présence des fichiers
          # de licences.
          # ------------------------------------------------------

          LICENSE_DIR="${SDK_ROOT}/licenses"

          if [ ! -d "${LICENSE_DIR}" ]; then
            echo
            echo "ERREUR : le répertoire des licences Android"
            echo "n'a pas été créé :"
            echo "${LICENSE_DIR}"

            exit 1
          fi

          LICENSE_COUNT="$(
            find "${LICENSE_DIR}" \
              -type f \
              | wc -l
          )"

          echo
          echo "Nombre de fichiers de licences : ${LICENSE_COUNT}"

          if [ "${LICENSE_COUNT}" -eq 0 ]; then
            echo
            echo "ERREUR : aucune licence Android n'a été"
            echo "enregistrée."

            exit 1
          fi

          echo
          echo "Code retour sdkmanager --licenses :"
          echo "${SDKMANAGER_EXIT_CODE}"

          echo
          echo "================================================"
          echo "LICENCES ANDROID : OK"
          echo "================================================"


      # ==========================================================
      # 11 - INSTALLATION DES COMPOSANTS ANDROID
      # ==========================================================

      - name: "11 - Installer API 33, Build Tools 34.0.0 et NDK 28c"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo "================================================"
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "================================================"

          # ------------------------------------------------------
          # Composants explicitement utilisés par le projet.
          #
          # Aucun build-tools 37.0.0 n'est demandé.
          # ------------------------------------------------------

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo
          echo "================================================"
          echo "COMPOSANTS ANDROID INSTALLÉS"
          echo "================================================"

          echo
          echo "SDK :"
          ls -la "${SDK_ROOT}"

          echo
          echo "Build Tools :"
          ls -la "${SDK_ROOT}/build-tools"

          echo
          echo "Platforms :"
          ls -la "${SDK_ROOT}/platforms"

          echo
          echo "NDK :"
          ls -la "${SDK_ROOT}/ndk"


      # ==========================================================
      # 11 BIS - COMPATIBILITÉ SDKMANAGER POUR BUILDOZER / P4A
      # ==========================================================
      #
      # PROBLÈME RÉSOLU PAR CETTE ÉTAPE
      # --------------------------------
      #
      # Les Android Command-Line Tools modernes installent
      # sdkmanager dans :
      #
      #   .android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # Cependant, certaines versions de la chaîne
      # Buildozer / python-for-android recherchent encore :
      #
      #   .android-sdk/tools/bin/sdkmanager
      #
      # Le log précédent indiquait précisément :
      #
      #   sdkmanager path
      #   "/home/runner/work/suivi-auto/suivi-auto/.android-sdk/tools/bin/sdkmanager"
      #   does not exist
      #
      # Nous créons donc ici un lien symbolique :
      #
      #   .android-sdk/tools/bin
      #       ->
      #   .android-sdk/cmdline-tools/latest/bin
      #
      # IMPORTANT :
      #
      # Nous ne réinstallons pas un ancien sdkmanager.
      #
      # Le sdkmanager moderne reste l'exécutable réel.
      # Le chemin "tools/bin" sert uniquement de compatibilité.
      # ==========================================================

      - name: "11 BIS - Créer la compatibilité sdkmanager"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER_MODERN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          SDKMANAGER_LEGACY="${SDK_ROOT}/tools/bin/sdkmanager"

          echo "================================================"
          echo "COMPATIBILITÉ SDKMANAGER"
          echo "================================================"

          echo
          echo "SDK_ROOT :"
          echo "${SDK_ROOT}"

          echo
          echo "sdkmanager moderne :"
          echo "${SDKMANAGER_MODERN}"

          echo
          echo "sdkmanager legacy :"
          echo "${SDKMANAGER_LEGACY}"


          # ------------------------------------------------------
          # Vérification du sdkmanager moderne.
          # ------------------------------------------------------

          if [ ! -f "${SDKMANAGER_MODERN}" ]; then

            echo
            echo "ERREUR : sdkmanager moderne introuvable."

            echo
            echo "Recherche de sdkmanager dans le SDK :"

            find "${SDK_ROOT}" \
              -maxdepth 8 \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1
          fi


          # ------------------------------------------------------
          # Rendre sdkmanager exécutable.
          # ------------------------------------------------------

          chmod +x "${SDKMANAGER_MODERN}"


          # ------------------------------------------------------
          # Création du répertoire legacy.
          # ------------------------------------------------------

          mkdir -p "${SDK_ROOT}/tools"


          # ------------------------------------------------------
          # Si tools/bin existe déjà, il peut s'agir :
          #
          # - d'un ancien lien ;
          # - d'un ancien répertoire ;
          # - d'un contenu partiel.
          #
          # Nous le supprimons afin de créer un lien propre.
          # ------------------------------------------------------

          if [ -e "${SDK_ROOT}/tools/bin" ] || \
             [ -L "${SDK_ROOT}/tools/bin" ]; then

            echo
            echo "Suppression de l'ancien chemin :"
            echo "${SDK_ROOT}/tools/bin"

            rm -rf "${SDK_ROOT}/tools/bin"
          fi


          # ------------------------------------------------------
          # Création du lien symbolique.
          # ------------------------------------------------------

          ln -s \
            "${SDK_ROOT}/cmdline-tools/latest/bin" \
            "${SDK_ROOT}/tools/bin"


          # ------------------------------------------------------
          # Vérification du chemin moderne.
          # ------------------------------------------------------

          if [ ! -x "${SDKMANAGER_MODERN}" ]; then

            echo
            echo "ERREUR : sdkmanager moderne n'est pas exécutable."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du chemin legacy.
          #
          # C'est cette vérification qui protège contre l'erreur
          # rencontrée lors de la compilation précédente.
          # ------------------------------------------------------

          if [ ! -x "${SDKMANAGER_LEGACY}" ]; then

            echo
            echo "ERREUR : le chemin legacy de sdkmanager"
            echo "n'est pas accessible :"

            echo
            echo "${SDKMANAGER_LEGACY}"

            echo
            echo "Contenu de tools/ :"

            ls -la "${SDK_ROOT}/tools" \
              || true

            exit 1
          fi


          # ------------------------------------------------------
          # Affichage du lien symbolique.
          # ------------------------------------------------------

          echo
          echo "Lien symbolique créé :"

          ls -la "${SDK_ROOT}/tools"


          # ------------------------------------------------------
          # Test du sdkmanager moderne.
          # ------------------------------------------------------

          echo
          echo "Test sdkmanager moderne :"

          "${SDKMANAGER_MODERN}" \
            --version


          # ------------------------------------------------------
          # Test du sdkmanager legacy.
          # ------------------------------------------------------

          echo
          echo "Test sdkmanager legacy :"

          "${SDKMANAGER_LEGACY}" \
            --version


          echo
          echo "================================================"
          echo "COMPATIBILITÉ SDKMANAGER : OK"
          echo "================================================"


      # ==========================================================
      # 12 - VÉRIFICATION DES OUTILS ANDROID
      # ==========================================================

      - name: "12 - Vérifier les outils Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER_MODERN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          SDKMANAGER_LEGACY="${SDK_ROOT}/tools/bin/sdkmanager"

          echo "================================================"
          echo "VÉRIFICATION DU SDK ANDROID"
          echo "================================================"


          # ------------------------------------------------------
          # sdkmanager moderne
          # ------------------------------------------------------

          echo
          echo "sdkmanager moderne :"

          if [ ! -x "${SDKMANAGER_MODERN}" ]; then
            echo
            echo "ERREUR : sdkmanager moderne introuvable :"
            echo "${SDKMANAGER_MODERN}"

            exit 1
          fi

          "${SDKMANAGER_MODERN}" \
            --version


          # ------------------------------------------------------
          # sdkmanager legacy.
          #
          # Buildozer / python-for-android peut utiliser ce chemin.
          # ------------------------------------------------------

          echo
          echo "sdkmanager legacy :"

          if [ ! -x "${SDKMANAGER_LEGACY}" ]; then
            echo
            echo "ERREUR : sdkmanager legacy introuvable :"
            echo "${SDKMANAGER_LEGACY}"

            exit 1
          fi

          "${SDKMANAGER_LEGACY}" \
            --version


          # ------------------------------------------------------
          # adb
          # ------------------------------------------------------

          echo
          echo "adb :"

          "${SDK_ROOT}/platform-tools/adb" \
            version


          # ------------------------------------------------------
          # aapt
          # ------------------------------------------------------

          echo
          echo "aapt :"

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" \
            version


          # ------------------------------------------------------
          # aidl
          # ------------------------------------------------------

          echo
          echo "aidl :"

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl" \
            --version \
            || true


          # ------------------------------------------------------
          # API Android 33
          # ------------------------------------------------------

          echo
          echo "API Android :"

          if [ ! -d "${SDK_ROOT}/platforms/android-${ANDROID_API}" ]; then

            echo
            echo "ERREUR : Android API ${ANDROID_API}"
            echo "n'est pas installée."

            exit 1
          fi

          echo "android-${ANDROID_API} : OK"


          # ------------------------------------------------------
          # Build Tools 34.0.0
          # ------------------------------------------------------

          echo
          echo "Build Tools :"

          if [ ! -d "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" ]; then

            echo
            echo "ERREUR : Build Tools ${ANDROID_BUILD_TOOLS}"
            echo "ne sont pas installés."

            exit 1
          fi

          echo "${ANDROID_BUILD_TOOLS} : OK"


          # ------------------------------------------------------
          # NDK 28.2.13676358
          # ------------------------------------------------------

          echo
          echo "NDK :"

          NDK_PROPERTIES="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          if [ ! -f "${NDK_PROPERTIES}" ]; then

            echo
            echo "ERREUR : source.properties du NDK est introuvable :"
            echo "${NDK_PROPERTIES}"

            exit 1
          fi

          cat "${NDK_PROPERTIES}"


          echo
          echo "================================================"
          echo "SDK ANDROID : OK"
          echo "================================================"


      # ==========================================================
      # 13 - VÉRIFICATION DE BUILDOZER.SPEC
      # ==========================================================
      #
      # Cette étape vérifie que les principaux paramètres Android
      # sont présents dans buildozer.spec.
      #
      # IMPORTANT :
      # On évite ici les expressions régulières trop strictes.
      #
      # Un fichier INI peut contenir :
      #
      #   android.skip_update = 1
      #
      # ou :
      #
      #   android.skip_update = true
      #
      # ou encore des espaces supplémentaires.
      #
      # Le contrôle vérifie donc la présence et la valeur logique
      # du paramètre sans dépendre exactement de la mise en forme.
      # ==========================================================

      - name: "13 - Vérifier buildozer.spec"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VÉRIFICATION BUILDOZER.SPEC"
          echo "================================================"


          # ------------------------------------------------------
          # Vérification de l'existence du fichier.
          # ------------------------------------------------------

          if [ ! -f buildozer.spec ]; then

            echo
            echo "ERREUR : buildozer.spec est introuvable."

            exit 1
          fi


          # ------------------------------------------------------
          # Affichage de la configuration Android.
          # ------------------------------------------------------

          echo
          echo "Configuration Android détectée :"

          grep -nE \
            '^\[app\]|^android\.(api|minapi|sdk_build_tools|ndk|sdk_path|skip_update|archs)[[:space:]]*=' \
            buildozer.spec \
            || true


          # ------------------------------------------------------
          # Vérification de la section [app].
          # ------------------------------------------------------

          if ! grep -qE '^\[app\][[:space:]]*$' buildozer.spec; then

            echo
            echo "ERREUR : la section [app] est absente."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification d'une ancienne section [app:android].
          #
          # Les paramètres Android doivent être directement
          # définis dans [app].
          # ------------------------------------------------------

          if grep -qE '^\[app:android\][[:space:]]*$' buildozer.spec; then

            echo
            echo "ERREUR : une section [app:android] existe encore."

            echo
            echo "Les paramètres Android doivent être placés"
            echo "directement dans [app]."

            exit 1
          fi


          # ------------------------------------------------------
          # Fonction de vérification d'une propriété.
          #
          # On recherche la clé indépendamment du nombre d'espaces.
          # ------------------------------------------------------

          check_property() {

            local property="$1"

            if ! grep -qE \
              "^[[:space:]]*${property}[[:space:]]*=" \
              buildozer.spec; then

              echo
              echo "ERREUR : propriété absente : ${property}"

              exit 1
            fi
          }


          # ------------------------------------------------------
          # Vérification des propriétés obligatoires.
          # ------------------------------------------------------

          check_property "android.api"

          check_property "android.minapi"

          check_property "android.sdk_build_tools"

          check_property "android.ndk"

          check_property "android.sdk_path"

          check_property "android.skip_update"

          check_property "android.archs"


          # ------------------------------------------------------
          # Vérification des valeurs importantes.
          #
          # On extrait la valeur située après le "=" puis on
          # supprime les espaces.
          # ------------------------------------------------------

          get_property() {

            local property="$1"

            awk -F'=' -v key="${property}" '
              $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
                value=$2

                # Supprimer les espaces au début.
                sub(/^[[:space:]]+/, "", value)

                # Supprimer les espaces à la fin.
                sub(/[[:space:]]+$/, "", value)

                print value
                exit
              }
            ' buildozer.spec
          }


          # ------------------------------------------------------
          # API Android.
          # ------------------------------------------------------

          ANDROID_API_VALUE="$(get_property "android.api")"

          if [ "${ANDROID_API_VALUE}" != "33" ]; then

            echo
            echo "ERREUR : android.api doit être 33."

            echo "Valeur détectée : ${ANDROID_API_VALUE}"

            exit 1
          fi


          # ------------------------------------------------------
          # API minimale.
          # ------------------------------------------------------

          ANDROID_MIN_API_VALUE="$(get_property "android.minapi")"

          if [ "${ANDROID_MIN_API_VALUE}" != "24" ]; then

            echo
            echo "ERREUR : android.minapi doit être 24."

            echo "Valeur détectée : ${ANDROID_MIN_API_VALUE}"

            exit 1
          fi


          # ------------------------------------------------------
          # Build Tools.
          # ------------------------------------------------------

          ANDROID_BUILD_TOOLS_VALUE="$(get_property "android.sdk_build_tools")"

          if [ "${ANDROID_BUILD_TOOLS_VALUE}" != "34.0.0" ]; then

            echo
            echo "ERREUR : android.sdk_build_tools doit être 34.0.0."

            echo "Valeur détectée : ${ANDROID_BUILD_TOOLS_VALUE}"

            exit 1
          fi


          # ------------------------------------------------------
          # NDK.
          # ------------------------------------------------------

          ANDROID_NDK_VALUE="$(get_property "android.ndk")"

          if [ "${ANDROID_NDK_VALUE}" != "28c" ]; then

            echo
            echo "ERREUR : android.ndk doit être 28c."

            echo "Valeur détectée : ${ANDROID_NDK_VALUE}"

            exit 1
          fi


          # ------------------------------------------------------
          # Chemin du SDK.
          # ------------------------------------------------------

          ANDROID_SDK_PATH_VALUE="$(get_property "android.sdk_path")"

          if [ "${ANDROID_SDK_PATH_VALUE}" != ".android-sdk" ]; then

            echo
            echo "ERREUR : android.sdk_path doit être .android-sdk."

            echo "Valeur détectée : ${ANDROID_SDK_PATH_VALUE}"

            exit 1
          fi


          # ------------------------------------------------------
          # android.skip_update.
          #
          # Buildozer accepte une valeur booléenne.
          #
          # Nous acceptons donc :
          #
          #   1
          #   true
          #   True
          #   TRUE
          #   yes
          #
          # afin de ne pas bloquer le workflow à cause de la
          # représentation choisie dans le fichier INI.
          # ------------------------------------------------------

          ANDROID_SKIP_UPDATE_VALUE="$(get_property "android.skip_update")"

          case "${ANDROID_SKIP_UPDATE_VALUE,,}" in

            1|true|yes|on)

              echo
              echo "android.skip_update = ${ANDROID_SKIP_UPDATE_VALUE}"

              echo "Valeur activée : OK"

              ;;


            *)

              echo
              echo "ERREUR : android.skip_update doit être activé."

              echo "Valeur détectée : ${ANDROID_SKIP_UPDATE_VALUE}"

              echo
              echo "Valeurs acceptées : 1, true, yes ou on."

              exit 1

              ;;

          esac


          # ------------------------------------------------------
          # Architecture.
          # ------------------------------------------------------

          ANDROID_ARCHS_VALUE="$(get_property "android.archs")"

          if [[ "${ANDROID_ARCHS_VALUE}" != *"arm64-v8a"* ]]; then

            echo
            echo "ERREUR : arm64-v8a est absent de android.archs."

            echo "Valeur détectée : ${ANDROID_ARCHS_VALUE}"

            exit 1
          fi


          if [[ "${ANDROID_ARCHS_VALUE}" != *"armeabi-v7a"* ]]; then

            echo
            echo "ERREUR : armeabi-v7a est absent de android.archs."

            echo "Valeur détectée : ${ANDROID_ARCHS_VALUE}"

            exit 1
          fi


          # ------------------------------------------------------
          # Résumé.
          # ------------------------------------------------------

          echo
          echo "================================================"
          echo "CONFIGURATION BUILDOZER.SPEC : VALIDE"
          echo "================================================"

          echo
          echo "API Android       : ${ANDROID_API_VALUE}"

          echo "API minimale      : ${ANDROID_MIN_API_VALUE}"

          echo "Build Tools       : ${ANDROID_BUILD_TOOLS_VALUE}"

          echo "NDK               : ${ANDROID_NDK_VALUE}"

          echo "SDK               : ${ANDROID_SDK_PATH_VALUE}"

          echo "Skip update       : ${ANDROID_SKIP_UPDATE_VALUE}"

          echo "Architectures     : ${ANDROID_ARCHS_VALUE}"

          echo
          echo "================================================"


      # ==========================================================
      # 14 - VÉRIFICATION DE LA SUPPRESSION DE REPORTLAB
      # ==========================================================
      #
      # ReportLab a été supprimé de l'application.
      #
      # IMPORTANT :
      # Cette vérification ne doit PAS rechercher simplement le mot
      # "reportlab" dans tout le fichier.
      #
      # Pourquoi ?
      #
      # Le buildozer.spec peut contenir des commentaires comme :
      #
      #   # ReportLab est volontairement absent.
      #
      # Ces commentaires ne sont pas lus comme des dépendances
      # par Buildozer.
      #
      # Nous vérifions donc uniquement les configurations actives
      # qui pourraient réellement réintroduire ReportLab.
      # ==========================================================

      - name: "14 - Vérifier suppression de ReportLab"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VÉRIFICATION REPORTLAB"
          echo "================================================"


          # ======================================================
          # 14.1 - VÉRIFICATION DES FICHIERS PYTHON
          # ======================================================

          echo
          echo "Recherche dans les fichiers Python..."

          if grep -RniE \
            "reportlab|generer_rapport_pdf" \
            . \
            --include="*.py" \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=.android-sdk; then

            echo
            echo "ERREUR : une référence ReportLab existe encore"
            echo "dans le code Python."

            exit 1
          fi

          echo "Aucune référence ReportLab dans le code Python."


          # ======================================================
          # 14.2 - VÉRIFICATION DES DÉPENDANCES DE BUILDOZER.SPEC
          # ======================================================

          echo
          echo "Vérification des paramètres actifs de buildozer.spec..."

          SPEC_CLEAN="${RUNNER_TEMP}/buildozer-spec-clean.txt"

          sed \
            -E \
            '/^[[:space:]]*[#;]/d' \
            buildozer.spec \
            > "${SPEC_CLEAN}"


          echo
          echo "Configuration active de buildozer.spec :"

          cat "${SPEC_CLEAN}"


          # ------------------------------------------------------
          # Extraction de la ligne requirements.
          #
          # Nous faisons cette vérification en deux temps afin
          # d'éviter une expression régulière ambiguë avec
          # l'opérateur ^ placé à l'intérieur d'un motif complexe.
          # ------------------------------------------------------

          echo
          echo "Recherche de ReportLab dans les dépendances..."

          REQUIREMENTS_LINE="$(
            grep -Ei \
              '^[[:space:]]*requirements[[:space:]]*=' \
              "${SPEC_CLEAN}" \
              || true
          )"


          if printf '%s\n' "${REQUIREMENTS_LINE}" |
             grep -qiE \
               '(^|[,[:space:]])reportlab([<>=!~0-9]|[,[:space:]]|$)'; then

            echo
            echo "ERREUR : ReportLab est encore présent dans"
            echo "les dépendances actives de buildozer.spec."

            echo
            echo "Ligne détectée :"
            echo "${REQUIREMENTS_LINE}"

            exit 1
          fi


          # ------------------------------------------------------
          # Recherche d'une recette locale Python-for-Android.
          # ------------------------------------------------------

          echo
          echo "Recherche de recettes locales..."

          if grep -niE \
            '^[[:space:]]*p4a\.local_recipes[[:space:]]*=' \
            "${SPEC_CLEAN}"; then

            echo
            echo "ERREUR : p4a.local_recipes est encore configuré."

            exit 1
          fi


          # ======================================================
          # 14.3 - VÉRIFICATION DE requirements.txt
          # ======================================================

          if [ -f requirements.txt ]; then

            echo
            echo "Vérification de requirements.txt..."

            REQUIREMENTS_CLEAN="${RUNNER_TEMP}/requirements-clean.txt"

            sed \
              -E \
              '/^[[:space:]]*#/d; /^[[:space:]]*$/d' \
              requirements.txt \
              > "${REQUIREMENTS_CLEAN}"


            if grep -niE \
              '^[[:space:]]*reportlab([<>=!~]|$)' \
              "${REQUIREMENTS_CLEAN}"; then

              echo
              echo "ERREUR : ReportLab est encore présent"
              echo "dans requirements.txt."

              exit 1
            fi

            echo "requirements.txt : aucune dépendance ReportLab."

          else

            echo
            echo "AVERTISSEMENT : requirements.txt est absent."

          fi


          # ======================================================
          # 14.4 - VÉRIFICATION DES RECETTES LOCALES
          # ======================================================

          if [ -d p4a-recipes ]; then

            echo
            echo "Vérification du répertoire p4a-recipes..."

            REPORTLAB_RECIPES="$(
              find p4a-recipes \
                -iname "*reportlab*" \
                -print
            )"


            if [ -n "${REPORTLAB_RECIPES}" ]; then

              echo
              echo "ERREUR : une recette ReportLab existe encore :"

              echo "${REPORTLAB_RECIPES}"

              exit 1
            fi

            echo "Aucune recette ReportLab dans p4a-recipes/."

          else

            echo
            echo "p4a-recipes/ absent : aucune recette locale."

          fi


          # ======================================================
          # 14.5 - RÉSULTAT FINAL
          # ======================================================

          echo
          echo "================================================"
          echo "REPORTLAB : CORRECTEMENT SUPPRIMÉ"
          echo "================================================"

          echo
          echo "Les commentaires documentaires ne sont pas considérés"
          echo "comme des dépendances."

          echo
          echo "Aucune référence ReportLab active n'a été détectée."


      # ==========================================================
      # 15 - NETTOYAGE DU CACHE BUILDOZER
      # ==========================================================
      #
      # IMPORTANT :
      #
      # Nous supprimons UNIQUEMENT .buildozer.
      #
      # Nous ne supprimons PAS :
      #
      #   .android-sdk
      #
      # car ce répertoire contient le SDK que Buildozer doit
      # maintenant utiliser.
      # ==========================================================

      - name: "15 - Nettoyer le cache Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NETTOYAGE BUILDOZER"
          echo "================================================"

          rm -rf .buildozer

          echo
          echo ".buildozer supprimé."

          echo
          echo "Vérification du SDK :"

          if [ ! -d "${ANDROID_SDK_ROOT_PATH}" ]; then

            echo
            echo "ERREUR : .android-sdk a été supprimé ou"
            echo "n'existe plus."

            exit 1
          fi

          echo
          echo ".android-sdk est toujours présent."

          echo
          echo "================================================"
          echo "NETTOYAGE : OK"
          echo "================================================"


      # ==========================================================
      # 16 - DERNIÈRE VÉRIFICATION DU SDK
      # ==========================================================
      #
      # Cette étape est volontairement placée juste avant
      # Buildozer.
      #
      # Elle garantit que le SDK n'a pas disparu pendant les
      # étapes précédentes.
      # ==========================================================

      - name: "16 - Vérifier le SDK juste avant Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER_MODERN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          SDKMANAGER_LEGACY="${SDK_ROOT}/tools/bin/sdkmanager"

          echo "================================================"
          echo "SDK UTILISÉ PAR BUILDOZER"
          echo "================================================"


          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME}"

          echo
          echo "ANDROID_SDK_ROOT :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "SDK_ROOT attendu :"
          echo "${SDK_ROOT}"


          # ------------------------------------------------------
          # Vérification que les variables pointent bien vers le
          # SDK du projet.
          # ------------------------------------------------------

          if [ "${ANDROID_HOME}" != "${SDK_ROOT}" ]; then

            echo
            echo "ERREUR : ANDROID_HOME ne pointe pas vers"
            echo ".android-sdk."

            exit 1
          fi


          if [ "${ANDROID_SDK_ROOT}" != "${SDK_ROOT}" ]; then

            echo
            echo "ERREUR : ANDROID_SDK_ROOT ne pointe pas vers"
            echo ".android-sdk."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du sdkmanager moderne.
          # ------------------------------------------------------

          echo
          echo "sdkmanager moderne :"

          if [ ! -x "${SDKMANAGER_MODERN}" ]; then

            echo
            echo "ERREUR : sdkmanager moderne est introuvable :"

            echo "${SDKMANAGER_MODERN}"

            exit 1
          fi

          "${SDKMANAGER_MODERN}" \
            --version


          # ------------------------------------------------------
          # Vérification du sdkmanager legacy.
          #
          # C'est le chemin utilisé dans l'erreur précédente.
          # ------------------------------------------------------

          echo
          echo "sdkmanager legacy :"

          if [ ! -x "${SDKMANAGER_LEGACY}" ]; then

            echo
            echo "ERREUR : sdkmanager legacy est introuvable :"

            echo "${SDKMANAGER_LEGACY}"

            echo
            echo "Contenu de tools/ :"

            ls -la "${SDK_ROOT}/tools" \
              || true

            exit 1
          fi

          "${SDKMANAGER_LEGACY}" \
            --version


          # ------------------------------------------------------
          # Vérification de aidl.
          #
          # C'est précisément l'outil qui manquait dans un log
          # précédent.
          # ------------------------------------------------------

          AIDL="${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          if [ ! -x "${AIDL}" ]; then

            echo
            echo "ERREUR : aidl est introuvable :"

            echo "${AIDL}"

            exit 1
          fi

          echo
          echo "aidl :"

          "${AIDL}" \
            --version \
            || true


          # ------------------------------------------------------
          # Vérification de l'API Android.
          # ------------------------------------------------------

          if [ ! -d "${SDK_ROOT}/platforms/android-${ANDROID_API}" ]; then

            echo
            echo "ERREUR : Android API ${ANDROID_API}"
            echo "introuvable."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du Build Tools.
          # ------------------------------------------------------

          if [ ! -d "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" ]; then

            echo
            echo "ERREUR : Build Tools ${ANDROID_BUILD_TOOLS}"
            echo "introuvables."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du NDK.
          # ------------------------------------------------------

          if [ ! -f "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties" ]; then

            echo
            echo "ERREUR : NDK ${ANDROID_NDK_VERSION}"
            echo "introuvable."

            exit 1
          fi


          echo
          echo "================================================"
          echo "SDK PRÊT POUR BUILDOZER"
          echo "================================================"


      # ==========================================================
      # 17 - AFFICHAGE DE LA CONFIGURATION BUILDOZER
      # ==========================================================
      #
      # Cette étape permet de voir dans les logs la configuration
      # réellement utilisée avant de lancer une compilation
      # potentiellement longue.
      # ==========================================================

      - name: "17 - Afficher la configuration Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "CONFIGURATION BUILDOZER"
          echo "================================================"

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "Répertoire courant :"
          pwd

          echo
          echo "SDK Android :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "NDK Android :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "Configuration buildozer.spec :"

          sed -n \
            '/^\[app\]/,/^\[buildozer\]/p' \
            buildozer.spec


      # ==========================================================
      # 18 - COMPILATION DE L'APK
      # ==========================================================
      #
      # Le point essentiel ici est que Buildozer doit maintenant
      # lire :
      #
      #   android.sdk_path = .android-sdk
      #
      # depuis [app] dans buildozer.spec.
      #
      # Et :
      #
      #   android.skip_update = 1
      #
      # empêche Buildozer de tenter une mise à jour automatique
      # du SDK.
      #
      # Le chemin legacy sdkmanager est également disponible :
      #
      #   .android-sdk/tools/bin/sdkmanager
      #
      # afin de satisfaire les composants de la chaîne de build
      # qui utilisent encore cet ancien emplacement.
      # ==========================================================

      - name: "18 - Construire l'APK Android"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "DÉBUT DE LA COMPILATION ANDROID"
          echo "================================================"

          echo
          echo "SDK utilisé :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "NDK utilisé :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "Build Tools attendus :"
          echo "${ANDROID_BUILD_TOOLS}"

          echo
          echo "API Android :"
          echo "${ANDROID_API}"

          echo
          echo "API minimale :"
          echo "${ANDROID_MIN_API}"

          echo
          echo "sdkmanager moderne :"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "sdkmanager legacy :"
          echo "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"

          echo
          echo "================================================"
          echo "BUILDOZER ANDROID DEBUG"
          echo "================================================"

          buildozer android debug


      # ==========================================================
      # 19 - RECHERCHE DE L'APK
      # ==========================================================
      #
      # Après une compilation réussie, Buildozer place normalement
      # l'APK dans :
      #
      #   bin/
      #
      # Cette étape vérifie que le fichier existe réellement.
      # ==========================================================

      - name: "19 - Vérifier l'APK généré"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "RECHERCHE DE L'APK"
          echo "================================================"

          if [ ! -d bin ]; then

            echo
            echo "ERREUR : le répertoire bin/ n'existe pas."

            exit 1
          fi


          APK_COUNT="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"


          echo
          echo "Nombre d'APK trouvés : ${APK_COUNT}"


          if [ "${APK_COUNT}" -eq 0 ]; then

            echo
            echo "ERREUR : aucun APK n'a été généré."

            echo
            echo "Contenu de bin/ :"

            find bin \
              -maxdepth 2 \
              -type f \
              -print \
              || true

            exit 1
          fi


          echo
          echo "APK générés :"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print


          echo
          echo "Type des APK :"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -exec file {} \;


          echo
          echo "================================================"
          echo "APK : OK"
          echo "================================================"


      # ==========================================================
      # 20 - TÉLÉVERSEMENT DE L'APK
      # ==========================================================
      #
      # L'APK est publié comme artefact GitHub Actions.
      #
      # Après la fin du workflow :
      #
      # GitHub
      #   → Actions
      #   → workflow Build Android APK - Suivi Auto
      #   → Artifacts
      #   → suivi-auto-apk
      #
      # permettra de récupérer l'APK.
      # ==========================================================

      - name: "20 - Publier l'APK comme artefact"
        uses: actions/upload-artifact@v4

        with:
          name: suivi-auto-apk

          path: bin/*.apk

          if-no-files-found: error

          retention-days: 14


      # ==========================================================
      # 21 - DIAGNOSTICS EN CAS D'ÉCHEC
      # ==========================================================
      #
      # Cette étape est exécutée uniquement si une étape
      # précédente échoue.
      #
      # Elle permet de récupérer rapidement les informations
      # nécessaires au diagnostic sans devoir modifier le
      # workflow à chaque tentative.
      # ==========================================================

      - name: "21 - Diagnostics en cas d'échec"
        if: failure()
        shell: bash
        run: |
          echo "================================================"
          echo "DIAGNOSTICS DE COMPILATION"
          echo "================================================"

          echo
          echo "Répertoire courant :"
          pwd

          echo
          echo "Contenu racine :"
          ls -la || true

          echo
          echo "Variables Android :"

          echo "ANDROID_HOME=${ANDROID_HOME:-non défini}"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-non défini}"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-non défini}"


          echo
          echo "SDK Android :"

          if [ -d "${ANDROID_SDK_ROOT_PATH}" ]; then

            echo
            echo "sdkmanager moderne :"

            ls -la \
              "${ANDROID_SDK_ROOT_PATH}/cmdline-tools/latest/bin/sdkmanager" \
              2>/dev/null \
              || true


            echo
            echo "sdkmanager legacy :"

            ls -la \
              "${ANDROID_SDK_ROOT_PATH}/tools/bin/sdkmanager" \
              2>/dev/null \
              || true


            echo
            echo "Build Tools :"

            find "${ANDROID_SDK_ROOT_PATH}/build-tools" \
              -maxdepth 2 \
              -type f \
              -name "aidl" \
              -print \
              2>/dev/null \
              || true


            echo
            echo "Platforms :"

            find "${ANDROID_SDK_ROOT_PATH}/platforms" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print \
              2>/dev/null \
              || true


            echo
            echo "NDK :"

            find "${ANDROID_SDK_ROOT_PATH}/ndk" \
              -maxdepth 2 \
              -type f \
              -name "source.properties" \
              -print \
              2>/dev/null \
              || true

          else

            echo
            echo "Le SDK Android n'existe plus."

          fi


          echo
          echo "Buildozer :"

          buildozer --version \
            2>&1 \
            || true


          echo
          echo "buildozer.spec :"

          if [ -f buildozer.spec ]; then

            cat buildozer.spec

          else

            echo "buildozer.spec introuvable."

          fi


          echo
          echo "Contenu de bin/ :"

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true


          echo
          echo "Contenu de .buildozer/android/platform/ :"

          find .buildozer/android/platform \
            -maxdepth 3 \
            -type d \
            -print \
            2>/dev/null \
            | head -100 \
            || true


          echo
          echo "================================================"
          echo "FIN DES DIAGNOSTICS"
          echo "================================================"
