name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "33"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK: "28c"
      REPORTLAB_VERSION: "fe660f227cac"
      REPORTLAB_ARCHIVE: "p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. Python dependencies
      # ============================================================
      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      # ============================================================
      # 5. Android SDK paths
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 6. Download Android command line tools
      # ============================================================
      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TMP="$RUNNER_TEMP/android-cmdline-tools"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          cd "$TMP"

          wget -q --show-progress \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"

          cp -a cmdline-tools/. "$SDK/cmdline-tools/latest/"

          echo "sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      # ============================================================
      # 7. Legacy sdkmanager compatibility
      # ============================================================
      - name: Create legacy sdkmanager path
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      # ============================================================
      # 8. Accept Android licenses
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

      # ============================================================
      # 9. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      # ============================================================
      # 10. Verify Android SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -x "$SDK/platform-tools/adb"

          test -x \
            "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aapt"

          echo "adb:"
          "$SDK/platform-tools/adb" version

          echo "aapt:"
          "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aapt" version

      # ============================================================
      # 11. Cache Buildozer downloads
      # ============================================================
      - name: Cache Buildozer Android packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-${{ runner.os }}-

      # ============================================================
      # 12. Verify ReportLab recipe
      # ============================================================
      - name: Verify ReportLab recipe
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ReportLab recipe ==="
          test -f p4a-recipes/reportlab/__init__.py
          cat p4a-recipes/reportlab/__init__.py

          echo
          echo "=== ReportLab archive ==="
          test -f "$REPORTLAB_ARCHIVE"
          ls -lh "$REPORTLAB_ARCHIVE"

      # ============================================================
      # 13. Prepare local ReportLab archive
      # ============================================================
      - name: Prepare local ReportLab archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.buildozer"

          cp \
            "$GITHUB_WORKSPACE/$REPORTLAB_ARCHIVE" \
            "$HOME/.buildozer/reportlab-${REPORTLAB_VERSION}.tar.gz"

          test -s \
            "$HOME/.buildozer/reportlab-${REPORTLAB_VERSION}.tar.gz"

          echo "Local ReportLab archive:"
          ls -lh \
            "$HOME/.buildozer/reportlab-${REPORTLAB_VERSION}.tar.gz"

      # ============================================================
      # 14. Verify ReportLab recipe syntax
      # ============================================================
      - name: Validate ReportLab recipe Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            p4a-recipes/reportlab/__init__.py

          echo "ReportLab recipe syntax OK."

      # ============================================================
      # 15. Verify buildozer.spec
      # ============================================================
      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -euo pipefail

          test -f buildozer.spec

          echo "=== Relevant buildozer.spec settings ==="
          grep -E \
            '^(requirements|p4a\.local_recipes|requirements\.source\.)' \
            buildozer.spec || true

      # ============================================================
      # 16. Clean previous Buildozer project build
      # ============================================================
      - name: Clean Buildozer project directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin

      # ============================================================
      # 17. Build APK
      # ============================================================
      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build_logs

          buildozer -v android debug 2>&1 | tee build_logs/buildozer.log

      # ============================================================
      # 18. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== bin/ ==="
          ls -lah bin/

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo
          echo "APK generated successfully:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

      # ============================================================
      # 19. Make sure the old ReportLab server was not used
      # ============================================================
      - name: Verify ReportLab source
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -f build_logs/buildozer.log ]; then
            if grep -q "hg.reportlab.com" build_logs/buildozer.log; then
              echo "ERROR: Build attempted to download ReportLab from hg.reportlab.com"
              exit 1
            fi

            echo "No hg.reportlab.com download detected."
          fi

      # ============================================================
      # 20. Upload APK
      # ============================================================
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error

      # ============================================================
      # 21. Upload build log if build fails
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-build-logs
          path: build_logs/
          if-no-files-found: warn
