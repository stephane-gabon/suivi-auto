name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PYTHON_VERSION: "3.10"

      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"
      ANDROID_NDK_VERSION: "28c"

      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

      REPORTLAB_VERSION: "5.0.1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            gzip \
            bzip2 \
            lbzip2 \
            patch \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            gettext \
            gettext-base \
            libffi-dev \
            libssl-dev \
            zlib1g-dev

      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          buildozer --version
          python -m pip show buildozer

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          mkdir -p "$SDK"

          {
            echo "ANDROIDSDK=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"

            echo "ANDROIDNDK=$NDK"
            echo "ANDROID_NDK=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"

            echo "ANDROIDAPI=33"
            echo "ANDROIDMINAPI=24"
            echo "ANDROID_NDK_VERSION=28c"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/build-tools/35.0.0"
          } >> "$GITHUB_PATH"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TEMP="$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$SDK"
          mkdir -p "$TEMP"

          URL="https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip"

          wget \
            --retry-connrefused \
            --waitretry=5 \
            --timeout=60 \
            --tries=5 \
            "$URL" \
            -O "$TEMP/cmdline-tools.zip"

          test -s "$TEMP/cmdline-tools.zip"

          unzip -q \
            "$TEMP/cmdline-tools.zip" \
            -d "$TEMP"

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$TEMP/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/"*

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"

      - name: Install Android NDK 28c
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          NDK="$SDK/ndk/28.2.13676358"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          grep -q \
            "Pkg.Revision = 28.2.13676358" \
            "$NDK/source.properties"

          grep -q \
            "Pkg.ReleaseName = r28c" \
            "$NDK/source.properties"

      - name: Configure final Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          {
            echo "ANDROIDSDK=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"

            echo "ANDROIDNDK=$NDK"
            echo "ANDROID_NDK=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"

            echo "ANDROIDAPI=33"
            echo "ANDROIDMINAPI=24"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/build-tools/35.0.0"
          } >> "$GITHUB_PATH"

      - name: Prepare official ReportLab source
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${REPORTLAB_VERSION}"

          BASE_URL="https://www.reportlab.com/pypi/simple/reportlab"
          ARCHIVE="reportlab-${VERSION}.tar.gz"

          WORK="$RUNNER_TEMP/reportlab"
          SOURCE="$WORK/reportlab-${VERSION}"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          echo "ReportLab version: $VERSION"
          echo "Source officielle:"
          echo "$BASE_URL/$ARCHIVE"

          wget \
            --retry-connrefused \
            --waitretry=5 \
            --timeout=60 \
            --tries=5 \
            "$BASE_URL/$ARCHIVE" \
            -O "$WORK/$ARCHIVE"

          test -s "$WORK/$ARCHIVE"

          tar -xzf "$WORK/$ARCHIVE" -C "$WORK"

          test -d "$SOURCE"
          test -f "$SOURCE/setup.py"

          echo "P4A_reportlab_DIR=$SOURCE" >> "$GITHUB_ENV"
          echo "REPORTLAB_SOURCE=$SOURCE" >> "$GITHUB_ENV"

          ls -la "$SOURCE"

      - name: Verify local ReportLab recipe
        shell: bash
        run: |
          set -euxo pipefail

          test -f p4a-recipes/reportlab/__init__.py

          echo "===== RECETTE REPORTLAB ====="
          cat p4a-recipes/reportlab/__init__.py

          echo
          echo "===== SOURCE REPORTLAB ====="

          test -n "${P4A_reportlab_DIR:-}"
          test -d "$P4A_reportlab_DIR"
          test -f "$P4A_reportlab_DIR/setup.py"

          echo "$P4A_reportlab_DIR"

          echo
          echo "===== VERIFICATION SOURCE ====="

          if grep -R \
            "hg.reportlab.com" \
            p4a-recipes \
            2>/dev/null; then

            echo "ERREUR: ancienne URL ReportLab détectée."
            exit 1
          fi

          echo "Aucune référence à hg.reportlab.com."

      - name: Verify project files
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec
          test -f main.py

          echo "buildozer.spec OK"
          echo "main.py OK"

          echo
          grep -E \
            '^android\.archs|^android\.arch' \
            buildozer.spec || true

          echo
          grep '^requirements' \
            buildozer.spec || true

      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          AIDL="$SDK/build-tools/35.0.0/aidl"

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== BUILDOZER ====="
          buildozer --version

          echo
          echo "===== SDK ====="

          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$AIDL"

          echo "SDK OK"

          echo
          echo "===== SDKMANAGER ====="

          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

          echo
          echo "===== NDK ====="

          test -d "$NDK"
          test -f "$NDK/source.properties"

          grep -q \
            "Pkg.Revision = 28.2.13676358" \
            "$NDK/source.properties"

          grep -q \
            "Pkg.ReleaseName = r28c" \
            "$NDK/source.properties"

          echo "NDK 28c OK"

          echo
          echo "===== AIDL ====="

          "$AIDL" --help >/dev/null

          echo "AIDL OK"

      - name: Initialize Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          buildozer --version
          python -m pip show buildozer

          buildozer android p4a -- --help

      - name: Verify P4A ReportLab override
        shell: bash
        run: |
          set -euxo pipefail

          P4A="$HOME/.buildozer/android/platform/python-for-android"

          test -d "$P4A"
          test -d "$P4A_reportlab_DIR"

          echo "P4A:"
          echo "$P4A"

          echo
          echo "ReportLab:"
          echo "$P4A_reportlab_DIR"

          ls -la "$P4A_reportlab_DIR"

      - name: Clean Android build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            .buildozer/android/platform/build-* \
            .buildozer/android/platform/dists

      - name: Build APK
        shell: bash
        timeout-minutes: 120
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export ANDROIDNDK="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"

          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export P4A_reportlab_DIR="$REPORTLAB_SOURCE"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "BUILD ANDROID"
          echo "======================================"

          java -version

          echo
          buildozer --version

          echo
          echo "SDK:"
          echo "$ANDROIDSDK"

          echo
          echo "NDK:"
          echo "$ANDROIDNDK"

          grep -E \
            'Pkg.Revision|Pkg.ReleaseName' \
            "$NDK/source.properties"

          echo
          echo "ReportLab:"
          echo "$P4A_reportlab_DIR"

          test -d "$P4A_reportlab_DIR"
          test -f "$P4A_reportlab_DIR/setup.py"

          if grep -R \
            "hg.reportlab.com" \
            "$P4A_reportlab_DIR" \
            2>/dev/null; then

            echo "ERREUR: ancienne source ReportLab détectée."
            exit 1
          fi

          echo
          echo "Lancement Buildozer..."

          buildozer -v android debug

      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p bin

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERREUR: aucun APK produit."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

