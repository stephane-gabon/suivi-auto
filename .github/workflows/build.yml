name: Build Android APK

on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Show python-for-android version
        run: |
          cd .buildozer/android/platform/python-for-android

          echo "===== Python-for-Android ====="

          git rev-parse HEAD || true

          git describe --tags --always || true

          git log -1 --oneline || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-venv git zip unzip openjdk-17-jdk wget curl tar

          JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          echo "JAVA_HOME=$JAVA17_HOME" >> "$GITHUB_ENV"
          echo "$JAVA17_HOME/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA17_HOME"
          export PATH="$JAVA17_HOME/bin:$PATH"

          echo "===== Java ====="
          java -version

          echo "===== Python ====="
          python3 --version

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade buildozer cython

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Cython ====="
          cython --version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Android Command Line Tools
        run: |
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "===== Installation des Android Command Line Tools ====="

            rm -rf "$SDK/cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"

            wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip \
              -O /tmp/cmdline-tools.zip

            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"

            mkdir -p "$SDK/cmdline-tools/latest"

            mv "$SDK/cmdline-tools/cmdline-tools/"* \
              "$SDK/cmdline-tools/latest/"

            rm -rf "$SDK/cmdline-tools/cmdline-tools"
          fi

          echo "===== Java ====="
          java -version

          echo "===== sdkmanager ====="
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "===== Création du chemin attendu par Buildozer ====="

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"

          echo "sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

      - name: Accept Android SDK licenses
        run: |
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== Acceptation des licences Android ====="

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "===== Licences présentes ====="

          if [ -d "$SDK/licenses" ]; then
            find "$SDK/licenses" -maxdepth 1 -type f -print
          else
            echo "Aucun dossier licenses trouvé."
          fi

      - name: Install Android SDK components
        run: |
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== Installation Android SDK ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "===== Composants installés ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed

      - name: Verify Android SDK and AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== sdkmanager ====="
          "$SDK/tools/bin/sdkmanager" --version

          echo "===== Build Tools ====="
          ls -lah "$SDK/build-tools"

          echo "===== AIDL ====="
          find "$SDK/build-tools" -name aidl -type f -print

          echo "===== Platform Android 33 ====="
          ls -lah "$SDK/platforms/android-33"

          echo "===== Platform Tools ====="
          ls -lah "$SDK/platform-tools"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Check APK
        if: success()
        run: |
          echo "===== APK généré ====="
          ls -lah bin/
          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
