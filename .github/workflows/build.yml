name: Build Android APK

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04


    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDANCES SYSTEME
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            ccache \
            openjdk-17-jdk


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          echo "===== JAVA ====="
          java -version


      # ============================================================
      # PYTHON / BUILDOZER
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython==0.29.36

          echo "===== BUILDOZER ====="
          buildozer --version


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE="$RUNNER_TEMP/cmdline-tools"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK"
          mkdir -p "$CMDLINE"

          echo "===== DOWNLOAD ANDROID COMMAND LINE TOOLS ====="

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" \
            -O "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q \
            "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$CMDLINE"

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$CMDLINE/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          # Ancien chemin attendu par certaines versions
          # de Buildozer / python-for-android.
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$PATH"

          echo "===== SDKMANAGER ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "===== ACCEPT LICENSES ====="

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

          echo "===== INSTALL SDK 33 ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


      # ============================================================
      # ANDROID NDK 28c
      # ============================================================

      - name: Install Android NDK 28c
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== INSTALL NDK 28c ====="

          yes | sdkmanager \
            "ndk;28.2.13676358"

          echo "===== FIND NDK ====="

          find "$SDK/ndk" -maxdepth 2 -type f \
            -name source.properties \
            -print

          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFICATION ANDROID
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== JAVA ====="
          java -version

          echo "===== SDK ====="
          echo "$SDK"

          echo "===== SDKMANAGER ====="
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "===== PLATFORM ====="
          test -d "$SDK/platforms/android-33"
          ls -la "$SDK/platforms/android-33"

          echo "===== BUILD TOOLS ====="
          test -d "$SDK/build-tools/33.0.2"
          ls -la "$SDK/build-tools/33.0.2"

          echo "===== AIDL ====="
          test -x "$SDK/build-tools/33.0.2/aidl"
          "$SDK/build-tools/33.0.2/aidl" --version || true

          echo "===== NDK ====="
          test -d "$NDK"
          test -f "$NDK/source.properties"

          cat "$NDK/source.properties"

          echo "===== ANDROID ENVIRONMENT OK ====="


      # ============================================================
      # CACHE
      # ============================================================

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ============================================================
      # CONFIGURATION BUILDOZER
      # ============================================================

      - name: Configure Buildozer environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # NETTOYAGE COMPLET
      # ============================================================

      - name: Clean previous Buildozer build
        shell: bash
        run: |
          set -e

          echo "===== CLEAN BUILD ====="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROIDNDK="$NDK"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH"

          echo "======================================"
          echo " ENVIRONNEMENT FINAL"
          echo "======================================"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo "===== JAVA ====="
          java -version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== SDKMANAGER ====="
          sdkmanager --version

          echo "===== AIDL ====="
          aidl --version || true

          echo "======================================"
          echo " BUILD APK"
          echo "======================================"

          buildozer -v android debug


      # ============================================================
      # VERIFICATION APK
      # ============================================================

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "===== APK ====="

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          echo "APK trouvé : $APK"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error


