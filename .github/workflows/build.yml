```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-setuptools \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            wget \
            tar \
            curl

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade buildozer cython

      - name: Configure Java 17
        run: |
          JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===== JAVA ====="
          which java
          java -version

          echo "===== JAVAC ====="
          which javac
          javac -version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Android SDK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===== JAVA AVANT SDKMANAGER ====="
          java -version

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip \
            -O /tmp/cmdline-tools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -r \
            "$SDK/cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          rm -rf "$SDK/cmdline-tools/cmdline-tools"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$JAVA_HOME/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "===== SDKMANAGER ====="
          which sdkmanager
          sdkmanager --version

          echo "===== ACCEPT LICENSES ====="
          yes | sdkmanager --licenses >/dev/null || true

          echo "===== INSTALL SDK ====="
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Android NDK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== JAVA ====="
          java -version

          echo "===== SDKMANAGER ====="
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "ndk;28.0.13004108"

          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Prepare Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===== BUILD CONFIG ====="
          java -version
          python3 --version
          buildozer --version

          echo "===== ANDROID VARIABLES ====="
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===== JAVA AVANT BUILDOZER ====="
          java -version

          echo "===== BUILDOZER BUILD ====="
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "===== APK ====="
          find bin -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERREUR : aucun APK généré"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-maintenance-apk
          path: bin/*.apk


