name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-venv \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libfreetype6-dev \
            openjdk-17-jdk

      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          java -version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython

          buildozer --version

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE="$RUNNER_TEMP/cmdline-tools"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK"
          mkdir -p "$CMDLINE"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" \
            -O "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q \
            "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$CMDLINE"

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$CMDLINE/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH"

          echo "===== sdkmanager ====="
          "$SDK/tools/bin/sdkmanager" --version

          echo "===== Licences ====="
          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          echo "===== SDK ====="

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "===== Vérification SDK ====="

          test -x "$SDK/tools/bin/sdkmanager"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/33.0.2"
          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "SDK OK"

      - name: Clean Buildozer cache
        shell: bash
        run: |
          set -e

          rm -rf .buildozer

          echo "Cache Buildozer supprimé."

      - name: Prepare local python-for-android recipe
        shell: bash
        run: |
          set -e

          echo "===== Vérification recette ReportLab ====="

          test -f recipes/reportlab/__init__.py

          echo "Recette trouvée:"
          cat recipes/reportlab/__init__.py

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$SDK/build-tools/33.0.2:$PATH"

          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID ====="
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== SDKMANAGER ====="
          "$SDK/tools/bin/sdkmanager" --version

          echo "===== AIDL ====="
          "$SDK/build-tools/33.0.2/aidl" --version || true

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== BUILD APK ====="

          buildozer -v android debug

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "===== APK généré ====="

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error

