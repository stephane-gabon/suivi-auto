name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "33"
      ANDROID_MIN_API: "24"
      ANDROID_BUILD_TOOLS: "35.0.0"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev


      # ============================================================
      # BUILDOZER + CYTHON
      # ============================================================

      - name: Install Python build tools
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ============================================================
      # INITIALISATION BUILDOZER
      # ============================================================

      - name: Initialize Buildozer Android environment
        run: |
          set -euxo pipefail

          buildozer android clean || true


      # ============================================================
      # ANDROID SDK ENVIRONMENT
      # ============================================================

      - name: Configure Android SDK environment
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=${ANDROID_API}" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=${ANDROID_MIN_API}" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "Android SDK configuration"
          echo "=========================================="

          echo "ANDROIDSDK=$SDK"
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROIDAPI=${ANDROID_API}"
          echo "ANDROIDMINAPI=${ANDROID_MIN_API}"


      # ============================================================
      # ANDROID SDK + COMMAND LINE TOOLS
      # ============================================================

      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"
          CMDLINE_TOOLS="$SDK/cmdline-tools/latest"
          SDKMANAGER="$CMDLINE_TOOLS/bin/sdkmanager"

          echo "=========================================="
          echo "Installation Android Command Line Tools"
          echo "=========================================="

          echo "SDK = $SDK"
          echo "SDKMANAGER = $SDKMANAGER"

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/commandlinetools.zip

          rm -rf "$CMDLINE_TOOLS"

          mkdir -p "$CMDLINE_TOOLS"

          unzip -q \
            /tmp/commandlinetools.zip \
            -d "$CMDLINE_TOOLS"

          if [ -d "$CMDLINE_TOOLS/cmdline-tools" ]; then
            mv "$CMDLINE_TOOLS/cmdline-tools/"* \
              "$CMDLINE_TOOLS/"

            rm -rf "$CMDLINE_TOOLS/cmdline-tools"
          fi

          chmod +x "$SDKMANAGER"

          echo "=========================================="
          echo "Vérification sdkmanager"
          echo "=========================================="

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "=========================================="
          echo "Acceptation licences Android"
          echo "=========================================="

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          echo "=========================================="
          echo "Installation des composants Android"
          echo "=========================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "=========================================="
          echo "Vérifications Android SDK"
          echo "=========================================="

          test -d "$SDK/platforms/android-${ANDROID_API}"

          test -d "$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          test -d "$SDK/platform-tools"

          echo "SDK Manager :"
          "$SDKMANAGER" --version

          echo "Android Platform :"
          ls -ld "$SDK/platforms/android-${ANDROID_API}"

          echo "Build Tools :"
          ls -ld "$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "Platform Tools :"
          ls -ld "$SDK/platform-tools"


      # ============================================================
      # COMPATIBILITÉ BUILDOZER / SDKMANAGER
      # ============================================================

      - name: Configure sdkmanager compatibility
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          MODERN_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          LEGACY_DIR="$SDK/tools/bin"

          LEGACY_SDKMANAGER="$LEGACY_DIR/sdkmanager"

          echo "=========================================="
          echo "Configuration compatibilité sdkmanager"
          echo "=========================================="

          echo "SDK = $SDK"

          echo "sdkmanager moderne = $MODERN_SDKMANAGER"

          echo "sdkmanager legacy = $LEGACY_SDKMANAGER"

          test -x "$MODERN_SDKMANAGER"

          mkdir -p "$LEGACY_DIR"

          ln -sf \
            "$MODERN_SDKMANAGER" \
            "$LEGACY_SDKMANAGER"

          echo "Contenu de tools/bin :"

          ls -la "$LEGACY_DIR"

          echo "Test sdkmanager via chemin legacy :"

          "$LEGACY_SDKMANAGER" --version

          echo "sdkmanager legacy correctement configuré."


      # ============================================================
      # CACHE BUILDOZER / PYTHON-FOR-ANDROID
      # ============================================================

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            ~/.buildozer/android/platform
          key: buildozer-android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-${{ runner.os }}-


      # ============================================================
      # REPORTLAB RECIPE
      # ============================================================

      - name: Prepare local ReportLab source
        run: |
          set -euxo pipefail

          RECIPE_DIR="$GITHUB_WORKSPACE/p4a-recipes/reportlab"
          REPORTLAB_ARCHIVE="$RECIPE_DIR/reportlab-fe660f227cac.tar.gz"
          REPORTLAB_SOURCE="$HOME/.buildozer/local-reportlab"

          test -f "$RECIPE_DIR/__init__.py"
          test -f "$REPORTLAB_ARCHIVE"

          rm -rf "$REPORTLAB_SOURCE"
          mkdir -p "$REPORTLAB_SOURCE"

          tar -xzf "$REPORTLAB_ARCHIVE" -C "$REPORTLAB_SOURCE"

          EXTRACTED_DIR="$(find "$REPORTLAB_SOURCE" -mindepth 1 -maxdepth 1 -type d -print -quit)"

          if [ -z "$EXTRACTED_DIR" ]; then
            echo "ERREUR : impossible de trouver le dossier ReportLab extrait."
            find "$REPORTLAB_SOURCE" -maxdepth 2 -print
            exit 1
          fi

          echo "ReportLab source locale : $EXTRACTED_DIR"

          echo "P4A_REPORTLAB_DIR=$EXTRACTED_DIR" >> "$GITHUB_ENV"

          find "$EXTRACTED_DIR" -maxdepth 2 -type f | head -n 50


      # ============================================================
      # CLEAN PROJECT BUILD
      # ============================================================

      - name: Clean Buildozer build directories
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          rm -rf bin

          mkdir -p bin


      # ============================================================
      # FINAL ANDROID ENVIRONMENT CHECK
      # ============================================================

      - name: Verify Android environment before Buildozer
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          echo "=========================================="
          echo "Environnement Android final"
          echo "=========================================="

          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo "ANDROIDAPI:"
          echo "$ANDROIDAPI"

          echo "ANDROIDMINAPI:"
          echo "$ANDROIDMINAPI"

          echo "sdkmanager moderne:"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "sdkmanager legacy:"

          "$SDK/tools/bin/sdkmanager" --version

          echo "AIDL:"

          "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aidl" --help >/dev/null

          echo "Java:"

          java -version

          echo "Python:"

          python --version

          echo "Cython:"

          cython --version

          echo "Buildozer:"

          buildozer --version


      # ============================================================
      # BUILDOZER BUILD
      # ============================================================

      - name: Build Android APK
        run: |
          set -uo pipefail

          export ANDROIDSDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"

          export ANDROIDAPI="$ANDROID_API"
          export ANDROIDMINAPI="$ANDROID_MIN_API"

          # ========================================================
          # NDK
          # ========================================================
          #
          # GitHub Runner possède plusieurs NDK préinstallés.
          # On ne veut pas que ceux-ci interfèrent avec le NDK
          # sélectionné par python-for-android.
          #
          # python-for-android utilise ici :
          # android-ndk-r28c
          #

          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT

          # ========================================================
          # PATH
          # ========================================================

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          # ========================================================
          # PARAMÈTRES RÉSEAU P4A
          # ========================================================

          export P4A_DOWNLOAD_RETRIES=10
          export P4A_DOWNLOAD_TIMEOUT=120

          # ========================================================
          # ENVIRONNEMENT
          # ========================================================

          echo "=========================================="
          echo "ENVIRONNEMENT AVANT BUILDOZER"
          echo "=========================================="

          echo "JAVA_HOME=$JAVA_HOME"

          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROIDAPI=$ANDROIDAPI"

          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo "ANDROID_NDK=${ANDROID_NDK-<unset>}"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME-<unset>}"

          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT-<unset>}"

          echo "ANDROIDNDK=${ANDROIDNDK-<unset>}"

          echo "P4A_DOWNLOAD_RETRIES=$P4A_DOWNLOAD_RETRIES"

          echo "P4A_DOWNLOAD_TIMEOUT=$P4A_DOWNLOAD_TIMEOUT"

          echo "=========================================="
          echo "CACHE BUILDOZER"
          echo "=========================================="

          mkdir -p "$HOME/.buildozer/android/packages"

          du -sh \
            "$HOME/.buildozer/android/packages" \
            2>/dev/null || true

          echo "=========================================="
          echo "LANCEMENT BUILDOZER"
          echo "=========================================="

          set +e

          buildozer -v android debug 2>&1 | tee buildozer-full.log

          BUILDOZER_STATUS=${PIPESTATUS[0]}

          set -e

          echo "=========================================="
          echo "FIN BUILDOZER"
          echo "=========================================="

          echo "Code retour Buildozer = $BUILDOZER_STATUS"

          echo "=========================================="
          echo "RECHERCHE DES ERREURS RÉSEAU"
          echo "=========================================="

          grep -Ei \
            'HTTP Error|502|503|504|Gateway|Download failed|urllib|timeout|timed out' \
            buildozer-full.log \
            | tail -n 100 \
            || true

          echo "=========================================="
          echo "DERNIÈRES LIGNES DU LOG"
          echo "=========================================="

          tail -n 200 buildozer-full.log

          exit "$BUILDOZER_STATUS"


      # ============================================================
      # APK VERIFICATION
      # ============================================================

      - name: Verify APK
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "Vérification APK"
          echo "=========================================="

          echo "Contenu de bin/ :"

          find bin \
            -maxdepth 2 \
            -type f \
            -print

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          echo "APK généré :"

          echo "$APK"

          echo "Taille :"

          ls -lh "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error


      # ============================================================
      # UPLOAD LOG BUILDOZER
      # ============================================================

      - name: Upload Buildozer diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer-full.log
          if-no-files-found: warn
