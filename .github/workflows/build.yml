# ==============================================================
# WORKFLOW GITHUB ACTIONS - BUILD APK ANDROID
# Projet : Suivi Auto
#
# Objectif :
#   Construire automatiquement l'APK Android avec :
#     - Python 3.10
#     - Java 17
#     - Buildozer 1.6.0
#     - Cython 0.29.37
#     - Android API 33
#     - Android min API 24
#     - Android Build Tools 34.0.0
#     - Android NDK 28.2.13676358
#
# IMPORTANT :
#   - ReportLab est volontairement exclu du projet Android.
#   - Le SDK Android est installé dans le dépôt GitHub Actions :
#       .android-sdk
#   - Le SDK Android n'est PAS installé dans :
#       ~/.buildozer/android/platform/android-sdk
#   - Le sdkmanager utilisé est exclusivement :
#       .android-sdk/cmdline-tools/latest/bin/sdkmanager
#   - Aucun ancien chemin :
#       .android-sdk/tools/bin/sdkmanager
#     n'est créé.
#
#   Cette configuration évite les problèmes liés aux anciennes
#   versions des Android SDK Tools.
# ==============================================================

name: Build Android APK

# ==============================================================
# DÉCLENCHEMENT DU WORKFLOW
# ==============================================================

on:

  # Construction automatique lors d'un push sur main.
  push:
    branches:
      - main

  # Permet de lancer manuellement le workflow depuis GitHub.
  workflow_dispatch:


# ==============================================================
# VARIABLES GLOBALES
# ==============================================================

env:

  # Version de Python utilisée pour Buildozer / python-for-android.
  PYTHON_VERSION: "3.10"

  # Version de Java utilisée pour Android / Gradle.
  JAVA_VERSION: "17"

  # Version de Buildozer utilisée pour générer l'APK.
  BUILDOZER_VERSION: "1.6.0"

  # Version de Cython compatible avec le projet.
  CYTHON_VERSION: "0.29.37"

  # Version de l'API Android utilisée pour la compilation.
  ANDROID_API: "33"

  # Version minimale d'Android supportée par l'application.
  ANDROID_MIN_API: "24"

  # Version des Android Build Tools.
  ANDROID_BUILD_TOOLS: "34.0.0"

  # Version exacte du package NDK disponible dans sdkmanager.
  #
  # IMPORTANT :
  # "28c" est utilisé dans buildozer.spec,
  # mais le package réellement installé par sdkmanager est :
  #
  #   ndk;28.2.13676358
  #
  ANDROID_NDK_VERSION: "28.2.13676358"

  # Version du package Android Command Line Tools.
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"

  # Emplacement du SDK Android dans le workspace GitHub.
  #
  # Ce chemin doit correspondre à :
  #
  #   android.sdk_path = .android-sdk
  #
  # dans buildozer.spec.
  ANDROID_SDK_ROOT_PATH: "${{ github.workspace }}/.android-sdk"


# ==============================================================
# JOB PRINCIPAL
# ==============================================================

jobs:

  build:

    # Machine virtuelle GitHub utilisée pour compiler l'application.
    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # 1 - RÉCUPÉRATION DU CODE SOURCE
      # ========================================================

      - name: "1 - Récupérer le code source"
        uses: actions/checkout@v4

        # Cette étape récupère :
        #   - main.py
        #   - screens/
        #   - utils/
        #   - buildozer.spec
        #   - requirements.txt
        #   - etc.


      # ========================================================
      # 2 - INSTALLATION DE PYTHON
      # ========================================================

      - name: "2 - Installer Python"
        uses: actions/setup-python@v5

        with:

          # Python utilisé pour Buildozer et python-for-android.
          python-version: ${{ env.PYTHON_VERSION }}

          # Pas de cache pip ici.
          #
          # Le cache automatique peut conserver des paquets
          # provenant d'une ancienne configuration et compliquer
          # le diagnostic des dépendances Android.


      # ========================================================
      # 3 - INSTALLATION DE JAVA
      # ========================================================

      - name: "3 - Installer Java"
        uses: actions/setup-java@v5

        with:

          # Distribution OpenJDK utilisée par Android/Gradle.
          distribution: temurin

          # Java 17.
          java-version: ${{ env.JAVA_VERSION }}


      # ========================================================
      # 4 - DÉPENDANCES SYSTÈME
      # ========================================================

      - name: "4 - Installer les dépendances système"
        shell: bash
        run: |

          # Arrêt immédiat en cas d'erreur.
          set -euo pipefail

          # Mise à jour de la liste des paquets.
          sudo apt-get update

          # Installation des outils nécessaires à Buildozer,
          # python-for-android et à la compilation native.
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      # ========================================================
      # 5 - METTRE PIP À JOUR
      # ========================================================

      - name: "5 - Mettre pip à jour"
        shell: bash
        run: |

          set -euo pipefail

          # Mise à jour de pip.
          python -m pip install --upgrade pip setuptools wheel


      # ========================================================
      # 6 - INSTALLER CYTHON ET BUILDOZER
      # ========================================================

      - name: "6 - Installer Buildozer et Cython"
        shell: bash
        run: |

          set -euo pipefail

          # Installation des versions explicitement choisies.
          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}"

          # Affichage des versions réellement installées.
          echo
          echo "================================================"
          echo "VERSIONS INSTALLÉES"
          echo "================================================"

          python --version

          echo
          buildozer --version

          echo
          cython --version


      # ========================================================
      # 7 - PRÉPARER LE DOSSIER DU SDK ANDROID
      # ========================================================

      - name: "7 - Préparer le SDK Android"
        shell: bash
        run: |

          set -euo pipefail

          # Dossier racine du SDK Android.
          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          echo "SDK Android :"
          echo "${SDK_ROOT}"

          # Création du dossier principal.
          mkdir -p "${SDK_ROOT}"

          # Création du dossier destiné aux Command Line Tools.
          mkdir -p "${SDK_ROOT}/cmdline-tools"

          # Nettoyage uniquement de l'installation précédente
          # des Command Line Tools.
          #
          # Le SDK complet n'est pas supprimé ici.
          rm -rf "${SDK_ROOT}/cmdline-tools/latest"

          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"


      # ========================================================
      # 8 - INSTALLER ANDROID COMMAND LINE TOOLS
      # ========================================================

      - name: "8 - Installer Android Command Line Tools"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          # URL officielle du package Android Command Line Tools.
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"

          # Fichiers temporaires.
          TEMP_DIR="${RUNNER_TEMP}/android-cmdline-tools"
          ZIP_FILE="${TEMP_DIR}/commandlinetools.zip"

          # Nettoyage préalable.
          rm -rf "${TEMP_DIR}"
          mkdir -p "${TEMP_DIR}"

          echo
          echo "Téléchargement :"
          echo "${CMDLINE_TOOLS_URL}"

          # Téléchargement.
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "${ZIP_FILE}" \
            "${CMDLINE_TOOLS_URL}"

          # Vérification que le fichier existe.
          test -s "${ZIP_FILE}"

          echo
          echo "Extraction des Android Command Line Tools..."

          # Extraction temporaire.
          unzip -q "${ZIP_FILE}" -d "${TEMP_DIR}/extracted"

          # Le ZIP officiel contient normalement un dossier :
          #
          #   cmdline-tools/
          #
          # contenant bin/, lib/, etc.
          #
          # Nous plaçons directement son contenu dans :
          #
          #   .android-sdk/cmdline-tools/latest/
          cp -a \
            "${TEMP_DIR}/extracted/cmdline-tools/." \
            "${SDK_ROOT}/cmdline-tools/latest/"

          # Vérification du sdkmanager moderne.
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${SDKMANAGER}" ]; then

            echo
            echo "ERREUR : sdkmanager introuvable :"
            echo "${SDKMANAGER}"

            echo
            echo "Contenu du SDK :"
            find "${SDK_ROOT}" -maxdepth 5 -type f -print || true

            exit 1

          fi

          echo
          echo "sdkmanager installé :"
          echo "${SDKMANAGER}"


      # ========================================================
      # 9 - CONFIGURER LES VARIABLES ANDROID
      # ========================================================

      - name: "9 - Configurer les variables Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          # Android utilise historiquement ANDROID_HOME.
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"

          # Variable moderne recommandée.
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

          # Variable utilisée pour le NDK.
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

          # PATH contenant les outils Android modernes.
          echo "PATH=${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}:${PATH}" >> "${GITHUB_ENV}"

          echo
          echo "Variables Android configurées."

          echo
          echo "ANDROID_HOME :"
          echo "${SDK_ROOT}"

          echo
          echo "ANDROID_SDK_ROOT :"
          echo "${SDK_ROOT}"

          echo
          echo "sdkmanager :"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"


      # ========================================================
      # 10 - ACCEPTER LES LICENCES ANDROID
      # ========================================================

      - name: "10 - Accepter les licences Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          # ----------------------------------------------------
          # IMPORTANT :
          #
          # Nous n'utilisons PAS :
          #
          #   yes | sdkmanager --licenses
          #
          # car "yes" peut continuer à écrire alors que
          # sdkmanager a terminé sa lecture, provoquant :
          #
          #   Broken pipe
          #   SIGPIPE
          #
          # Nous envoyons donc un nombre fini de réponses "y".
          # ----------------------------------------------------

          LICENSE_INPUT="${RUNNER_TEMP}/android-license-input"

          # Génération de 100 réponses positives.
          for i in $(seq 1 100); do
            printf 'y\n'
          done > "${LICENSE_INPUT}"

          echo
          echo "Acceptation des licences Android..."

          set +e

          LICENSE_OUTPUT="$(
            "${SDKMANAGER}" --licenses \
              < "${LICENSE_INPUT}" \
              2>&1
          )"

          SDKMANAGER_EXIT_CODE=$?

          set -e

          echo "${LICENSE_OUTPUT}"

          # Le code de sortie peut dépendre de la version
          # des Command Line Tools.
          #
          # Nous vérifions surtout que le dossier licenses
          # existe et contient effectivement des fichiers.
          if [ ! -d "${SDK_ROOT}/licenses" ]; then

            echo
            echo "ERREUR : le dossier des licences Android"
            echo "n'a pas été créé."

            exit 1

          fi

          LICENSE_COUNT="$(
            find "${SDK_ROOT}/licenses" \
              -type f \
              | wc -l
          )"

          echo
          echo "Nombre de fichiers de licence : ${LICENSE_COUNT}"

          if [ "${LICENSE_COUNT}" -eq 0 ]; then

            echo
            echo "ERREUR : aucune licence Android détectée."

            exit 1

          fi

          echo
          echo "Licences Android : OK"


      # ========================================================
      # 11 - INSTALLER LES COMPOSANTS ANDROID
      # ========================================================

      - name: "11 - Installer les composants Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "================================================"
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "================================================"

          echo
          echo "Installation de :"
          echo "  platform-tools"
          echo "  platforms;android-${ANDROID_API}"
          echo "  build-tools;${ANDROID_BUILD_TOOLS}"
          echo "  ndk;${ANDROID_NDK_VERSION}"

          # Installation des composants exacts nécessaires
          # au projet.
          "${SDKMANAGER}" \
            --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo
          echo "Installation Android terminée."


      # ========================================================
      # 12 - VÉRIFIER L'INSTALLATION DU SDK
      # ========================================================

      - name: "12 - Vérifier le SDK Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "================================================"
          echo "VÉRIFICATION DU SDK ANDROID"
          echo "================================================"

          # ----------------------------------------------------
          # Vérification sdkmanager.
          # ----------------------------------------------------

          echo
          echo "sdkmanager :"
          "${SDKMANAGER}" --version

          # ----------------------------------------------------
          # Vérification adb.
          # ----------------------------------------------------

          echo
          echo "adb :"

          if [ ! -x "${SDK_ROOT}/platform-tools/adb" ]; then
            echo "ERREUR : adb introuvable."
            exit 1
          fi

          "${SDK_ROOT}/platform-tools/adb" version

          # ----------------------------------------------------
          # Vérification aapt.
          # ----------------------------------------------------

          echo
          echo "aapt :"

          if [ ! -x "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" ]; then
            echo "ERREUR : aapt introuvable."
            exit 1
          fi

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" version

          # ----------------------------------------------------
          # Vérification aidl.
          # ----------------------------------------------------

          echo
          echo "aidl :"

          if [ ! -x "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl" ]; then
            echo "ERREUR : aidl introuvable."
            exit 1
          fi

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl" --version || true

          # ----------------------------------------------------
          # Vérification de l'API Android.
          # ----------------------------------------------------

          echo
          echo "API Android :"

          if [ ! -d "${SDK_ROOT}/platforms/android-${ANDROID_API}" ]; then

            echo "ERREUR :"
            echo "android-${ANDROID_API} introuvable."

            exit 1

          fi

          echo "android-${ANDROID_API} : OK"

          # ----------------------------------------------------
          # Vérification Build Tools.
          # ----------------------------------------------------

          echo
          echo "Build Tools :"

          if [ ! -d "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" ]; then

            echo "ERREUR :"
            echo "build-tools ${ANDROID_BUILD_TOOLS} introuvable."

            exit 1

          fi

          echo "${ANDROID_BUILD_TOOLS} : OK"

          # ----------------------------------------------------
          # Vérification NDK.
          # ----------------------------------------------------

          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo
          echo "NDK :"
          echo "${NDK_ROOT}"

          if [ ! -f "${NDK_ROOT}/source.properties" ]; then

            echo "ERREUR : source.properties du NDK introuvable."

            exit 1

          fi

          echo
          cat "${NDK_ROOT}/source.properties"

          echo
          echo "NDK : OK"

          # ----------------------------------------------------
          # Vérification importante :
          #
          # aucun ancien sdkmanager ne doit être utilisé.
          # ----------------------------------------------------

          LEGACY_SDKMANAGER="${SDK_ROOT}/tools/bin/sdkmanager"

          echo
          echo "Ancien sdkmanager :"
          echo "${LEGACY_SDKMANAGER}"

          if [ -e "${LEGACY_SDKMANAGER}" ]; then

            echo
            echo "ERREUR : ancien sdkmanager détecté."
            echo
            echo "Ce workflow utilise exclusivement :"
            echo "${SDKMANAGER}"

            exit 1

          fi

          echo
          echo "Ancien sdkmanager : absent / désactivé"

          echo
          echo "================================================"
          echo "SDK ANDROID : OK"
          echo "================================================"


      # ========================================================
      # 13 - VÉRIFIER LA CONFIGURATION BUILDOZER
      # ========================================================

      - name: "13 - Vérifier buildozer.spec"
        shell: bash
        run: |

          set -euo pipefail

          SPEC="buildozer.spec"

          if [ ! -f "${SPEC}" ]; then

            echo "ERREUR : buildozer.spec introuvable."

            exit 1

          fi

          echo
          echo "================================================"
          echo "CONFIGURATION BUILDOZER"
          echo "================================================"

          # Affichage des lignes Android importantes.
          grep -nE \
            '^\[app\]|android\.api|android\.minapi|android\.sdk_build_tools|android\.ndk|android\.sdk_path|android\.archs|android\.skip_update' \
            "${SPEC}" \
            || true

          # ----------------------------------------------------
          # Fonction permettant de récupérer proprement
          # une propriété Buildozer.
          #
          # Les commentaires et espaces sont ignorés.
          # ----------------------------------------------------

          get_spec_value() {

            local KEY="$1"

            awk -F '=' -v key="${KEY}" '
              $0 !~ /^[[:space:]]*#/ &&
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                value=$2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' "${SPEC}"

          }

          API_VALUE="$(get_spec_value "android.api")"
          MIN_API_VALUE="$(get_spec_value "android.minapi")"
          BUILD_TOOLS_VALUE="$(get_spec_value "android.sdk_build_tools")"
          NDK_VALUE="$(get_spec_value "android.ndk")"
          SDK_PATH_VALUE="$(get_spec_value "android.sdk_path")"
          ARCHS_VALUE="$(get_spec_value "android.archs")"
          SKIP_UPDATE_VALUE="$(get_spec_value "android.skip_update")"

          echo
          echo "Valeurs détectées :"

          echo "android.api = ${API_VALUE}"
          echo "android.minapi = ${MIN_API_VALUE}"
          echo "android.sdk_build_tools = ${BUILD_TOOLS_VALUE}"
          echo "android.ndk = ${NDK_VALUE}"
          echo "android.sdk_path = ${SDK_PATH_VALUE}"
          echo "android.archs = ${ARCHS_VALUE}"
          echo "android.skip_update = ${SKIP_UPDATE_VALUE}"

          # ----------------------------------------------------
          # Vérification API.
          # ----------------------------------------------------

          if [ "${API_VALUE}" != "${ANDROID_API}" ]; then

            echo
            echo "ERREUR : android.api incorrect."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification min API.
          # ----------------------------------------------------

          if [ "${MIN_API_VALUE}" != "${ANDROID_MIN_API}" ]; then

            echo
            echo "ERREUR : android.minapi incorrect."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification Build Tools.
          # ----------------------------------------------------

          if [ "${BUILD_TOOLS_VALUE}" != "${ANDROID_BUILD_TOOLS}" ]; then

            echo
            echo "ERREUR : android.sdk_build_tools incorrect."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification NDK.
          #
          # Buildozer utilise "28c".
          # sdkmanager installe la version exacte :
          # "28.2.13676358".
          # ----------------------------------------------------

          if [ "${NDK_VALUE}" != "28c" ]; then

            echo
            echo "ERREUR : android.ndk doit être 28c."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification chemin SDK.
          # ----------------------------------------------------

          if [ "${SDK_PATH_VALUE}" != ".android-sdk" ]; then

            echo
            echo "ERREUR : android.sdk_path doit être .android-sdk."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification architectures.
          # ----------------------------------------------------

          if [[ "${ARCHS_VALUE}" != *"arm64-v8a"* ]]; then

            echo
            echo "ERREUR : arm64-v8a absent."

            exit 1

          fi

          if [[ "${ARCHS_VALUE}" != *"armeabi-v7a"* ]]; then

            echo
            echo "ERREUR : armeabi-v7a absent."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification skip_update.
          #
          # Plusieurs écritures sont acceptées :
          #
          #   1
          #   true
          #   yes
          #   on
          # ----------------------------------------------------

          case "${SKIP_UPDATE_VALUE,,}" in

            1|true|yes|on)
              echo
              echo "android.skip_update : OK"
              ;;

            *)
              echo
              echo "ERREUR : android.skip_update doit être activé."
              exit 1
              ;;

          esac

          echo
          echo "================================================"
          echo "buildozer.spec : OK"
          echo "================================================"


      # ========================================================
      # 14 - VÉRIFIER L'ABSENCE DE REPORTLAB
      # ========================================================

      - name: "14 - Vérifier la suppression de ReportLab"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "VÉRIFICATION REPORTLAB"
          echo "================================================"

          # ----------------------------------------------------
          # Vérification des fichiers Python.
          #
          # Les références PDF ReportLab ne doivent plus être
          # présentes dans le code Python actif.
          # ----------------------------------------------------

          echo
          echo "Recherche dans les fichiers Python..."

          if grep -RniE \
            --include='*.py' \
            '(^|[^[:alnum:]_])reportlab([^[:alnum:]_]|$)|generer_rapport_pdf' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=.android-sdk
          then

            echo
            echo "ERREUR : référence ReportLab détectée dans le code Python."

            exit 1

          fi

          # ----------------------------------------------------
          # Nettoyage de buildozer.spec :
          #
          # Les commentaires ne doivent pas provoquer de faux
          # positifs.
          # ----------------------------------------------------

          SPEC_CLEAN="${RUNNER_TEMP}/buildozer-spec-active.txt"

          sed \
            '/^[[:space:]]*#/d' \
            buildozer.spec \
            > "${SPEC_CLEAN}"

          echo
          echo "Recherche dans buildozer.spec..."

          if grep -niE \
            'reportlab|generer_rapport_pdf' \
            "${SPEC_CLEAN}"
          then

            echo
            echo "ERREUR : référence ReportLab active dans buildozer.spec."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification des requirements.
          # ----------------------------------------------------

          if grep -niE \
            '^[[:space:]]*requirements[[:space:]]*=' \
            "${SPEC_CLEAN}" \
            | grep -qiE \
              '(^|[=,[:space:]])reportlab([<>=!~0-9]|$)'
          then

            echo
            echo "ERREUR : ReportLab présent dans requirements."

            exit 1

          fi

          # ----------------------------------------------------
          # Vérification requirements.txt.
          # ----------------------------------------------------

          if [ -f "requirements.txt" ]; then

            REQUIREMENTS_CLEAN="${RUNNER_TEMP}/requirements-active.txt"

            sed \
              -e '/^[[:space:]]*#/d' \
              -e '/^[[:space:]]*$/d' \
              requirements.txt \
              > "${REQUIREMENTS_CLEAN}"

            if grep -niE \
              '^reportlab([<>=!~]|$)' \
              "${REQUIREMENTS_CLEAN}"
            then

              echo
              echo "ERREUR : ReportLab présent dans requirements.txt."

              exit 1

            fi

          fi

          # ----------------------------------------------------
          # Vérification des recettes locales p4a.
          # ----------------------------------------------------

          if [ -d "p4a.local_recipes" ]; then

            if find p4a.local_recipes \
              -iname '*reportlab*' \
              -print \
              | grep -q .
            then

              echo
              echo "ERREUR : recette locale ReportLab détectée."

              exit 1

            fi

          fi

          echo
          echo "ReportLab : aucune référence active détectée."

          echo
          echo "================================================"
          echo "VÉRIFICATION REPORTLAB : OK"
          echo "================================================"


      # ========================================================
      # 15 - NETTOYER L'ANCIEN ENVIRONNEMENT BUILDOZER
      # ========================================================

      - name: "15 - Nettoyer l'ancien environnement Buildozer"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "NETTOYAGE BUILDOZER"
          echo "================================================"

          # ----------------------------------------------------
          # IMPORTANT :
          #
          # Nous supprimons uniquement .buildozer.
          #
          # Nous NE supprimons PAS :
          #
          #   .android-sdk
          #
          # car le SDK vient d'être correctement installé
          # et vérifié par les étapes précédentes.
          # ----------------------------------------------------

          rm -rf .buildozer

          echo
          echo ".buildozer supprimé."

          echo
          echo ".android-sdk conservé."

          if [ ! -x \
            "${ANDROID_SDK_ROOT_PATH}/cmdline-tools/latest/bin/sdkmanager" \
          ]; then

            echo
            echo "ERREUR : sdkmanager absent après nettoyage."

            exit 1

          fi

          echo
          echo "SDK Android toujours disponible."


      # ========================================================
      # 16 - VÉRIFICATION FINALE DU SDK AVANT BUILDOZER
      # ========================================================

      - name: "16 - Vérifier le SDK juste avant Buildozer"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "================================================"
          echo "SDK FINAL AVANT BUILD"
          echo "================================================"

          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME}"

          echo
          echo "ANDROID_SDK_ROOT :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "sdkmanager :"
          echo "${SDKMANAGER}"

          # Vérification du sdkmanager moderne.
          "${SDKMANAGER}" --version

          # Vérification du SDK root.
          test -d "${SDK_ROOT}"

          # Vérification API.
          test -d \
            "${SDK_ROOT}/platforms/android-${ANDROID_API}"

          # Vérification Build Tools.
          test -d \
            "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

          # Vérification NDK.
          test -d \
            "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          # Vérification absence de l'ancien sdkmanager.
          if [ -e "${SDK_ROOT}/tools/bin/sdkmanager" ]; then

            echo
            echo "ERREUR : ancien sdkmanager détecté."

            exit 1

          fi

          echo
          echo "SDK final : OK."


      # ========================================================
      # 17 - AFFICHER LA CONFIGURATION BUILDOZER
      # ========================================================

      - name: "17 - Afficher la configuration Buildozer"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "CONFIGURATION BUILDOZER AVANT COMPILATION"
          echo "================================================"

          # Affichage des variables Android.
          echo
          echo "Variables Android :"

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          # Affichage de la version Buildozer.
          echo
          echo "Buildozer :"

          buildozer --version

          # Affichage des paramètres Android du fichier.
          echo
          echo "buildozer.spec :"

          grep -nE \
            '^\[app\]|android\.' \
            buildozer.spec \
            || true

          echo
          echo "================================================"


      # ========================================================
      # 18 - CONSTRUIRE L'APK
      # ========================================================

      - name: "18 - Construire l'APK Android"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "DÉBUT DE LA COMPILATION ANDROID"
          echo "================================================"

          echo
          echo "SDK utilisé :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "sdkmanager utilisé :"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "Lancement de Buildozer..."

          # ----------------------------------------------------
          # Compilation de l'APK debug.
          #
          # Le fichier buildozer.spec contient :
          #
          #   android.sdk_path = .android-sdk
          #   android.skip_update = 1
          #
          # Buildozer doit donc utiliser le SDK installé
          # précédemment et ne pas essayer de reconstruire
          # un SDK différent dans ~/.buildozer.
          # ----------------------------------------------------

          buildozer android debug

          echo
          echo "================================================"
          echo "COMPILATION TERMINÉE"
          echo "================================================"


      # ========================================================
      # 19 - RECHERCHER L'APK
      # ========================================================

      - name: "19 - Rechercher l'APK généré"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "RECHERCHE DE L'APK"
          echo "================================================"

          # Recherche de tous les APK générés.
          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

          # Vérification qu'au moins un APK existe.
          APK_COUNT="$(
            find . \
              -type f \
              -name "*.apk" \
              -not -path "./.git/*" \
              | wc -l
          )"

          echo
          echo "Nombre d'APK trouvés : ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then

            echo
            echo "ERREUR : aucun APK n'a été généré."

            exit 1

          fi

          echo
          echo "APK : OK"


      # ========================================================
      # 20 - PUBLIER L'APK COMME ARTIFACT
      # ========================================================

      - name: "20 - Publier l'APK"
        uses: actions/upload-artifact@v4

        with:

          # Nom de l'artifact visible dans GitHub Actions.
          name: suivi-auto-apk

          # Tous les APK présents dans bin/.
          path: bin/*.apk

          # Évite qu'une absence de fichier provoque un résultat
          # silencieux.
          if-no-files-found: error


      # ========================================================
      # 21 - DIAGNOSTICS EN CAS D'ÉCHEC
      # ========================================================

      - name: "21 - Diagnostics en cas d'échec"
        if: failure()
        shell: bash
        run: |

          # ----------------------------------------------------
          # Cette étape ne doit jamais masquer l'erreur initiale.
          #
          # Elle sert uniquement à fournir des informations
          # supplémentaires dans les logs GitHub Actions.
          # ----------------------------------------------------

          set +e

          echo
          echo "================================================"
          echo "DIAGNOSTICS DE BUILD"
          echo "================================================"

          echo
          echo "Python :"
          python --version

          echo
          echo "Java :"
          java -version

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "Cython :"
          cython --version

          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME:-non défini}"

          echo
          echo "ANDROID_SDK_ROOT :"
          echo "${ANDROID_SDK_ROOT:-non défini}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME:-non défini}"

          echo
          echo "sdkmanager moderne :"

          SDKMANAGER="${ANDROID_SDK_ROOT_PATH}/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "${SDKMANAGER}" ]; then
            "${SDKMANAGER}" --version
          else
            echo "sdkmanager introuvable."
          fi

          echo
          echo "Structure du SDK Android :"

          find "${ANDROID_SDK_ROOT_PATH}" \
            -maxdepth 4 \
            -type d \
            | sort \
            | head -300

          echo
          echo "Fichiers sdkmanager présents :"

          find "${ANDROID_SDK_ROOT_PATH}" \
            -type f \
            -name "sdkmanager" \
            -print

          echo
          echo "Ancien chemin tools/bin :"

          if [ -e \
            "${ANDROID_SDK_ROOT_PATH}/tools/bin/sdkmanager" \
          ]; then

            echo "ATTENTION : ancien sdkmanager présent :"
            echo "${ANDROID_SDK_ROOT_PATH}/tools/bin/sdkmanager"

          else

            echo "Ancien sdkmanager absent."

          fi

          echo
          echo "Configuration Android de buildozer.spec :"

          grep -nE \
            '^\[app\]|android\.' \
            buildozer.spec \
            || true

          echo
          echo "Derniers éléments du dossier .buildozer :"

          find .buildozer \
            -maxdepth 4 \
            -type f \
            2>/dev/null \
            | head -200 \
            || true

          echo
          echo "================================================"
          echo "FIN DES DIAGNOSTICS"
          echo "================================================"
