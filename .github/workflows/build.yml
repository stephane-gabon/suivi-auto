name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64
      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"
      ANDROID_NDK_VERSION: "28c"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      - name: Verify local ReportLab archive
        run: |
          set -euxo pipefail

          test -f p4a-recipes/reportlab/__init__.py
          test -f p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz

          echo "ReportLab archive found:"
          ls -lh p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz

          echo "ReportLab recipe:"
          sed -n '1,200p' p4a-recipes/reportlab/__init__.py

      - name: Configure Android environment
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          buildozer android clean || true

          buildozer -v android debug

      - name: Find APK
        run: |
          set -euxo pipefail

          echo "Generated files:"
          find bin -maxdepth 2 -type f -print || true

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error


