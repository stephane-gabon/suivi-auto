name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      ANDROID_API: "33"
      ANDROID_MIN_API: "24"
      ANDROID_BUILD_TOOLS: "34.0.0"
      ANDROID_NDK: "28c"

      P4A_LOCAL_RECIPES: p4a-recipes

    steps:

      # ============================================================
      # 1. Récupération du projet
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. Dépendances système
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            file \
            binutils \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libncurses5-dev \
            libncursesw5-dev \
            gettext \
            libxml2-dev \
            libxslt1-dev

      # ============================================================
      # 5. Python packages
      # ============================================================
      - name: Install Python build tools
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"

      # ============================================================
      # 6. Préparation du SDK Android
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$SDK/licenses"

          echo "SDK = $SDK"

          # --------------------------------------------------------
          # Command line tools
          # --------------------------------------------------------
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            cd /tmp

            rm -rf cmdline-tools
            rm -f commandlinetools.zip

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O commandlinetools.zip

            unzip -q commandlinetools.zip

            rm -rf "$SDK/cmdline-tools/latest"

            mkdir -p "$SDK/cmdline-tools/latest"

            cp -a cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"

          fi

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "PATH=$PATH"

          sdkmanager --version

      # ============================================================
      # 7. Compatibilité ancien chemin sdkmanager
      # ============================================================
      - name: Prepare sdkmanager compatibility path
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      # ============================================================
      # 8. Licences Android
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 9. Installation SDK / Build Tools / NDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      # ============================================================
      # 10. Vérification SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -u

          SDK="$ANDROID_SDK_ROOT"
          BT="$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "=========================================="
          echo "ADB"
          echo "=========================================="

          test -x "$SDK/platform-tools/adb"

          "$SDK/platform-tools/adb" version

          echo
          echo "=========================================="
          echo "BUILD TOOLS"
          echo "=========================================="

          test -d "$BT"

          test -x "$BT/aapt"
          test -x "$BT/aapt2"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          echo
          echo "aapt:"
          ls -lh "$BT/aapt"

          echo
          echo "aapt2:"
          ls -lh "$BT/aapt2"

          echo
          echo "zipalign:"
          ls -lh "$BT/zipalign"

          echo
          echo "apksigner:"
          ls -lh "$BT/apksigner"

          echo
          echo "=========================================="
          echo "aapt file information"
          echo "=========================================="

          file "$BT/aapt" || true

          echo
          echo "=========================================="
          echo "aapt ELF interpreter"
          echo "=========================================="

          readelf -l "$BT/aapt" 2>/dev/null \
            | grep -i interpreter || true

          echo
          echo "=========================================="
          echo "aapt dependencies"
          echo "=========================================="

          ldd "$BT/aapt" || true

          echo
          echo "=========================================="
          echo "aapt2 file information"
          echo "=========================================="

          file "$BT/aapt2" || true

          echo
          echo "=========================================="
          echo "aapt2 ELF interpreter"
          echo "=========================================="

          readelf -l "$BT/aapt2" 2>/dev/null \
            | grep -i interpreter || true

          echo
          echo "=========================================="
          echo "aapt2 dependencies"
          echo "=========================================="

          ldd "$BT/aapt2" || true

          echo
          echo "=========================================="
          echo "Try aapt"
          echo "=========================================="

          "$BT/aapt" version
          AAPT_EXIT=$?

          echo "aapt exit code = $AAPT_EXIT"

          echo
          echo "=========================================="
          echo "Try aapt2"
          echo "=========================================="

          "$BT/aapt2" version
          AAPT2_EXIT=$?

          echo "aapt2 exit code = $AAPT2_EXIT"

          echo
          echo "=========================================="
          echo "Architecture"
          echo "=========================================="

          uname -a
          uname -m

      # ============================================================
      # 11. Cache Buildozer
      # ============================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: |
            buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ============================================================
      # 12. Vérification recette ReportLab
      # ============================================================
      - name: Verify local ReportLab recipe
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ReportLab recipe"
          echo "=========================================="

          test -d "p4a-recipes/reportlab"

          test -f "p4a-recipes/reportlab/__init__.py"

          test -f \
            "p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

          echo
          echo "Recipe:"
          cat "p4a-recipes/reportlab/__init__.py"

          echo
          echo "Archive:"
          ls -lh \
            "p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

          echo
          echo "Archive type:"
          file \
            "p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

      # ============================================================
      # 13. Vérification buildozer.spec
      # ============================================================
      - name: Verify Buildozer configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "buildozer.spec"
          echo "=========================================="

          cat buildozer.spec

          echo
          echo "=========================================="
          echo "Local recipes"
          echo "=========================================="

          find p4a-recipes \
            -maxdepth 3 \
            -type f \
            -print

      # ============================================================
      # 14. Nettoyage du précédent build
      # ============================================================
      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p build_logs

      # ============================================================
      # 15. Build APK
      # ============================================================
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build_logs

          echo "=========================================="
          echo "BUILD START"
          echo "=========================================="

          buildozer -v android debug 2>&1 \
            | tee build_logs/buildozer.log

      # ============================================================
      # 16. Vérification APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find bin \
            -maxdepth 2 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK_COUNT=$(find bin \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: aucun APK généré."
            exit 1
          fi

          echo
          echo "APK trouvé : $APK_COUNT"

          ls -lh bin/*.apk

      # ============================================================
      # 17. Vérification absence ancienne URL ReportLab
      # ============================================================
      - name: Verify ReportLab source
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo "Recherche hg.reportlab.com"
          echo "=========================================="

          if grep -Rni \
            "hg.reportlab.com" \
            .buildozer \
            2>/dev/null; then

            echo
            echo "WARNING: hg.reportlab.com trouvé."

          else

            echo "OK: aucune référence à hg.reportlab.com."

          fi

      # ============================================================
      # 18. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: |
            bin/*.apk
          if-no-files-found: error

      # ============================================================
      # 19. Upload logs
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-build-logs
          path: |
            build_logs/
          if-no-files-found: warn

      # ============================================================
      # 20. Upload Buildozer directory en cas d'échec
      # ============================================================
      - name: Upload Buildozer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-buildozer-debug
          path: |
            .buildozer/android/platform/python-for-android/
            .buildozer/android/platform/build-*/
          if-no-files-found: warn
