# ================================================================
# WORKFLOW GITHUB ACTIONS
# Projet : Suivi Auto
# Fichier : .github/workflows/build.yml
# ================================================================
#
# OBJECTIF
# --------
# Construire automatiquement l'APK Android de l'application Kivy
# "Suivi Auto" avec Buildozer sur GitHub Actions.
#
#
# ENVIRONNEMENT ANDROID UTILISÉ
# -----------------------------
# Python          : 3.10
# Java            : 17
# Buildozer       : 1.6.0
# Cython          : 0.29.37
# Android API     : 33
# Android min API : 24
# Build Tools     : 34.0.0
# Android NDK     : 28.2.13676358 (= 28c côté Buildozer)
#
#
# ARCHITECTURES
# -------------
# arm64-v8a
# armeabi-v7a
#
#
# DÉPENDANCES PYTHON
# ------------------
# python3
# kivy
# plyer
# openpyxl
# pandas
#
# ReportLab est volontairement supprimé.
#
#
# IMPORTANT
# ---------
# Le SDK Android est installé dans :
#
#   ${GITHUB_WORKSPACE}/.android-sdk
#
# Le buildozer.spec doit contenir dans [app] :
#
#   android.sdk_path = .android-sdk
#   android.skip_update = 1
#
# Cela évite que Buildozer utilise son ancien SDK interne :
#
#   /home/runner/.buildozer/android/platform/android-sdk
#
# et évite également qu'il tente de sélectionner une version
# différente des Build Tools, par exemple build-tools;37.0.0.
# ================================================================


# ================================================================
# NOM DU WORKFLOW
# ================================================================

name: Build Android APK - Suivi Auto


# ================================================================
# DÉCLENCHEMENT DU WORKFLOW
# ================================================================
#
# Le workflow est lancé :
#
# - à chaque push sur la branche principale ;
# - manuellement depuis l'onglet Actions de GitHub.
#
# Le déclenchement manuel est particulièrement pratique pour
# relancer une compilation sans créer un nouveau commit.
# ================================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ================================================================
# VARIABLES GLOBALES
# ================================================================

env:

  # --------------------------------------------------------------
  # Versions Python / Java
  # --------------------------------------------------------------

  PYTHON_VERSION: "3.10"

  JAVA_VERSION: "17"


  # --------------------------------------------------------------
  # Versions Buildozer / Cython
  # --------------------------------------------------------------

  BUILDOZER_VERSION: "1.6.0"

  CYTHON_VERSION: "0.29.37"


  # --------------------------------------------------------------
  # Configuration Android
  # --------------------------------------------------------------

  ANDROID_API: "33"

  ANDROID_MIN_API: "24"

  ANDROID_BUILD_TOOLS: "34.0.0"

  # Version complète réellement utilisée par sdkmanager.
  #
  # ATTENTION :
  # sdkmanager n'accepte pas "28c".
  #
  # Il faut utiliser :
  #
  #   ndk;28.2.13676358
  #
  # Buildozer utilise ensuite :
  #
  #   android.ndk = 28c
  #
  ANDROID_NDK_VERSION: "28.2.13676358"


  # --------------------------------------------------------------
  # Répertoire du SDK Android
  # --------------------------------------------------------------
  #
  # Le SDK est installé dans le dépôt GitHub Actions.
  #
  # Cela permet d'avoir exactement le même SDK pour :
  #
  # 1. sdkmanager
  # 2. Buildozer
  # 3. python-for-android
  #
  ANDROID_SDK_ROOT_PATH: "${{ github.workspace }}/.android-sdk"


  # --------------------------------------------------------------
  # Version des Command Line Tools Android
  # --------------------------------------------------------------
  #
  # Cette version fournit sdkmanager.
  #
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"


# ================================================================
# JOB PRINCIPAL
# ================================================================

jobs:

  build-android:

    # --------------------------------------------------------------
    # Machine virtuelle utilisée par GitHub Actions.
    # --------------------------------------------------------------

    runs-on: ubuntu-latest


    # --------------------------------------------------------------
    # PERMISSIONS
    # --------------------------------------------------------------
    #
    # Le workflow n'a pas besoin de permissions particulières
    # sur le dépôt.
    #
    # Le contenu du dépôt peut être lu et l'artefact peut être
    # envoyé via l'action upload-artifact.
    # --------------------------------------------------------------

    permissions:
      contents: read


    # ============================================================
    # ÉTAPES
    # ============================================================

    steps:


      # ==========================================================
      # 1 - RÉCUPÉRATION DU PROJET
      # ==========================================================

      - name: "1 - Récupérer le dépôt"
        uses: actions/checkout@v4

        # --------------------------------------------------------
        # Cette étape récupère :
        #
        # - main.py
        # - buildozer.spec
        # - requirements.txt
        # - screens/
        # - utils/
        # - etc.
        #
        # dans le runner GitHub Actions.
        # --------------------------------------------------------


      # ==========================================================
      # 2 - INSTALLATION DE PYTHON
      # ==========================================================

      - name: "2 - Installer Python 3.10"
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

        # --------------------------------------------------------
        # On utilise Python 3.10 afin de conserver un environnement
        # stable pour Buildozer / python-for-android / Kivy.
        #
        # Aucun cache pip n'est utilisé ici volontairement.
        #
        # Cela évite notamment les problèmes liés à un fichier
        # requirements.txt interprété avant que le dépôt soit
        # correctement préparé.
        # --------------------------------------------------------


      # ==========================================================
      # 3 - INSTALLATION DE JAVA 17
      # ==========================================================

      - name: "3 - Installer Java 17"
        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

        # --------------------------------------------------------
        # Java 17 est utilisé par l'environnement Android/Gradle.
        #
        # On ne demande PAS :
        #
        #   cache: gradle
        #
        # car le projet ne contient pas encore de fichier Gradle
        # nécessitant ce mécanisme de cache.
        # --------------------------------------------------------


      # ==========================================================
      # 4 - VÉRIFICATION DE PYTHON ET JAVA
      # ==========================================================

      - name: "4 - Vérifier Python et Java"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERSIONS DE L'ENVIRONNEMENT"
          echo "================================================"

          echo
          echo "Python :"
          python --version

          echo
          echo "Pip :"
          python -m pip --version

          echo
          echo "Java :"
          java -version

          echo
          echo "JAVA_HOME :"
          echo "${JAVA_HOME}"

          echo
          echo "================================================"
          echo "ENVIRONNEMENT PYTHON/JAVA : OK"
          echo "================================================"


      # ==========================================================
      # 5 - INSTALLATION DES DÉPENDANCES SYSTÈME
      # ==========================================================

      - name: "5 - Installer les dépendances système Linux"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "INSTALLATION DES OUTILS LINUX"
          echo "================================================"

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            rsync \
            file \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses-dev

          echo
          echo "================================================"
          echo "DÉPENDANCES LINUX : OK"
          echo "================================================"


      # ==========================================================
      # 6 - MISE À JOUR DE PIP
      # ==========================================================

      - name: "6 - Mettre à jour pip et les outils Python"
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel


      # ==========================================================
      # 7 - INSTALLATION DE BUILDOZER ET CYTHON
      # ==========================================================

      - name: "7 - Installer Buildozer et Cython"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "INSTALLATION BUILDOZER"
          echo "================================================"

          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}" \
            "Cython==${CYTHON_VERSION}"

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "Cython :"
          cython --version

          echo
          echo "================================================"
          echo "BUILDOZER / CYTHON : OK"
          echo "================================================"


      # ==========================================================
      # 8 - PRÉPARATION DU SDK ANDROID
      # ==========================================================
      #
      # Le SDK Android est volontairement placé dans le projet :
      #
      #   .android-sdk
      #
      # et NON dans :
      #
      #   ~/.buildozer/android/platform/android-sdk
      #
      # Cette distinction est essentielle.
      # ==========================================================

      - name: "8 - Préparer le SDK Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          echo "================================================"
          echo "PRÉPARATION DU SDK ANDROID"
          echo "================================================"

          echo
          echo "SDK_ROOT :"
          echo "${SDK_ROOT}"

          # ------------------------------------------------------
          # Création du répertoire du SDK.
          # ------------------------------------------------------

          mkdir -p "${SDK_ROOT}/cmdline-tools"

          # ------------------------------------------------------
          # Téléchargement des Android Command Line Tools.
          # ------------------------------------------------------

          CMDLINE_ZIP="${RUNNER_TEMP}/commandlinetools.zip"

          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"

          echo
          echo "Téléchargement :"
          echo "${CMDLINE_URL}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "${CMDLINE_ZIP}" \
            "${CMDLINE_URL}"

          # ------------------------------------------------------
          # Installation des Command Line Tools.
          # ------------------------------------------------------

          rm -rf "${SDK_ROOT}/cmdline-tools/latest"

          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"

          unzip \
            -q \
            "${CMDLINE_ZIP}" \
            -d "${RUNNER_TEMP}/android-cmdline-tools"

          # ------------------------------------------------------
          # Le ZIP officiel contient généralement un dossier :
          #
          #   cmdline-tools/
          #
          # que nous plaçons dans :
          #
          #   .android-sdk/cmdline-tools/latest/
          # ------------------------------------------------------

          cp -R \
            "${RUNNER_TEMP}/android-cmdline-tools/cmdline-tools/." \
            "${SDK_ROOT}/cmdline-tools/latest/"

          # ------------------------------------------------------
          # Vérification de sdkmanager.
          # ------------------------------------------------------

          if [ ! -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo
            echo "ERREUR : sdkmanager est introuvable."

            find "${SDK_ROOT}" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1
          fi

          echo
          echo "sdkmanager :"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --version

          echo
          echo "================================================"
          echo "COMMAND LINE TOOLS : OK"
          echo "================================================"


      # ==========================================================
      # 9 - CONFIGURATION DES VARIABLES ANDROID
      # ==========================================================

      - name: "9 - Configurer les variables Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          # ------------------------------------------------------
          # Variables Android persistantes pour les étapes
          # suivantes du workflow.
          # ------------------------------------------------------

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "$GITHUB_ENV"

          # ------------------------------------------------------
          # PATH.
          # ------------------------------------------------------

          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          echo "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo
          echo "================================================"
          echo "VARIABLES ANDROID"
          echo "================================================"

          echo
          echo "ANDROID_HOME=${SDK_ROOT}"

          echo
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}"

          echo
          echo "ANDROID_NDK_HOME=${NDK_ROOT}"


      # ==========================================================
      # 10 - ACCEPTATION DES LICENCES ANDROID
      # ==========================================================
      #
      # IMPORTANT :
      #
      # Nous n'utilisons PAS :
      #
      #   yes | sdkmanager --licenses
      #
      # car cette méthode peut provoquer :
      #
      #   yes: standard output: Broken pipe
      #
      # et faire échouer GitHub Actions avec le code 1.
      #
      # À la place, nous créons un fichier contenant un nombre
      # fini de réponses "y".
      # ==========================================================

      - name: "10 - Accepter les licences Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          LICENSE_INPUT="${RUNNER_TEMP}/android-license-input.txt"

          echo "================================================"
          echo "ACCEPTATION DES LICENCES ANDROID"
          echo "================================================"

          # ------------------------------------------------------
          # Création d'un nombre suffisant de réponses "y".
          #
          # Le fichier est fini : aucune commande yes infinie
          # n'est utilisée.
          # ------------------------------------------------------

          for i in $(seq 1 100); do
            printf 'y\n'
          done > "${LICENSE_INPUT}"

          # ------------------------------------------------------
          # Exécution de sdkmanager --licenses.
          #
          # set +e est temporairement utilisé afin de pouvoir
          # analyser proprement le résultat de sdkmanager.
          # ------------------------------------------------------

          set +e

          LICENSE_OUTPUT="$(
            "${SDKMANAGER}" --licenses \
              < "${LICENSE_INPUT}" \
              2>&1
          )"

          SDKMANAGER_EXIT_CODE=$?

          set -e

          echo "${LICENSE_OUTPUT}"

          # ------------------------------------------------------
          # Certaines versions de sdkmanager peuvent retourner
          # un code non nul malgré des licences correctement
          # enregistrées.
          #
          # Nous vérifions donc également la présence des fichiers
          # de licences.
          # ------------------------------------------------------

          LICENSE_DIR="${SDK_ROOT}/licenses"

          if [ ! -d "${LICENSE_DIR}" ]; then
            echo
            echo "ERREUR : le répertoire des licences Android"
            echo "n'a pas été créé :"
            echo "${LICENSE_DIR}"

            exit 1
          fi

          LICENSE_COUNT="$(
            find "${LICENSE_DIR}" \
              -type f \
              | wc -l
          )"

          echo
          echo "Nombre de fichiers de licences : ${LICENSE_COUNT}"

          if [ "${LICENSE_COUNT}" -eq 0 ]; then
            echo
            echo "ERREUR : aucune licence Android n'a été"
            echo "enregistrée."

            exit 1
          fi

          echo
          echo "Code retour sdkmanager --licenses :"
          echo "${SDKMANAGER_EXIT_CODE}"

          echo
          echo "================================================"
          echo "LICENCES ANDROID : OK"
          echo "================================================"


      # ==========================================================
      # 11 - INSTALLATION DES COMPOSANTS ANDROID
      # ==========================================================

      - name: "11 - Installer API 33, Build Tools 34.0.0 et NDK 28c"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo "================================================"
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "================================================"

          # ------------------------------------------------------
          # Composants explicitement utilisés par le projet.
          #
          # Aucun build-tools 37.0.0 n'est demandé.
          # ------------------------------------------------------

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo
          echo "================================================"
          echo "COMPOSANTS ANDROID INSTALLÉS"
          echo "================================================"

          echo
          echo "SDK :"
          ls -la "${SDK_ROOT}"

          echo
          echo "Build Tools :"
          ls -la "${SDK_ROOT}/build-tools"

          echo
          echo "Platforms :"
          ls -la "${SDK_ROOT}/platforms"

          echo
          echo "NDK :"
          ls -la "${SDK_ROOT}/ndk"


      # ==========================================================
      # 12 - VÉRIFICATION DES OUTILS ANDROID
      # ==========================================================

      - name: "12 - Vérifier les outils Android"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          echo "================================================"
          echo "VÉRIFICATION DU SDK ANDROID"
          echo "================================================"

          # ------------------------------------------------------
          # sdkmanager
          # ------------------------------------------------------

          echo
          echo "sdkmanager :"

          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --version


          # ------------------------------------------------------
          # adb
          # ------------------------------------------------------

          echo
          echo "adb :"

          "${SDK_ROOT}/platform-tools/adb" \
            version


          # ------------------------------------------------------
          # aapt
          # ------------------------------------------------------

          echo
          echo "aapt :"

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" \
            version


          # ------------------------------------------------------
          # aidl
          # ------------------------------------------------------

          echo
          echo "aidl :"

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl" \
            --version \
            || true


          # ------------------------------------------------------
          # API Android 33
          # ------------------------------------------------------

          echo
          echo "API Android :"

          if [ ! -d "${SDK_ROOT}/platforms/android-${ANDROID_API}" ]; then
            echo
            echo "ERREUR : Android API ${ANDROID_API}"
            echo "n'est pas installée."

            exit 1
          fi

          echo "android-${ANDROID_API} : OK"


          # ------------------------------------------------------
          # Build Tools 34.0.0
          # ------------------------------------------------------

          echo
          echo "Build Tools :"

          if [ ! -d "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" ]; then
            echo
            echo "ERREUR : Build Tools ${ANDROID_BUILD_TOOLS}"
            echo "ne sont pas installés."

            exit 1
          fi

          echo "${ANDROID_BUILD_TOOLS} : OK"


          # ------------------------------------------------------
          # NDK 28.2.13676358
          # ------------------------------------------------------

          echo
          echo "NDK :"

          NDK_PROPERTIES="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

          if [ ! -f "${NDK_PROPERTIES}" ]; then
            echo
            echo "ERREUR : source.properties du NDK est introuvable :"
            echo "${NDK_PROPERTIES}"

            exit 1
          fi

          cat "${NDK_PROPERTIES}"

          echo
          echo "================================================"
          echo "SDK ANDROID : OK"
          echo "================================================"


      # ==========================================================
      # 13 - VÉRIFICATION DE BUILDOZER.SPEC
      # ==========================================================
      #
      # Cette étape permet de détecter immédiatement un ancien
      # [app:android] ou une mauvaise configuration du SDK.
      # ==========================================================

      - name: "13 - Vérifier buildozer.spec"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VÉRIFICATION BUILDOZER.SPEC"
          echo "================================================"

          if [ ! -f buildozer.spec ]; then
            echo
            echo "ERREUR : buildozer.spec est introuvable."

            exit 1
          fi

          echo
          echo "Configuration Android détectée :"

          grep -nE \
            "^\[app\]|^android\.api|^android\.minapi|^android\.sdk_build_tools|^android\.ndk|^android\.sdk_path|^android\.skip_update|^android\.archs" \
            buildozer.spec \
            || true


          # ------------------------------------------------------
          # Vérification que les paramètres sont dans [app].
          # ------------------------------------------------------

          if ! grep -qE '^android\.sdk_path[[:space:]]*=' buildozer.spec; then
            echo
            echo "ERREUR : android.sdk_path est absent."

            exit 1
          fi


          if ! grep -qE '^android\.skip_update[[:space:]]*=' buildozer.spec; then
            echo
            echo "ERREUR : android.skip_update est absent."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification d'une ancienne section [app:android].
          # ------------------------------------------------------

          if grep -qE '^\[app:android\]' buildozer.spec; then
            echo
            echo "ERREUR : une section [app:android] existe encore."

            echo
            echo "Les paramètres Android doivent être directement"
            echo "dans la section [app]."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du chemin SDK.
          # ------------------------------------------------------

          if ! grep -qE '^android\.sdk_path[[:space:]]*=[[:space:]]*\.android-sdk[[:space:]]*$' buildozer.spec; then
            echo
            echo "ERREUR : android.sdk_path doit pointer vers"
            echo ".android-sdk"

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du désactivation des mises à jour SDK.
          # ------------------------------------------------------

          if ! grep -qE '^android\.skip_update[[:space:]]*=[[:space:]]*(1|true|True)$' buildozer.spec; then
            echo
            echo "ERREUR : android.skip_update doit être activé."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification Build Tools.
          # ------------------------------------------------------

          if ! grep -qE '^android\.sdk_build_tools[[:space:]]*=[[:space:]]*34\.0\.0[[:space:]]*$' buildozer.spec; then
            echo
            echo "ERREUR : Build Tools 34.0.0 ne sont pas"
            echo "correctement configurés."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification API Android.
          # ------------------------------------------------------

          if ! grep -qE '^android\.api[[:space:]]*=[[:space:]]*33[[:space:]]*$' buildozer.spec; then
            echo
            echo "ERREUR : android.api doit être 33."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification API minimale.
          # ------------------------------------------------------

          if ! grep -qE '^android\.minapi[[:space:]]*=[[:space:]]*24[[:space:]]*$' buildozer.spec; then
            echo
            echo "ERREUR : android.minapi doit être 24."

            exit 1
          fi


          echo
          echo "================================================"
          echo "BUILDOZER.SPEC : CONFIGURATION VALIDE"
          echo "================================================"


      # ==========================================================
      # 14 - VÉRIFICATION DE LA SUPPRESSION DE REPORTLAB
      # ==========================================================
      #
      # ReportLab a été complètement supprimé du build Android.
      #
      # Cette vérification cible uniquement les fichiers qui
      # peuvent réellement modifier la compilation.
      #
      # Le workflow lui-même et README.md ne sont volontairement
      # PAS inspectés ici, car ils peuvent mentionner ReportLab
      # pour expliquer qu'il a été supprimé.
      # ==========================================================

      - name: "14 - Vérifier suppression de ReportLab"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VÉRIFICATION REPORTLAB"
          echo "================================================"


          # ------------------------------------------------------
          # Vérification des fichiers Python.
          # ------------------------------------------------------

          echo
          echo "Recherche dans les fichiers Python..."

          if grep -RniE \
            "reportlab|generer_rapport_pdf" \
            . \
            --include="*.py" \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=.android-sdk; then

            echo
            echo "ERREUR : une référence ReportLab existe encore"
            echo "dans le code Python."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du buildozer.spec.
          # ------------------------------------------------------

          echo
          echo "Recherche dans buildozer.spec..."

          if grep -niE \
            "reportlab|generer_rapport_pdf|p4a\.local_recipes" \
            buildozer.spec; then

            echo
            echo "ERREUR : buildozer.spec contient encore"
            echo "une référence interdite."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification de requirements.txt.
          # ------------------------------------------------------

          if [ -f requirements.txt ]; then

            echo
            echo "Recherche dans requirements.txt..."

            if grep -niE \
              "^[[:space:]]*reportlab([<>=!~]|$)" \
              requirements.txt; then

              echo
              echo "ERREUR : ReportLab est encore présent"
              echo "dans requirements.txt."

              exit 1
            fi

          fi


          # ------------------------------------------------------
          # Vérification d'éventuelles recettes locales.
          # ------------------------------------------------------

          if [ -d p4a-recipes ]; then

            echo
            echo "Vérification de p4a-recipes..."

            if find p4a-recipes \
              -iname "*reportlab*" \
              -print |
              grep -q .; then

              echo
              echo "ERREUR : une recette ReportLab existe encore"
              echo "dans p4a-recipes/."

              find p4a-recipes \
                -iname "*reportlab*" \
                -print

              exit 1
            fi

          fi


          echo
          echo "================================================"
          echo "REPORTLAB : ABSENT DU BUILD"
          echo "================================================"


      # ==========================================================
      # 15 - NETTOYAGE DU CACHE BUILDOZER
      # ==========================================================
      #
      # IMPORTANT :
      #
      # Nous supprimons UNIQUEMENT .buildozer.
      #
      # Nous ne supprimons PAS :
      #
      #   .android-sdk
      #
      # car ce répertoire contient le SDK que Buildozer doit
      # maintenant utiliser.
      # ==========================================================

      - name: "15 - Nettoyer le cache Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NETTOYAGE BUILDOZER"
          echo "================================================"

          rm -rf .buildozer

          echo
          echo ".buildozer supprimé."

          echo
          echo "Vérification du SDK :"

          if [ ! -d "${ANDROID_SDK_ROOT_PATH}" ]; then
            echo
            echo "ERREUR : .android-sdk a été supprimé ou"
            echo "n'existe plus."

            exit 1
          fi

          echo
          echo ".android-sdk est toujours présent."

          echo
          echo "================================================"
          echo "NETTOYAGE : OK"
          echo "================================================"


      # ==========================================================
      # 16 - DERNIÈRE VÉRIFICATION DU SDK
      # ==========================================================
      #
      # Cette étape est volontairement placée juste avant
      # Buildozer.
      #
      # Elle garantit que le SDK n'a pas disparu pendant les
      # étapes précédentes.
      # ==========================================================

      - name: "16 - Vérifier le SDK juste avant Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          echo "================================================"
          echo "SDK UTILISÉ PAR BUILDOZER"
          echo "================================================"

          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME}"

          echo
          echo "ANDROID_SDK_ROOT :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "SDK_ROOT attendu :"
          echo "${SDK_ROOT}"


          # ------------------------------------------------------
          # Vérification que les variables pointent bien vers le
          # SDK du projet.
          # ------------------------------------------------------

          if [ "${ANDROID_HOME}" != "${SDK_ROOT}" ]; then
            echo
            echo "ERREUR : ANDROID_HOME ne pointe pas vers"
            echo ".android-sdk."

            exit 1
          fi


          if [ "${ANDROID_SDK_ROOT}" != "${SDK_ROOT}" ]; then
            echo
            echo "ERREUR : ANDROID_SDK_ROOT ne pointe pas vers"
            echo ".android-sdk."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification de aidl.
          #
          # C'est précisément l'outil qui manquait dans le log
          # précédent.
          # ------------------------------------------------------

          AIDL="${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          if [ ! -x "${AIDL}" ]; then
            echo
            echo "ERREUR : aidl est introuvable :"
            echo "${AIDL}"

            exit 1
          fi

          echo
          echo "aidl :"
          "${AIDL}" --version || true


          # ------------------------------------------------------
          # Vérification de l'API Android.
          # ------------------------------------------------------

          if [ ! -d "${SDK_ROOT}/platforms/android-${ANDROID_API}" ]; then
            echo
            echo "ERREUR : Android API ${ANDROID_API}"
            echo "introuvable."

            exit 1
          fi


          # ------------------------------------------------------
          # Vérification du NDK.
          # ------------------------------------------------------

          if [ ! -f "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties" ]; then
            echo
            echo "ERREUR : NDK ${ANDROID_NDK_VERSION}"
            echo "introuvable."

            exit 1
          fi


          echo
          echo "================================================"
          echo "SDK PRÊT POUR BUILDOZER"
          echo "================================================"


      # ==========================================================
      # 17 - AFFICHAGE DE LA CONFIGURATION BUILDOZER
      # ==========================================================
      #
      # Cette étape permet de voir dans les logs la configuration
      # réellement utilisée avant de lancer une compilation
      # potentiellement longue.
      # ==========================================================

      - name: "17 - Afficher la configuration Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "CONFIGURATION BUILDOZER"
          echo "================================================"

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "Répertoire courant :"
          pwd

          echo
          echo "SDK Android :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "NDK Android :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "Configuration buildozer.spec :"
          sed -n \
            '/^\[app\]/,/^\[buildozer\]/p' \
            buildozer.spec


      # ==========================================================
      # 18 - COMPILATION DE L'APK
      # ==========================================================
      #
      # Le point essentiel ici est que Buildozer doit maintenant
      # lire :
      #
      #   android.sdk_path = .android-sdk
      #
      # depuis [app] dans buildozer.spec.
      #
      # Et :
      #
      #   android.skip_update = 1
      #
      # empêche Buildozer de tenter une mise à jour automatique
      # du SDK.
      # ==========================================================

      - name: "18 - Construire l'APK Android"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "DÉBUT DE LA COMPILATION ANDROID"
          echo "================================================"

          echo
          echo "SDK utilisé :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "NDK utilisé :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "Build Tools attendus :"
          echo "${ANDROID_BUILD_TOOLS}"

          echo
          echo "API Android :"
          echo "${ANDROID_API}"

          echo
          echo "API minimale :"
          echo "${ANDROID_MIN_API}"

          echo
          echo "================================================"
          echo "BUILDOZER ANDROID DEBUG"
          echo "================================================"

          buildozer android debug


      # ==========================================================
      # 19 - RECHERCHE DE L'APK
      # ==========================================================
      #
      # Après une compilation réussie, Buildozer place normalement
      # l'APK dans :
      #
      #   bin/
      #
      # Cette étape vérifie que le fichier existe réellement.
      # ==========================================================

      - name: "19 - Vérifier l'APK généré"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "RECHERCHE DE L'APK"
          echo "================================================"

          if [ ! -d bin ]; then
            echo
            echo "ERREUR : le répertoire bin/ n'existe pas."

            exit 1
          fi

          APK_COUNT="$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          echo
          echo "Nombre d'APK trouvés : ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo
            echo "ERREUR : aucun APK n'a été généré."

            echo
            echo "Contenu de bin/ :"

            find bin \
              -maxdepth 2 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo
          echo "APK générés :"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print


          echo
          echo "Type des APK :"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -exec file {} \;


          echo
          echo "================================================"
          echo "APK : OK"
          echo "================================================"


      # ==========================================================
      # 20 - TÉLÉVERSEMENT DE L'APK
      # ==========================================================
      #
      # L'APK est publié comme artefact GitHub Actions.
      #
      # Après la fin du workflow :
      #
      # GitHub
      #   → Actions
      #   → workflow Build Android APK - Suivi Auto
      #   → Artifacts
      #   → suivi-auto-apk
      #
      # permettra de récupérer l'APK.
      # ==========================================================

      - name: "20 - Publier l'APK comme artefact"
        uses: actions/upload-artifact@v4

        with:
          name: suivi-auto-apk

          path: bin/*.apk

          if-no-files-found: error

          retention-days: 14


      # ==========================================================
      # 21 - DIAGNOSTICS EN CAS D'ÉCHEC
      # ==========================================================
      #
      # Cette étape est exécutée uniquement si une étape
      # précédente échoue.
      #
      # Elle permet de récupérer rapidement les informations
      # nécessaires au diagnostic sans devoir modifier le
      # workflow à chaque tentative.
      # ==========================================================

      - name: "21 - Diagnostics en cas d'échec"
        if: failure()
        shell: bash
        run: |
          echo "================================================"
          echo "DIAGNOSTICS DE COMPILATION"
          echo "================================================"

          echo
          echo "Répertoire courant :"
          pwd

          echo
          echo "Contenu racine :"
          ls -la || true

          echo
          echo "Variables Android :"

          echo "ANDROID_HOME=${ANDROID_HOME:-non défini}"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-non défini}"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-non défini}"

          echo
          echo "SDK Android :"

          if [ -d "${ANDROID_SDK_ROOT_PATH}" ]; then

            echo
            echo "Build Tools :"

            find "${ANDROID_SDK_ROOT_PATH}/build-tools" \
              -maxdepth 2 \
              -type f \
              -name "aidl" \
              -print \
              2>/dev/null \
              || true


            echo
            echo "Platforms :"

            find "${ANDROID_SDK_ROOT_PATH}/platforms" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print \
              2>/dev/null \
              || true


            echo
            echo "NDK :"

            find "${ANDROID_SDK_ROOT_PATH}/ndk" \
              -maxdepth 2 \
              -type f \
              -name "source.properties" \
              -print \
              2>/dev/null \
              || true

          else

            echo
            echo "Le SDK Android n'existe plus."

          fi


          echo
          echo "Buildozer :"

          buildozer --version \
            2>&1 \
            || true


          echo
          echo "buildozer.spec :"

          if [ -f buildozer.spec ]; then
            cat buildozer.spec
          else
            echo "buildozer.spec introuvable."
          fi


          echo
          echo "Contenu de bin/ :"

          find bin \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null \
            || true


          echo
          echo "Contenu de .buildozer/android/platform/ :"

          find .buildozer/android/platform \
            -maxdepth 3 \
            -type d \
            -print \
            2>/dev/null \
            | head -100 \
            || true


          echo
          echo "================================================"
          echo "FIN DES DIAGNOSTICS"
          echo "================================================"

