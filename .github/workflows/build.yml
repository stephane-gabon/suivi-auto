name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # Java utilisé par Buildozer / Gradle
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # Android
      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      # Important :
      # on évite que les NDK préinstallés du runner soient utilisés
      ANDROID_NDK_VERSION: "28c"

      # Réduit les problèmes de téléchargement
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      # ------------------------------------------------------------
      # 1. Récupération du projet
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ------------------------------------------------------------
      # 3. Java 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # 4. Dépendances système
      # ------------------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            gettext \
            gettext-base \
            libffi-dev \
            libssl-dev \
            zlib1g-dev


      # ------------------------------------------------------------
      # 5. Nettoyage des variables NDK du runner GitHub
      # ------------------------------------------------------------
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "===== Java ====="
          java -version

          echo "===== Environment Android ====="
          echo "ANDROIDSDK=$SDK"
          echo "ANDROIDNDK=$NDK"


      # ------------------------------------------------------------
      # 6. Dépendances Python
      # ------------------------------------------------------------
      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"


      # ------------------------------------------------------------
      # 7. Cache Buildozer
      # ------------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ------------------------------------------------------------
      # 8. Vérification Buildozer
      # ------------------------------------------------------------
      - name: Verify Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python --version
          java -version

          buildozer --version

          echo "===== Buildozer location ====="
          which buildozer


      # ------------------------------------------------------------
      # 9. Préparer le cache des téléchargements p4a
      # ------------------------------------------------------------
      - name: Prepare python-for-android download cache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.buildozer/android/packages"

          echo "PACKAGES_PATH=$HOME/.buildozer/android/packages" >> "$GITHUB_ENV"

          echo "Cache directory:"
          ls -la "$HOME/.buildozer/android/packages" || true


      # ------------------------------------------------------------
      # 10. Initialisation contrôlée de Buildozer
      # ------------------------------------------------------------
      - name: Initialize Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          buildozer android p4a -- --help


      # ------------------------------------------------------------
      # 11. Vérification environnement Android
      # ------------------------------------------------------------
      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

          echo "===== SDK ====="
          echo "$SDK"

          echo "===== NDK ====="
          echo "$NDK"

          echo "===== Variables ====="
          env | grep -E '^ANDROID' | sort || true

          echo "===== SDK directories ====="
          find "$SDK" -maxdepth 2 -type d 2>/dev/null | head -100 || true

          echo "===== NDK ====="
          if [ -d "$NDK" ]; then
            echo "NDK 28c trouvé"
          else
            echo "NDK 28c pas encore installé"
          fi


      # ------------------------------------------------------------
      # 12. Nettoyage des anciens builds
      # ------------------------------------------------------------
      - name: Clean previous Android build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

          echo "Ancien build nettoyé."


      # ------------------------------------------------------------
      # 13. Build APK avec retries
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        timeout-minutes: 90
        run: |
          set -uo pipefail

          echo "======================================"
          echo " BUILD ANDROID"
          echo "======================================"

          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Android variables:"
          env | grep -E '^ANDROID' | sort || true

          echo
          echo "======================================"
          echo " Tentative 1"
          echo "======================================"

          if buildozer -v android debug; then
            echo "Build réussi à la première tentative."
            exit 0
          fi

          echo
          echo "======================================"
          echo " Première tentative échouée."
          echo " Nettoyage léger avant retry."
          echo "======================================"

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

          sleep 10

          echo
          echo "======================================"
          echo " Tentative 2"
          echo "======================================"

          if buildozer -v android debug; then
            echo "Build réussi à la deuxième tentative."
            exit 0
          fi

          echo
          echo "======================================"
          echo " Deuxième tentative échouée."
          echo "Dernière tentative."
          echo "======================================"

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

          sleep 20

          echo
          echo "======================================"
          echo " Tentative 3"
          echo "======================================"

          buildozer -v android debug


      # ------------------------------------------------------------
      # 14. Vérification APK
      # ------------------------------------------------------------
      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo " APK PRODUIT"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo
          echo "APK trouvé :"
          echo "$APK"

          ls -lh "$APK"


      # ------------------------------------------------------------
      # 15. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error


