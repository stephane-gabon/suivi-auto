name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      # NDK 28c = 28.2.13676358
      ANDROID_NDK_VERSION: "28c"

      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ------------------------------------------------------------
      # 3. Java 17
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # 4. Dépendances système
      # ------------------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            gettext \
            gettext-base \
            libffi-dev \
            libssl-dev \
            zlib1g-dev


      # ------------------------------------------------------------
      # 5. Installer Buildozer
      # ------------------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          buildozer --version


      # ------------------------------------------------------------
      # 6. Variables Android
      # ------------------------------------------------------------
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          mkdir -p "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # 7. Cache Buildozer
      # ------------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ------------------------------------------------------------
      # 8. Installer Android Command Line Tools
      # ------------------------------------------------------------
      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TEMP="$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$SDK"
          mkdir -p "$TEMP"

          wget \
            --retry-connrefused \
            --waitretry=5 \
            --timeout=60 \
            --tries=5 \
            "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" \
            -O "$TEMP/cmdline-tools.zip"

          unzip -q \
            "$TEMP/cmdline-tools.zip" \
            -d "$TEMP"

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$TEMP/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          chmod +x "$SDK/cmdline-tools/latest/bin/"*

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "===== sdkmanager ====="
          "$SDKMANAGER" --version


      # ------------------------------------------------------------
      # 9. Licences Android
      # ------------------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          echo "Licences Android acceptées."


      # ------------------------------------------------------------
      # 10. Installer SDK exactement nécessaire
      # ------------------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "===== SDK ====="
          ls -la "$SDK"

          echo "===== Build Tools ====="
          ls -la "$SDK/build-tools"

          echo "===== AIDL ====="
          "$SDK/build-tools/35.0.0/aidl" --version || true


      # ------------------------------------------------------------
      # 11. Installer NDK 28c
      # ------------------------------------------------------------
      - name: Install NDK 28c
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          test -f "$NDK/source.properties"

          echo "===== NDK ====="
          cat "$NDK/source.properties"

          grep -q "Pkg.Revision = 28.2.13676358" \
            "$NDK/source.properties"

          echo "NDK 28c correctement installé."


      # ------------------------------------------------------------
      # 12. Vérifier environnement Android
      # ------------------------------------------------------------
      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "======================================"
          echo "ANDROID"
          echo "======================================"

          echo "ANDROIDSDK=$SDK"
          echo "ANDROIDNDK=$NDK"

          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/35.0.0"
          test -x "$SDK/build-tools/35.0.0/aidl"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          echo
          echo "===== NDK ====="
          cat "$NDK/source.properties"

          echo
          echo "===== AIDL ====="
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "===== Java ====="
          java -version


      # ------------------------------------------------------------
      # 13. Vérifier recipe ReportLab local
      # ------------------------------------------------------------
      - name: Verify local ReportLab recipe
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "REPORTLAB RECIPE"
          echo "======================================"

          test -f recipes/reportlab/__init__.py

          echo "Recipe ReportLab trouvé :"
          ls -la recipes/reportlab/

          echo
          echo "Contenu :"
          sed -n '1,240p' recipes/reportlab/__init__.py


      # ------------------------------------------------------------
      # 14. Nettoyage Buildozer
      # ------------------------------------------------------------
      - name: Clean Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

          echo "Nettoyage terminé."


      # ------------------------------------------------------------
      # 15. Build APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        timeout-minutes: 120
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export ANDROIDNDK="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"

          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "ENVIRONNEMENT FINAL"
          echo "======================================"

          env | grep -E '^ANDROID' | sort

          echo
          echo "======================================"
          echo "NDK"
          echo "======================================"

          grep "Pkg.Revision" \
            "$ANDROIDNDK/source.properties"

          echo
          echo "======================================"
          echo "AIDL"
          echo "======================================"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "======================================"
          echo "REPORTLAB"
          echo "======================================"

          test -f recipes/reportlab/__init__.py

          echo "Recipe local présent."

          echo
          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"

          buildozer --version

          echo
          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          buildozer -v android debug


      # ------------------------------------------------------------
      # 16. Vérifier APK
      # ------------------------------------------------------------
      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "APK PRODUIT"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"

          echo "APK trouvé : $APK"

          ls -lh "$APK"


      # ------------------------------------------------------------
      # 17. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error

