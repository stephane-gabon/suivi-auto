# ======================================================================
# WORKFLOW GITHUB ACTIONS - SUIVI AUTO
# ======================================================================
#
# Construction automatique de l'application Kivy "Suivi Auto"
# pour Android avec :
#
#   - Python 3.10
#   - Java 17 / Temurin
#   - Buildozer 1.6.0
#   - python-for-android
#   - Android API 33
#   - Android Build Tools 34.0.0
#   - Android NDK 28c
#   - Architectures arm64-v8a et armeabi-v7a
#
# Le workflow :
#
#   1. prépare Ubuntu ;
#   2. installe les dépendances système nécessaires à Buildozer ;
#   3. installe Python 3.10 ;
#   4. installe Java 17 ;
#   5. installe Buildozer ;
#   6. installe le SDK Android dans .android-sdk ;
#   7. accepte les licences Android ;
#   8. installe API 33, Build Tools 34.0.0 et NDK 28.2.13676358 ;
#   9. fournit un wrapper sdkmanager compatible avec Buildozer 1.6.0 ;
#  10. vérifie buildozer.spec ;
#  11. vérifie l'absence de ReportLab actif ;
#  12. précharge xz-5.2.4.tar.gz dans le cache de python-for-android ;
#  13. construit l'APK ;
#  14. conserve le journal complet en cas d'échec ;
#  15. publie l'APK comme artefact GitHub Actions.
#
# IMPORTANT :
# Le fichier buildozer.spec doit contenir notamment :
#
#   android.api = 33
#   android.minapi = 24
#   android.sdk_build_tools = 34.0.0
#   android.ndk = 28c
#   android.sdk_path = .android-sdk
#   android.archs = arm64-v8a,armeabi-v7a
#   android.skip_update = 1
#
# ReportLab n'est volontairement plus utilisé dans l'application.
# ======================================================================


name: Construire APK Android - Suivi Auto


# ======================================================================
# DÉCLENCHEMENT DU WORKFLOW
# ======================================================================
#
# Le workflow est lancé :
#
#   - automatiquement lors d'un push sur main ;
#   - automatiquement lors d'une Pull Request vers main ;
#   - manuellement depuis l'onglet Actions de GitHub.
# ======================================================================

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ======================================================================
# PERMISSIONS GITHUB
# ======================================================================
#
# Le workflow doit pouvoir lire le dépôt et publier les artefacts.
# ======================================================================

permissions:
  contents: read


# ======================================================================
# JOB PRINCIPAL
# ======================================================================

jobs:

  build-android:

    # Ubuntu 22.04 est utilisé pour conserver un environnement stable
    # et compatible avec Buildozer / python-for-android.
    runs-on: ubuntu-22.04


    steps:

      # ================================================================
      # ÉTAPE 1 - RÉCUPÉRATION DU CODE SOURCE
      # ================================================================

      - name: "01 - Récupérer le dépôt"
        uses: actions/checkout@v4


      # ================================================================
      # ÉTAPE 2 - INSTALLATION DE PYTHON
      # ================================================================
      #
      # Le projet utilise Python 3.10.
      #
      # Le cache pip n'est volontairement pas utilisé ici afin de
      # réduire les problèmes liés aux caches GitHub Actions périmés.
      # ================================================================

      - name: "02 - Installer Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ================================================================
      # ÉTAPE 3 - INSTALLATION DE JAVA 17
      # ================================================================
      #
      # Android / Gradle / Buildozer utilisent Java 17.
      #
      # setup-java@v5 est utilisé au lieu de versions anciennes de
      # l'action.
      # ================================================================

      - name: "03 - Installer Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ================================================================
      # ÉTAPE 4 - DÉPENDANCES LINUX
      # ================================================================
      #
      # Ces paquets sont nécessaires aux recettes utilisées par
      # python-for-android.
      #
      # En particulier :
      #
      #   autoconf
      #   automake
      #   autopoint
      #   gettext
      #   libtool
      #   libtool-bin
      #   libltdl-dev
      #
      # sont nécessaires pour certaines bibliothèques compilées
      # pendant la construction Android.
      #
      # autopoint avait précédemment provoqué l'erreur :
      #
      #   Can't exec "autopoint"
      #
      # Le paquet est donc explicitement installé.
      #
      # IMPORTANT :
      # Les commandes de vérification n'utilisent pas "head -n 1".
      # Cela évite les erreurs "Broken pipe" avec certains outils
      # comme libtool.
      # ================================================================

      - name: "04 - Installer les dépendances Linux"
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES OUTILS AUTOTOOLS"
          echo "============================================================"

          command -v autoconf
          autoconf --version

          command -v automake
          automake --version

          command -v autopoint
          autopoint --version

          command -v gettext
          gettext --version

          command -v libtool
          libtool --version

          command -v libtoolize
          libtoolize --version

          echo ""
          echo "============================================================"
          echo "DÉPENDANCES LINUX OK"
          echo "============================================================"


      # ================================================================
      # ÉTAPE 5 - INSTALLATION DE BUILDOZER
      # ================================================================
      #
      # Buildozer 1.6.0 est utilisé explicitement afin de conserver
      # un environnement reproductible.
      #
      # Cython est également installé explicitement.
      # ================================================================

      - name: "05 - Installer Buildozer et Cython"
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"

          echo ""
          echo "============================================================"
          echo "VERSIONS PYTHON / BUILDOZER / CYTHON"
          echo "============================================================"

          python --version
          pip --version
          buildozer --version
          cython --version


      # ================================================================
      # ÉTAPE 6 - DÉFINIR L'ANDROID SDK
      # ================================================================
      #
      # Le SDK Android est installé dans :
      #
      #   .android-sdk
      #
      # à l'intérieur du dépôt.
      #
      # Cela permet à buildozer.spec de pointer explicitement vers
      # ce SDK grâce à :
      #
      #   android.sdk_path = .android-sdk
      #
      # Les variables sont également exportées dans l'environnement
      # GitHub Actions pour les étapes suivantes.
      # ================================================================

      - name: "06 - Configurer les variables Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

          echo "ANDROID_HOME=${SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}"


      # ================================================================
      # ÉTAPE 7 - TÉLÉCHARGER ET INSTALLER LE SDK ANDROID
      # ================================================================
      #
      # On utilise les Android Command-line Tools modernes.
      #
      # Le sdkmanager moderne se trouve ensuite ici :
      #
      #   .android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # IMPORTANT :
      # Buildozer 1.6.0 recherche encore historiquement :
      #
      #   .android-sdk/tools/bin/sdkmanager
      #
      # Le wrapper compatible sera créé à l'étape suivante.
      # ================================================================

      - name: "07 - Installer le SDK Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"
          CMDLINE_TOOLS_VERSION="11076708"

          rm -rf "${SDK_ROOT}"

          mkdir -p "${SDK_ROOT}/cmdline-tools"

          cd "${RUNNER_TEMP}"

          echo "Téléchargement des Android Command-line Tools..."

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            -o commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"

          unzip -q commandlinetools.zip -d "${RUNNER_TEMP}/android-cmdline"

          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"

          cp -a \
            "${RUNNER_TEMP}/android-cmdline/cmdline-tools/." \
            "${SDK_ROOT}/cmdline-tools/latest/"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "${SDKMANAGER}"

          echo ""
          echo "============================================================"
          echo "SDKMANAGER MODERNE"
          echo "============================================================"

          "${SDKMANAGER}" --version

          echo ""
          echo "SDK installé dans :"
          echo "${SDK_ROOT}"


      # ================================================================
      # ÉTAPE 8 - ACCEPTER LES LICENCES ANDROID
      # ================================================================
      #
      # NE PAS utiliser :
      #
      #   yes | sdkmanager --licenses
      #
      # car sdkmanager peut fermer le pipe et provoquer :
      #
      #   Broken pipe
      #   SIGPIPE
      #
      # On fournit donc un nombre fini de réponses "y".
      # ================================================================

      - name: "08 - Accepter les licences Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "${HOME}/.android"

          LICENSE_INPUT="${RUNNER_TEMP}/android-licenses.txt"

          # Génère un nombre suffisant de réponses "y" sans créer
          # de pipe infini susceptible de provoquer SIGPIPE.
          for i in $(seq 1 100); do
            printf 'y\n'
          done > "${LICENSE_INPUT}"

          set +e

          LICENSE_OUTPUT=$(
            "${SDKMANAGER}" --licenses \
              < "${LICENSE_INPUT}" \
              2>&1
          )

          SDKMANAGER_EXIT_CODE=$?

          set -e

          echo "${LICENSE_OUTPUT}"

          # Certaines versions de sdkmanager peuvent retourner un code
          # non nul après avoir accepté les licences. Nous vérifions donc
          # aussi la présence effective du répertoire des licences.

          if [ ! -d "${HOME}/.android" ]; then
            echo "ERREUR : le répertoire Android utilisateur est absent."
            exit 1
          fi

          if [ "${SDKMANAGER_EXIT_CODE}" -ne 0 ]; then
            echo ""
            echo "AVERTISSEMENT : sdkmanager --licenses a retourné : ${SDKMANAGER_EXIT_CODE}"
            echo "La présence des licences sera vérifiée par les fichiers."
          fi

          echo ""
          echo "============================================================"
          echo "LICENCES ANDROID"
          echo "============================================================"

          find "${SDK_ROOT}/licenses" \
            -maxdepth 1 \
            -type f \
            -print \
            2>/dev/null || true


      # ================================================================
      # ÉTAPE 9 - INSTALLER LES COMPOSANTS ANDROID
      # ================================================================
      #
      # Versions utilisées :
      #
      #   API Android : 33
      #   Build Tools : 34.0.0
      #   NDK         : 28.2.13676358
      #
      # Le nom "28c" utilisé dans buildozer.spec correspond à la famille
      # NDK attendue par python-for-android / Buildozer.
      # ================================================================

      - name: "09 - Installer API Android, Build Tools et NDK"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo ""
          echo "============================================================"
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "============================================================"

          "${SDKMANAGER}" \
            --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358"

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES COMPOSANTS"
          echo "============================================================"

          test -d "${SDK_ROOT}/platform-tools"
          test -d "${SDK_ROOT}/platforms/android-33"
          test -d "${SDK_ROOT}/build-tools/34.0.0"
          test -d "${SDK_ROOT}/ndk/28.2.13676358"

          test -x "${SDK_ROOT}/build-tools/34.0.0/aidl"

          echo "Android API 33       : OK"
          echo "Build Tools 34.0.0   : OK"
          echo "NDK 28.2.13676358   : OK"
          echo "AIDL                 : OK"


      # ================================================================
      # ÉTAPE 10 - COMPATIBILITÉ SDKMANAGER / BUILDOZER 1.6.0
      # ================================================================
      #
      # Buildozer 1.6.0 recherche encore le sdkmanager à :
      #
      #   .android-sdk/tools/bin/sdkmanager
      #
      # alors que les Android Command-line Tools modernes utilisent :
      #
      #   .android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # Nous créons donc un véritable script wrapper.
      #
      # IMPORTANT :
      # Ce n'est PAS un lien symbolique.
      #
      # Le wrapper transmet simplement tous les arguments au
      # sdkmanager moderne.
      #
      # Depuis :
      #
      #   .android-sdk/tools/bin/
      #
      # il faut remonter de DEUX niveaux pour retrouver :
      #
      #   .android-sdk/
      # ================================================================

      - name: "10 - Créer le wrapper sdkmanager pour Buildozer 1.6.0"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          MODERN_SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          LEGACY_DIR="${SDK_ROOT}/tools/bin"
          LEGACY_SDKMANAGER="${LEGACY_DIR}/sdkmanager"

          echo ""
          echo "============================================================"
          echo "CRÉATION DU WRAPPER SDKMANAGER"
          echo "============================================================"

          echo "SDK_ROOT :"
          echo "${SDK_ROOT}"

          echo ""
          echo "SDKMANAGER moderne :"
          echo "${MODERN_SDKMANAGER}"

          # Vérification du sdkmanager moderne.
          if [ ! -x "${MODERN_SDKMANAGER}" ]; then
            echo ""
            echo "ERREUR : sdkmanager moderne introuvable ou non exécutable."
            echo "${MODERN_SDKMANAGER}"
            exit 1
          fi

          # Création du répertoire attendu historiquement par Buildozer.
          mkdir -p "${LEGACY_DIR}"

          # Création du wrapper.
          cat > "${LEGACY_SDKMANAGER}" <<'EOF'
          #!/usr/bin/env bash

          # ================================================================
          # Wrapper de compatibilité pour Buildozer 1.6.0.
          #
          # Buildozer recherche historiquement :
          #
          #   .android-sdk/tools/bin/sdkmanager
          #
          # Le véritable sdkmanager moderne est situé ici :
          #
          #   .android-sdk/cmdline-tools/latest/bin/sdkmanager
          #
          # Le script calcule la racine .android-sdk en remontant :
          #
          #   tools/bin -> tools -> .android-sdk
          #
          # soit DEUX niveaux.
          # ================================================================

          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          # Depuis :
          #   .android-sdk/tools/bin
          #
          # ../.. donne :
          #   .android-sdk
          #
          SDK_ROOT="$(cd "${SCRIPT_DIR}/../.." && pwd)"

          MODERN_SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          # Vérification de sécurité avant exécution.
          if [ ! -x "${MODERN_SDKMANAGER}" ]; then
              echo "ERREUR : sdkmanager moderne introuvable :"
              echo "${MODERN_SDKMANAGER}"
              exit 1
          fi

          # Transmet tous les arguments au sdkmanager moderne.
          exec "${MODERN_SDKMANAGER}" "$@"
          EOF

          chmod +x "${LEGACY_SDKMANAGER}"

          echo ""
          echo "============================================================"
          echo "TEST SDKMANAGER MODERNE"
          echo "============================================================"

          "${MODERN_SDKMANAGER}" --version

          echo ""
          echo "============================================================"
          echo "TEST WRAPPER BUILDOZER"
          echo "============================================================"

          "${LEGACY_SDKMANAGER}" --version

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES CHEMINS"
          echo "============================================================"

          echo "Wrapper :"
          echo "${LEGACY_SDKMANAGER}"

          echo ""
          echo "SDK root calculé par le wrapper :"
          (
            SCRIPT_DIR="$(cd "$(dirname "${LEGACY_SDKMANAGER}")" && pwd)"
            cd "${SCRIPT_DIR}/../.."
            pwd
          )

          echo ""
          echo "SDKMANAGER moderne :"
          echo "${MODERN_SDKMANAGER}"

          echo ""
          echo "============================================================"
          echo "SDKMANAGER : COMPATIBILITÉ OK"
          echo "============================================================"


      # ================================================================
      # ÉTAPE 11 - CONFIGURATION DU PATH ANDROID
      # ================================================================

      - name: "11 - Configurer PATH Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/tools/bin" >> "${GITHUB_PATH}"

          echo "PATH Android configuré."


      # ================================================================
      # ÉTAPE 12 - VÉRIFIER buildozer.spec
      # ================================================================
      #
      # Les propriétés Android doivent être dans la section [app].
      #
      # IMPORTANT :
      # La version précédente de cette étape utilisait une extraction
      # awk trop fragile et retournait des valeurs vides :
      #
      #   api              =
      #   minapi           =
      #   build tools      =
      #   ndk              =
      #
      # La fonction ci-dessous utilise maintenant :
      #
      #   - awk -v pour transmettre le nom de la propriété ;
      #   - une détection robuste de [app] ;
      #   - la prise en charge des espaces autour de [app] ;
      #   - l'arrêt lorsqu'une autre section commence ;
      #   - l'ignorance des commentaires ;
      #   - l'extraction uniquement de la valeur située après "=".
      #
      # Cette méthode ne dépend donc plus de l'interpolation complexe
      # d'une regex shell dans awk.
      # ================================================================

      - name: "12 - Vérifier buildozer.spec"
        shell: bash
        run: |
          set -e

          test -f buildozer.spec

          echo ""
          echo "============================================================"
          echo "CONFIGURATION ANDROID DÉTECTÉE"
          echo "============================================================"

          echo ""
          echo "Contenu des propriétés Android dans [app] :"
          echo "------------------------------------------------------------"

          awk '
            BEGIN {
              in_app = 0
            }

            # Début de la section [app].
            /^[[:space:]]*\[app\][[:space:]]*$/ {
              in_app = 1
              print NR ":" $0
              next
            }

            # Une autre section termine [app].
            /^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
              if ($0 !~ /^[[:space:]]*\[app\][[:space:]]*$/) {
                in_app = 0
              }
            }

            # Afficher uniquement les propriétés Android demandées.
            in_app &&
            $0 !~ /^[[:space:]]*#/ &&
            $0 ~ /^[[:space:]]*android\.(api|minapi|sdk_build_tools|ndk|sdk_path|archs|skip_update)[[:space:]]*=/ {
              print NR ":" $0
            }
          ' buildozer.spec

          # --------------------------------------------------------
          # Fonction robuste de lecture d'une propriété dans [app].
          #
          # Exemple :
          #
          #   get_app_value "android.api"
          #
          # retourne :
          #
          #   33
          # --------------------------------------------------------

          get_app_value() {
            local PROPERTY="$1"

            awk -v property="${PROPERTY}" '
              BEGIN {
                in_app = 0
              }

              # Début de [app].
              /^[[:space:]]*\[app\][[:space:]]*$/ {
                in_app = 1
                next
              }

              # Toute autre section termine [app].
              /^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
                if ($0 !~ /^[[:space:]]*\[app\][[:space:]]*$/) {
                  in_app = 0
                }
                next
              }

              # Ignorer les commentaires.
              /^[[:space:]]*#/ {
                next
              }

              # Rechercher la propriété demandée.
              in_app &&
              $0 ~ "^[[:space:]]*" property "[[:space:]]*=" {

                line = $0

                # Supprimer tout ce qui précède le premier "=".
                sub(/^[^=]*=/, "", line)

                # Supprimer les espaces en début de valeur.
                sub(/^[[:space:]]*/, "", line)

                # Supprimer les espaces en fin de valeur.
                sub(/[[:space:]]*$/, "", line)

                print line

                exit
              }
            ' buildozer.spec
          }

          # --------------------------------------------------------
          # Lecture des propriétés Android.
          # --------------------------------------------------------

          API="$(get_app_value "android.api")"
          MINAPI="$(get_app_value "android.minapi")"
          BUILD_TOOLS="$(get_app_value "android.sdk_build_tools")"
          NDK="$(get_app_value "android.ndk")"
          SDK_PATH="$(get_app_value "android.sdk_path")"
          ARCHS="$(get_app_value "android.archs")"
          SKIP_UPDATE="$(get_app_value "android.skip_update")"

          echo ""
          echo "============================================================"
          echo "VALEURS ANDROID LUES DANS BUILDOZER.SPEC"
          echo "============================================================"

          echo "api              = ${API}"
          echo "minapi           = ${MINAPI}"
          echo "build tools      = ${BUILD_TOOLS}"
          echo "ndk              = ${NDK}"
          echo "sdk path         = ${SDK_PATH}"
          echo "architectures    = ${ARCHS}"
          echo "skip update      = ${SKIP_UPDATE}"

          echo ""

          # --------------------------------------------------------
          # Vérification de android.api.
          # --------------------------------------------------------

          if [ "${API}" != "33" ]; then
            echo "ERREUR : android.api doit être 33."
            echo "Valeur détectée : '${API}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification de android.minapi.
          # --------------------------------------------------------

          if [ "${MINAPI}" != "24" ]; then
            echo "ERREUR : android.minapi doit être 24."
            echo "Valeur détectée : '${MINAPI}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification des Build Tools.
          # --------------------------------------------------------

          if [ "${BUILD_TOOLS}" != "34.0.0" ]; then
            echo "ERREUR : android.sdk_build_tools doit être 34.0.0."
            echo "Valeur détectée : '${BUILD_TOOLS}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification du NDK.
          # --------------------------------------------------------

          if [ "${NDK}" != "28c" ]; then
            echo "ERREUR : android.ndk doit être 28c."
            echo "Valeur détectée : '${NDK}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification du chemin SDK.
          # --------------------------------------------------------

          if [ "${SDK_PATH}" != ".android-sdk" ]; then
            echo "ERREUR : android.sdk_path doit être .android-sdk."
            echo "Valeur détectée : '${SDK_PATH}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification de arm64-v8a.
          # --------------------------------------------------------

          if [[ ",${ARCHS}," != *",arm64-v8a,"* ]]; then
            echo "ERREUR : arm64-v8a absent de android.archs."
            echo "Valeur détectée : '${ARCHS}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification de armeabi-v7a.
          # --------------------------------------------------------

          if [[ ",${ARCHS}," != *",armeabi-v7a,"* ]]; then
            echo "ERREUR : armeabi-v7a absent de android.archs."
            echo "Valeur détectée : '${ARCHS}'"
            exit 1
          fi

          # --------------------------------------------------------
          # Vérification de android.skip_update.
          #
          # Plusieurs écritures booléennes sont acceptées.
          # --------------------------------------------------------

          case "${SKIP_UPDATE,,}" in
            1|true|yes|on)
              echo "android.skip_update : activé"
              ;;

            *)
              echo "ERREUR : android.skip_update doit être activé."
              echo "Valeur détectée : '${SKIP_UPDATE}'"
              exit 1
              ;;
          esac

          echo ""
          echo "============================================================"
          echo "BUILDOZER.SPEC : CONFIGURATION ANDROID VALIDE"
          echo "============================================================"


      # ================================================================
      # ÉTAPE 13 - VÉRIFIER L'ABSENCE DE REPORTLAB
      # ================================================================
      #
      # ReportLab a été supprimé car sa recette locale provoquait des
      # problèmes de construction.
      #
      # Les commentaires de documentation peuvent mentionner ReportLab.
      # On recherche donc uniquement les références actives.
      # ================================================================

      - name: "13 - Vérifier la suppression de ReportLab"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION REPORTLAB"
          echo "============================================================"

          # Recherche dans les fichiers Python.
          if grep -RniE \
            --include='*.py' \
            '(^|[^[:alnum:]_])reportlab([^[:alnum:]_]|$)|generer_rapport_pdf' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=bin; then

            echo ""
            echo "ERREUR : référence Python active à ReportLab détectée."
            exit 1
          fi

          # Recherche dans requirements.txt en ignorant commentaires
          # et lignes vides.
          if [ -f requirements.txt ]; then
            if grep -vE '^[[:space:]]*#|^[[:space:]]*$' requirements.txt \
              | grep -iE '^reportlab([<>=!~]|$)'; then

              echo "ERREUR : ReportLab présent dans requirements.txt."
              exit 1
            fi
          fi

          # Recherche dans buildozer.spec en ignorant les commentaires.
          if grep -vE '^[[:space:]]*#' buildozer.spec \
            | grep -iE 'reportlab|generer_rapport_pdf'; then

            echo "ERREUR : référence active à ReportLab dans buildozer.spec."
            exit 1
          fi

          # Vérification d'une éventuelle recette locale ReportLab.
          if [ -d p4a.local_recipes ]; then
            if find p4a.local_recipes -type f \
              | grep -iE 'reportlab|pdf'; then

              echo "ERREUR : recette locale potentiellement liée à ReportLab."
              exit 1
            fi
          fi

          echo "Aucune référence active à ReportLab détectée."


      # ================================================================
      # ÉTAPE 14 - VÉRIFIER requirements.txt
      # ================================================================
      #
      # Les dépendances Android nécessaires au projet sont :
      #
      #   python3
      #   kivy
      #   plyer
      #   openpyxl
      #   pandas
      #
      # ReportLab ne doit pas être présent.
      # ================================================================

      - name: "14 - Vérifier les dépendances Python"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "REQUIREMENTS.TXT"
          echo "============================================================"

          if [ -f requirements.txt ]; then
            cat requirements.txt
          else
            echo "requirements.txt absent."
            echo "Les requirements seront lus depuis buildozer.spec."
          fi

          echo ""
          echo "Dépendances Android attendues :"
          echo "python3"
          echo "kivy"
          echo "plyer"
          echo "openpyxl"
          echo "pandas"


      # ================================================================
      # ÉTAPE 15 - NETTOYER L'ANCIEN BUILD
      # ================================================================
      #
      # On supprime .buildozer afin d'éviter qu'un ancien état de
      # python-for-android ou d'une recette interfère avec le build.
      #
      # ATTENTION :
      # .android-sdk n'est PAS supprimé.
      #
      # Le SDK Android préparé précédemment doit être conservé.
      # ================================================================

      - name: "15 - Nettoyer l'ancien build Buildozer"
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          echo "Ancien environnement Buildozer supprimé."
          echo "Le SDK .android-sdk est conservé."


      # ================================================================
      # ÉTAPE 16 - PRÉCHARGER xz-5.2.4 POUR LIBLZMA
      # ================================================================
      #
      # CORRECTIF DU PROBLÈME DE TÉLÉCHARGEMENT LIBLZMA.
      #
      # L'erreur rencontrée était :
      #
      #   Downloading liblzma from
      #   https://tukaani.org/xz/xz-5.2.4.tar.gz
      #
      # puis :
      #
      #   TimeoutError: [Errno 110] Connection timed out
      #
      # python-for-android utilise le cache :
      #
      #   .buildozer/android/platform/
      #   build-arm64-v8a_armeabi-v7a/packages/liblzma/
      #
      # pour stocker les archives des recettes.
      #
      # On télécharge donc directement l'archive dans ce répertoire
      # AVANT de lancer Buildozer.
      #
      # Source utilisée :
      #
      #   SourceForge / XZ Utils
      #
      # Le MD5 attendu est conservé afin de vérifier l'intégrité
      # de l'archive téléchargée.
      # ================================================================

      - name: "16 - Précharger xz-5.2.4 pour liblzma"
        shell: bash
        run: |
          set -e

          STORAGE_DIR="${GITHUB_WORKSPACE}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a"

          LIBLZMA_CACHE="${STORAGE_DIR}/packages/liblzma"

          XZ_FILE="${LIBLZMA_CACHE}/xz-5.2.4.tar.gz"

          XZ_URL="https://downloads.sourceforge.net/project/lzmautils/xz-5.2.4.tar.gz"

          XZ_MD5="5ace3264bdd00c65eeec2891346f65e6"

          mkdir -p "${LIBLZMA_CACHE}"

          echo ""
          echo "============================================================"
          echo "PRÉCHARGEMENT DE LIBLZMA"
          echo "============================================================"

          echo "Cache : ${LIBLZMA_CACHE}"
          echo "Fichier : ${XZ_FILE}"
          echo "Source : ${XZ_URL}"

          # Si une archive correcte existe déjà, elle est conservée.
          if [ -f "${XZ_FILE}" ]; then

            echo "Archive déjà présente."

          else

            echo "Téléchargement de xz-5.2.4.tar.gz..."

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              -o "${XZ_FILE}.part" \
              "${XZ_URL}"

            mv "${XZ_FILE}.part" "${XZ_FILE}"

          fi

          echo ""
          echo "Vérification de l'archive..."

          ACTUAL_MD5="$(md5sum "${XZ_FILE}" | awk '{print $1}')"

          echo "MD5 attendu : ${XZ_MD5}"
          echo "MD5 obtenu  : ${ACTUAL_MD5}"

          if [ "${ACTUAL_MD5}" != "${XZ_MD5}" ]; then
            echo ""
            echo "ERREUR : l'archive xz-5.2.4 est incorrecte."
            rm -f "${XZ_FILE}"
            exit 1
          fi

          echo ""
          echo "Archive xz-5.2.4 valide."

          ls -lh "${XZ_FILE}"


      # ================================================================
      # ÉTAPE 17 - VÉRIFICATION FINALE DE L'ENVIRONNEMENT
      # ================================================================

      - name: "17 - Vérification finale de l'environnement Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo ""
          echo "============================================================"
          echo "ENVIRONNEMENT FINAL"
          echo "============================================================"

          echo ""
          echo "Java :"
          java -version

          echo ""
          echo "Python :"
          python --version

          echo ""
          echo "Buildozer :"
          buildozer --version

          echo ""
          echo "SDK Android :"
          echo "${SDK_ROOT}"

          echo ""
          echo "sdkmanager moderne :"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "sdkmanager wrapper :"
          "${SDK_ROOT}/tools/bin/sdkmanager" --version

          echo ""
          echo "AIDL :"
          "${SDK_ROOT}/build-tools/34.0.0/aidl" --version || true

          echo ""
          echo "NDK installé dans le SDK :"
          ls -ld "${SDK_ROOT}/ndk/28.2.13676358"

          echo ""
          echo "Archive liblzma préchargée :"
          ls -lh \
            "${GITHUB_WORKSPACE}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/liblzma/xz-5.2.4.tar.gz"


      # ================================================================
      # ÉTAPE 18 - INFORMATIONS BUILDOZER
      # ================================================================
      #
      # Cette étape affiche les informations utiles juste avant le
      # lancement du gros build.
      # ================================================================

      - name: "18 - Préparer la construction Buildozer"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "PRÉPARATION BUILDOZER"
          echo "============================================================"

          echo ""
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME}"

          echo ""
          echo "ANDROID_SDK_ROOT :"
          echo "${ANDROID_SDK_ROOT}"

          echo ""
          echo "Contenu du SDK :"
          ls -la "${ANDROID_HOME}"

          echo ""
          echo "Buildozer spec :"
          grep -nE \
            '^[[:space:]]*android\.(api|minapi|sdk_build_tools|ndk|sdk_path|archs|skip_update)[[:space:]]*=' \
            buildozer.spec \
            || true


      # ================================================================
      # ÉTAPE 19 - CONSTRUIRE L'APK ANDROID
      # ================================================================
      #
      # Le journal complet est sauvegardé dans :
      #
      #   buildozer.log
      #
      # PIPESTATUS permet de récupérer le code retour de Buildozer
      # et non celui de "tee".
      # ================================================================

      - name: "19 - Construire l'APK Android"
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================================"
          echo "CONSTRUCTION DE L'APK ANDROID"
          echo "============================================================"

          buildozer -v android debug 2>&1 | tee buildozer.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "============================================================"
          echo "CODE RETOUR BUILDOZER : ${BUILD_EXIT_CODE}"
          echo "============================================================"

          exit "${BUILD_EXIT_CODE}"


      # ================================================================
      # ÉTAPE 20 - DIAGNOSTIC AUTOMATIQUE EN CAS D'ÉCHEC
      # ================================================================
      #
      # Cette étape s'exécute même lorsque l'étape 19 échoue.
      #
      # Elle permet de retrouver immédiatement la vraie erreur sans
      # parcourir manuellement plusieurs dizaines de milliers de lignes.
      # ================================================================

      - name: "20 - Diagnostiquer l'échec Buildozer"
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "############################################################"
          echo "# 300 DERNIÈRES LIGNES DU JOURNAL BUILDOZER"
          echo "############################################################"

          tail -n 300 buildozer.log || true

          echo ""
          echo "############################################################"
          echo "# ERREURS IMPORTANTES DÉTECTÉES"
          echo "############################################################"

          grep -nEi \
            'error:|error |ERROR:|FAILED|Traceback|ErrorReturnCode|command failed|returned non-zero|No such file|not found|cannot find|undefined reference|TimeoutError|URLError' \
            buildozer.log \
            | tail -n 150 \
            || true

          echo ""
          echo "############################################################"
          echo "# FIN DU DIAGNOSTIC"
          echo "############################################################"


      # ================================================================
      # ÉTAPE 21 - SAUVEGARDER LE JOURNAL COMPLET
      # ================================================================
      #
      # Même si GitHub tronque l'affichage du log, le fichier complet
      # reste disponible comme artefact.
      # ================================================================

      - name: "21 - Sauvegarder le journal Buildozer"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn


      # ================================================================
      # ÉTAPE 22 - RECHERCHER L'APK
      # ================================================================
      #
      # Buildozer place normalement l'APK dans :
      #
      #   bin/
      #
      # Cette étape affiche précisément les fichiers générés.
      # ================================================================

      - name: "22 - Rechercher l'APK généré"
        if: success()
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "FICHIERS ANDROID GÉNÉRÉS"
          echo "============================================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -not -path "./.git/*" \
            -print


      # ================================================================
      # ÉTAPE 23 - PUBLIER L'APK
      # ================================================================
      #
      # L'APK est publié comme artefact GitHub Actions.
      #
      # Il sera récupérable depuis la page du workflow terminé.
      # ================================================================

      - name: "23 - Publier l'APK Android"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
