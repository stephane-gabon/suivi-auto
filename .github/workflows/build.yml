# ==============================================================
# WORKFLOW GITHUB ACTIONS - BUILD APK ANDROID
# Projet : Suivi Auto
#
# Objectif :
#   Construire automatiquement l'APK Android avec :
#     - Python 3.10
#     - Java 17
#     - Buildozer 1.6.0
#     - Cython 0.29.37
#     - Android API 33
#     - Android min API 24
#     - Android Build Tools 34.0.0
#     - Android NDK 28c
#
# IMPORTANT :
#
# Buildozer 1.6.0 recherche encore sdkmanager à l'ancien
# emplacement :
#
#   $ANDROID_SDK_ROOT/tools/bin/sdkmanager
#
# alors que les Android Command Line Tools modernes utilisent :
#
#   $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
#
# Le workflow crée donc un WRAPPER exécutable à l'ancien
# emplacement.
#
# Ce n'est PAS un lien symbolique.
#
# Le wrapper appelle explicitement le sdkmanager moderne.
#
# ReportLab est volontairement exclu du projet Android.
# ==============================================================

name: Build Android APK


# ==============================================================
# DÉCLENCHEMENT
# ==============================================================

on:

  # Construction automatique lors d'un push sur main.
  push:
    branches:
      - main

  # Permet de lancer manuellement le workflow.
  workflow_dispatch:


# ==============================================================
# VARIABLES GLOBALES
# ==============================================================

env:

  # Version de Python.
  PYTHON_VERSION: "3.10"

  # Version de Java.
  JAVA_VERSION: "17"

  # Version de Buildozer.
  BUILDOZER_VERSION: "1.6.0"

  # Version de Cython.
  CYTHON_VERSION: "0.29.37"

  # API Android cible.
  ANDROID_API: "33"

  # API Android minimale.
  ANDROID_MIN_API: "24"

  # Android Build Tools.
  ANDROID_BUILD_TOOLS: "34.0.0"

  # Version exacte du package NDK installé par sdkmanager.
  ANDROID_NDK_VERSION: "28.2.13676358"

  # Version des Android Command Line Tools.
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"

  # Emplacement du SDK Android.
  ANDROID_SDK_ROOT_PATH: "${{ github.workspace }}/.android-sdk"


# ==============================================================
# JOB
# ==============================================================

jobs:

  build:

    # Ubuntu 22.04 fournit un environnement stable pour
    # Buildozer / python-for-android.
    runs-on: ubuntu-22.04

    steps:


      # ========================================================
      # 1 - RÉCUPÉRER LE PROJET
      # ========================================================

      - name: "1 - Récupérer le code source"
        uses: actions/checkout@v4


      # ========================================================
      # 2 - INSTALLER PYTHON
      # ========================================================

      - name: "2 - Installer Python"
        uses: actions/setup-python@v5

        with:

          # Python utilisé pour Buildozer.
          python-version: ${{ env.PYTHON_VERSION }}


      # ========================================================
      # 3 - INSTALLER JAVA
      # ========================================================

      - name: "3 - Installer Java"
        uses: actions/setup-java@v5

        with:

          # Distribution OpenJDK.
          distribution: temurin

          # Java 17.
          java-version: ${{ env.JAVA_VERSION }}


      # ========================================================
      # 4 - INSTALLER LES DÉPENDANCES SYSTÈME
      # ========================================================
      #
      # Ces paquets sont nécessaires à Buildozer et aux recettes
      # natives compilées par python-for-android.
      #
      # IMPORTANT :
      #
      # Certaines recettes p4a utilisent autotools/autoreconf.
      #
      # La recette liblzma, notamment, exécute :
      #
      #   autoreconf -vif
      #
      # qui peut appeler :
      #
      #   autopoint
      #
      # "autopoint" n'est pas garanti d'être présent simplement
      # parce que autoconf est installé.
      #
      # Nous installons donc explicitement :
      #
      #   autopoint
      #   gettext
      #
      # afin d'éviter :
      #
      #   Can't exec "autopoint"
      #   No such file or directory
      # ========================================================

      - name: "4 - Installer les dépendances système"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "INSTALLATION DES DÉPENDANCES SYSTÈME"
          echo "================================================"

          # Mise à jour de la liste des paquets Ubuntu.
          sudo apt-get update

          # Installation des outils nécessaires à :
          #
          #   - Buildozer
          #   - python-for-android
          #   - autotools
          #   - compilation C/C++
          #   - recettes natives Android
          #
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

          echo
          echo "================================================"
          echo "VÉRIFICATION DES OUTILS AUTOTOOLS"
          echo "================================================"

          # Vérification de autoconf.
          echo
          echo "autoconf :"
          autoconf --version | head -n 1

          # Vérification de automake.
          echo
          echo "automake :"
          automake --version | head -n 1

          # Vérification de autopoint.
          echo
          echo "autopoint :"
          autopoint --version | head -n 1

          # Vérification de gettext.
          echo
          echo "gettext :"
          gettext --version | head -n 1

          # Vérification de libtool.
          echo
          echo "libtool :"
          libtool --version | head -n 1

          echo
          echo "================================================"
          echo "DÉPENDANCES SYSTÈME : OK"
          echo "================================================"


      # ========================================================
      # 5 - METTRE PIP À JOUR
      # ========================================================

      - name: "5 - Mettre pip à jour"
        shell: bash
        run: |

          set -euo pipefail

          # Mise à jour des outils Python.
          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel


      # ========================================================
      # 6 - INSTALLER BUILDOZER ET CYTHON
      # ========================================================

      - name: "6 - Installer Buildozer et Cython"
        shell: bash
        run: |

          set -euo pipefail

          # Installation des versions utilisées par le projet.
          python -m pip install \
            "Cython==${CYTHON_VERSION}" \
            "buildozer==${BUILDOZER_VERSION}"

          echo
          echo "================================================"
          echo "VERSIONS"
          echo "================================================"

          python --version

          echo
          buildozer --version

          echo
          cython --version


      # ========================================================
      # 7 - PRÉPARER LE SDK ANDROID
      # ========================================================

      - name: "7 - Préparer le SDK Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          echo
          echo "SDK Android :"
          echo "${SDK_ROOT}"

          # Création du répertoire SDK.
          mkdir -p "${SDK_ROOT}"

          # Répertoire des Command Line Tools.
          mkdir -p "${SDK_ROOT}/cmdline-tools"

          # Nettoyage d'une éventuelle installation précédente.
          rm -rf "${SDK_ROOT}/cmdline-tools/latest"

          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"


      # ========================================================
      # 8 - INSTALLER LES COMMAND LINE TOOLS
      # ========================================================

      - name: "8 - Installer Android Command Line Tools"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          # URL officielle des Command Line Tools.
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"

          TEMP_DIR="${RUNNER_TEMP}/android-cmdline-tools"
          ZIP_FILE="${TEMP_DIR}/commandlinetools.zip"

          # Nettoyage du répertoire temporaire.
          rm -rf "${TEMP_DIR}"
          mkdir -p "${TEMP_DIR}"

          echo
          echo "Téléchargement :"
          echo "${CMDLINE_TOOLS_URL}"

          # Téléchargement.
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "${ZIP_FILE}" \
            "${CMDLINE_TOOLS_URL}"

          # Vérification du fichier.
          test -s "${ZIP_FILE}"

          # Extraction.
          unzip -q \
            "${ZIP_FILE}" \
            -d "${TEMP_DIR}/extracted"

          # Installation dans le répertoire moderne attendu.
          cp -a \
            "${TEMP_DIR}/extracted/cmdline-tools/." \
            "${SDK_ROOT}/cmdline-tools/latest/"

          # Chemin du vrai sdkmanager moderne.
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          # Vérification.
          if [ ! -x "${SDKMANAGER}" ]; then

            echo
            echo "ERREUR : sdkmanager moderne introuvable :"
            echo "${SDKMANAGER}"

            exit 1

          fi

          echo
          echo "sdkmanager moderne :"
          echo "${SDKMANAGER}"


      # ========================================================
      # 9 - CONFIGURER L'ENVIRONNEMENT ANDROID
      # ========================================================

      - name: "9 - Configurer les variables Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          # Variables Android.
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

          # Outils Android ajoutés au PATH.
          echo "PATH=${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}:${PATH}" >> "${GITHUB_ENV}"

          echo
          echo "Variables Android configurées."


      # ========================================================
      # 10 - ACCEPTER LES LICENCES
      # ========================================================

      - name: "10 - Accepter les licences Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          # ----------------------------------------------------
          # Ne pas utiliser :
          #
          #   yes | sdkmanager --licenses
          #
          # car cela peut provoquer SIGPIPE / Broken pipe.
          #
          # Nous envoyons un nombre fini de réponses.
          # ----------------------------------------------------

          LICENSE_INPUT="${RUNNER_TEMP}/android-license-input"

          for i in $(seq 1 100); do
            printf 'y\n'
          done > "${LICENSE_INPUT}"

          set +e

          LICENSE_OUTPUT="$(
            "${SDKMANAGER}" --licenses \
              < "${LICENSE_INPUT}" \
              2>&1
          )"

          SDKMANAGER_EXIT_CODE=$?

          set -e

          echo "${LICENSE_OUTPUT}"

          # Vérification du dossier des licences.
          if [ ! -d "${SDK_ROOT}/licenses" ]; then

            echo
            echo "ERREUR : dossier licenses absent."

            exit 1

          fi

          LICENSE_COUNT="$(
            find "${SDK_ROOT}/licenses" \
              -type f \
              | wc -l
          )"

          echo
          echo "Nombre de fichiers de licence : ${LICENSE_COUNT}"

          if [ "${LICENSE_COUNT}" -eq 0 ]; then

            echo
            echo "ERREUR : aucune licence détectée."

            exit 1

          fi

          echo
          echo "Licences Android : OK"


      # ========================================================
      # 11 - INSTALLER LES COMPOSANTS ANDROID
      # ========================================================

      - name: "11 - Installer les composants Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "================================================"
          echo "INSTALLATION DU SDK"
          echo "================================================"

          # Installation des composants nécessaires.
          "${SDKMANAGER}" \
            --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo
          echo "Composants Android installés."


      # ========================================================
      # 12 - VÉRIFIER LE SDK MODERNE
      # ========================================================

      - name: "12 - Vérifier le SDK Android"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "================================================"
          echo "VÉRIFICATION DU SDK"
          echo "================================================"

          # Vérification du sdkmanager moderne.
          echo
          echo "sdkmanager :"
          "${SDKMANAGER}" --version

          # Vérification adb.
          echo
          echo "adb :"

          test -x \
            "${SDK_ROOT}/platform-tools/adb"

          "${SDK_ROOT}/platform-tools/adb" version

          # Vérification aapt.
          echo
          echo "aapt :"

          test -x \
            "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" version

          # Vérification aidl.
          echo
          echo "aidl :"

          test -x \
            "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aidl" \
            --version \
            || true

          # Vérification API.
          echo
          echo "API Android :"

          test -d \
            "${SDK_ROOT}/platforms/android-${ANDROID_API}"

          echo "android-${ANDROID_API} : OK"

          # Vérification Build Tools.
          echo
          echo "Build Tools :"

          test -d \
            "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "${ANDROID_BUILD_TOOLS} : OK"

          # Vérification NDK.
          echo
          echo "NDK :"

          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          test -f \
            "${NDK_ROOT}/source.properties"

          cat "${NDK_ROOT}/source.properties"

          echo
          echo "NDK : OK"


      # ========================================================
      # 13 - COMPATIBILITÉ BUILDOZER 1.6.0 / SDK MODERNE
      # ========================================================
      #
      # IMPORTANT :
      #
      # Buildozer 1.6.0 recherche encore :
      #
      #   $ANDROID_SDK_ROOT/tools/bin/sdkmanager
      #
      # alors que le sdkmanager moderne se trouve ici :
      #
      #   $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
      #
      # Nous créons donc un PETIT SCRIPT WRAPPER :
      #
      #   tools/bin/sdkmanager
      #
      # Ce script appelle directement le vrai sdkmanager moderne.
      #
      # IMPORTANT :
      #
      # Ce n'est PAS un lien symbolique.
      #
      # Le lien symbolique utilisé précédemment provoquait :
      #
      #   ClassNotFoundException:
      #   com.android.sdklib.tool.sdkmanager.SdkManagerCli
      #
      # Le wrapper évite ce problème car le vrai sdkmanager est
      # exécuté depuis son emplacement réel.
      # ==============================================================

      - name: "13 - Ajouter le wrapper sdkmanager pour Buildozer 1.6.0"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          MODERN_SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          LEGACY_DIR="${SDK_ROOT}/tools/bin"

          LEGACY_SDKMANAGER="${LEGACY_DIR}/sdkmanager"

          echo
          echo "================================================"
          echo "COMPATIBILITÉ BUILDOZER / SDKMANAGER"
          echo "================================================"

          echo
          echo "sdkmanager moderne :"
          echo "${MODERN_SDKMANAGER}"

          # Vérification du vrai sdkmanager.
          if [ ! -x "${MODERN_SDKMANAGER}" ]; then

            echo
            echo "ERREUR : sdkmanager moderne introuvable."

            exit 1

          fi

          # ----------------------------------------------------
          # Nettoyage de l'ancien éventuel lien symbolique.
          # ----------------------------------------------------

          if [ -L "${LEGACY_SDKMANAGER}" ]; then

            echo
            echo "Ancien lien symbolique détecté."

            rm -f "${LEGACY_SDKMANAGER}"

          fi

          # ----------------------------------------------------
          # Création du répertoire attendu par Buildozer.
          # ----------------------------------------------------

          mkdir -p "${LEGACY_DIR}"

          # ----------------------------------------------------
          # Création du wrapper.
          # ----------------------------------------------------

          cat > "${LEGACY_SDKMANAGER}" <<EOF
          #!/usr/bin/env bash
          
          # ==============================================================
          # WRAPPER BUILDOZER 1.6.0 -> SDKMANAGER MODERNE
          #
          # Buildozer 1.6.0 recherche :
          #
          #   \$ANDROID_SDK_ROOT/tools/bin/sdkmanager
          #
          # Les Android Command Line Tools modernes fournissent :
          #
          #   \$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          #
          # Ce script redirige explicitement Buildozer vers le vrai
          # sdkmanager moderne.
          # ==============================================================
          
          set -euo pipefail
          
          exec "${MODERN_SDKMANAGER}" "\$@"
          EOF
          
          # Rend le wrapper exécutable.
          chmod +x "${LEGACY_SDKMANAGER}"

          echo
          echo "Wrapper créé :"
          ls -l "${LEGACY_SDKMANAGER}"

          # ----------------------------------------------------
          # Vérifier qu'il s'agit bien d'un fichier normal
          # et NON d'un lien symbolique.
          # ----------------------------------------------------

          if [ -L "${LEGACY_SDKMANAGER}" ]; then

            echo
            echo "ERREUR : le wrapper est encore un lien symbolique."

            exit 1

          fi

          if [ ! -f "${LEGACY_SDKMANAGER}" ]; then

            echo
            echo "ERREUR : wrapper introuvable."

            exit 1

          fi

          # ----------------------------------------------------
          # Tester le wrapper.
          #
          # Il doit appeler le sdkmanager moderne.
          # ----------------------------------------------------

          echo
          echo "Test du wrapper :"

          WRAPPER_VERSION="$(
            "${LEGACY_SDKMANAGER}" --version
          )"

          echo "${WRAPPER_VERSION}"

          # ----------------------------------------------------
          # Test du vrai sdkmanager.
          # ----------------------------------------------------

          echo
          echo "Test du sdkmanager moderne :"

          "${MODERN_SDKMANAGER}" --version

          echo
          echo "================================================"
          echo "WRAPPER SDKMANAGER : OK"
          echo "================================================"


      # ========================================================
      # 14 - VÉRIFIER BUILDOZER.SPEC
      # ========================================================

      - name: "14 - Vérifier buildozer.spec"
        shell: bash
        run: |

          set -euo pipefail

          SPEC="buildozer.spec"

          if [ ! -f "${SPEC}" ]; then

            echo
            echo "ERREUR : buildozer.spec introuvable."

            exit 1

          fi

          echo
          echo "================================================"
          echo "CONFIGURATION BUILDOZER"
          echo "================================================"

          # Affichage des paramètres Android.
          grep -nE \
            '^\[app\]|android\.api|android\.minapi|android\.sdk_build_tools|android\.ndk|android\.sdk_path|android\.archs|android\.skip_update' \
            "${SPEC}" \
            || true

          # Fonction de récupération des valeurs.
          get_spec_value() {

            local KEY="$1"

            awk -F '=' -v key="${KEY}" '
              $0 !~ /^[[:space:]]*#/ &&
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                value=$2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' "${SPEC}"

          }

          API_VALUE="$(get_spec_value "android.api")"
          MIN_API_VALUE="$(get_spec_value "android.minapi")"
          BUILD_TOOLS_VALUE="$(get_spec_value "android.sdk_build_tools")"
          NDK_VALUE="$(get_spec_value "android.ndk")"
          SDK_PATH_VALUE="$(get_spec_value "android.sdk_path")"
          ARCHS_VALUE="$(get_spec_value "android.archs")"
          SKIP_UPDATE_VALUE="$(get_spec_value "android.skip_update")"

          echo
          echo "Valeurs détectées :"

          echo "android.api = ${API_VALUE}"
          echo "android.minapi = ${MIN_API_VALUE}"
          echo "android.sdk_build_tools = ${BUILD_TOOLS_VALUE}"
          echo "android.ndk = ${NDK_VALUE}"
          echo "android.sdk_path = ${SDK_PATH_VALUE}"
          echo "android.archs = ${ARCHS_VALUE}"
          echo "android.skip_update = ${SKIP_UPDATE_VALUE}"

          # API.
          if [ "${API_VALUE}" != "${ANDROID_API}" ]; then
            echo "ERREUR : android.api incorrect."
            exit 1
          fi

          # Min API.
          if [ "${MIN_API_VALUE}" != "${ANDROID_MIN_API}" ]; then
            echo "ERREUR : android.minapi incorrect."
            exit 1
          fi

          # Build Tools.
          if [ "${BUILD_TOOLS_VALUE}" != "${ANDROID_BUILD_TOOLS}" ]; then
            echo "ERREUR : android.sdk_build_tools incorrect."
            exit 1
          fi

          # Buildozer doit utiliser 28c.
          if [ "${NDK_VALUE}" != "28c" ]; then
            echo "ERREUR : android.ndk doit être 28c."
            exit 1
          fi

          # SDK local.
          if [ "${SDK_PATH_VALUE}" != ".android-sdk" ]; then
            echo "ERREUR : android.sdk_path doit être .android-sdk."
            exit 1
          fi

          # Architectures.
          if [[ "${ARCHS_VALUE}" != *"arm64-v8a"* ]]; then
            echo "ERREUR : arm64-v8a absent."
            exit 1
          fi

          if [[ "${ARCHS_VALUE}" != *"armeabi-v7a"* ]]; then
            echo "ERREUR : armeabi-v7a absent."
            exit 1
          fi

          # skip_update.
          case "${SKIP_UPDATE_VALUE,,}" in

            1|true|yes|on)
              echo
              echo "android.skip_update : OK"
              ;;

            *)
              echo
              echo "ERREUR : android.skip_update doit être activé."
              exit 1
              ;;

          esac

          echo
          echo "================================================"
          echo "buildozer.spec : OK"
          echo "================================================"


      # ========================================================
      # 15 - VÉRIFIER L'ABSENCE DE REPORTLAB
      # ========================================================

      - name: "15 - Vérifier la suppression de ReportLab"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "VÉRIFICATION REPORTLAB"
          echo "================================================"

          # Recherche dans le code Python actif.
          if grep -RniE \
            --include='*.py' \
            '(^|[^[:alnum:]_])reportlab([^[:alnum:]_]|$)|generer_rapport_pdf' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer \
            --exclude-dir=.android-sdk
          then

            echo
            echo "ERREUR : ReportLab détecté dans le code Python."

            exit 1

          fi

          # Suppression des commentaires pour éviter les faux positifs.
          SPEC_CLEAN="${RUNNER_TEMP}/buildozer-spec-active.txt"

          sed \
            '/^[[:space:]]*#/d' \
            buildozer.spec \
            > "${SPEC_CLEAN}"

          # Recherche dans buildozer.spec.
          if grep -niE \
            'reportlab|generer_rapport_pdf' \
            "${SPEC_CLEAN}"
          then

            echo
            echo "ERREUR : ReportLab actif dans buildozer.spec."

            exit 1

          fi

          # Recherche dans requirements.txt.
          if [ -f "requirements.txt" ]; then

            REQUIREMENTS_CLEAN="${RUNNER_TEMP}/requirements-active.txt"

            sed \
              -e '/^[[:space:]]*#/d' \
              -e '/^[[:space:]]*$/d' \
              requirements.txt \
              > "${REQUIREMENTS_CLEAN}"

            if grep -niE \
              '^reportlab([<>=!~]|$)' \
              "${REQUIREMENTS_CLEAN}"
            then

              echo
              echo "ERREUR : ReportLab dans requirements.txt."

              exit 1

            fi

          fi

          # Recherche de recettes p4a locales.
          if [ -d "p4a.local_recipes" ]; then

            if find p4a.local_recipes \
              -iname '*reportlab*' \
              -print \
              | grep -q .
            then

              echo
              echo "ERREUR : recette ReportLab détectée."

              exit 1

            fi

          fi

          echo
          echo "ReportLab : absent du code Android."

          echo
          echo "================================================"
          echo "REPORTLAB : OK"
          echo "================================================"


      # ========================================================
      # 16 - NETTOYER BUILDOZER
      # ========================================================

      - name: "16 - Nettoyer l'ancien environnement Buildozer"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "NETTOYAGE BUILDOZER"
          echo "================================================"

          # ----------------------------------------------------
          # IMPORTANT :
          #
          # On supprime .buildozer afin de repartir proprement.
          #
          # On NE supprime PAS .android-sdk.
          # ----------------------------------------------------

          rm -rf .buildozer

          echo
          echo ".buildozer supprimé."

          echo
          echo ".android-sdk conservé."

          # Le wrapper doit toujours exister.
          test -x \
            "${ANDROID_SDK_ROOT_PATH}/tools/bin/sdkmanager"

          echo
          echo "Wrapper sdkmanager conservé."


      # ========================================================
      # 17 - VÉRIFICATION FINALE AVANT BUILDOZER
      # ========================================================

      - name: "17 - Vérification finale du SDK"
        shell: bash
        run: |

          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT_PATH}"

          MODERN_SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          WRAPPER="${SDK_ROOT}/tools/bin/sdkmanager"

          echo
          echo "================================================"
          echo "VÉRIFICATION FINALE"
          echo "================================================"

          echo
          echo "SDK :"
          echo "${SDK_ROOT}"

          echo
          echo "sdkmanager moderne :"
          echo "${MODERN_SDKMANAGER}"

          echo
          echo "wrapper Buildozer :"
          echo "${WRAPPER}"

          # Test du vrai sdkmanager.
          echo
          echo "Version sdkmanager moderne :"

          "${MODERN_SDKMANAGER}" --version

          # Test du wrapper.
          echo
          echo "Version sdkmanager via wrapper :"

          "${WRAPPER}" --version

          # Vérification des fichiers essentiels.
          test -d \
            "${SDK_ROOT}/platforms/android-${ANDROID_API}"

          test -d \
            "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

          test -d \
            "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo
          echo "SDK et wrapper : OK."


      # ========================================================
      # 18 - AFFICHER LA CONFIGURATION
      # ========================================================

      - name: "18 - Afficher la configuration Buildozer"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "CONFIGURATION AVANT COMPILATION"
          echo "================================================"

          echo
          echo "Python :"
          python --version

          echo
          echo "Java :"
          java -version

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME}"

          echo
          echo "ANDROID_SDK_ROOT :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "Configuration Android :"

          grep -nE \
            '^\[app\]|android\.' \
            buildozer.spec \
            || true


      # ========================================================
      # 19 - COMPILATION APK
      # ========================================================

      - name: "19 - Construire l'APK Android"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "DÉBUT DE LA COMPILATION ANDROID"
          echo "================================================"

          echo
          echo "SDK utilisé :"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "sdkmanager moderne :"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          echo
          echo "wrapper utilisé par Buildozer 1.6.0 :"
          echo "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"

          echo
          echo "Test du wrapper :"
          "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" --version

          echo
          echo "Lancement de Buildozer..."

          # Buildozer 1.6.0 va rechercher :
          #
          #   tools/bin/sdkmanager
          #
          # Le wrapper créé à l'étape 13 redirige cet appel
          # vers le sdkmanager moderne.
          buildozer android debug

          echo
          echo "================================================"
          echo "COMPILATION TERMINÉE"
          echo "================================================"


      # ========================================================
      # 20 - RECHERCHER L'APK
      # ========================================================

      - name: "20 - Rechercher l'APK généré"
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "================================================"
          echo "RECHERCHE APK"
          echo "================================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

          APK_COUNT="$(
            find . \
              -type f \
              -name "*.apk" \
              -not -path "./.git/*" \
              | wc -l
          )"

          echo
          echo "Nombre d'APK : ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then

            echo
            echo "ERREUR : aucun APK généré."

            exit 1

          fi

          echo
          echo "APK trouvé."


      # ========================================================
      # 21 - PUBLIER L'APK
      # ========================================================

      - name: "21 - Publier l'APK"
        uses: actions/upload-artifact@v4

        with:

          # Nom de l'artifact GitHub.
          name: suivi-auto-apk

          # APK produit par Buildozer.
          path: bin/*.apk

          # Échec explicite si aucun APK.
          if-no-files-found: error


      # ========================================================
      # 22 - DIAGNOSTICS EN CAS D'ÉCHEC
      # ========================================================

      - name: "22 - Diagnostics en cas d'échec"
        if: failure()
        shell: bash
        run: |

          set +e

          echo
          echo "================================================"
          echo "DIAGNOSTICS"
          echo "================================================"

          echo
          echo "Python :"
          python --version

          echo
          echo "Java :"
          java -version

          echo
          echo "Buildozer :"
          buildozer --version

          echo
          echo "SDK :"
          echo "${ANDROID_SDK_ROOT:-non défini}"

          echo
          echo "sdkmanager moderne :"

          MODERN_SDKMANAGER="${ANDROID_SDK_ROOT_PATH}/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "${MODERN_SDKMANAGER}" ]; then
            "${MODERN_SDKMANAGER}" --version
          else
            echo "sdkmanager moderne absent."
          fi

          echo
          echo "wrapper Buildozer :"

          WRAPPER="${ANDROID_SDK_ROOT_PATH}/tools/bin/sdkmanager"

          if [ -f "${WRAPPER}" ]; then

            ls -l "${WRAPPER}"

            echo
            echo "Contenu du wrapper :"

            cat "${WRAPPER}"

            echo
            echo "Test wrapper :"

            "${WRAPPER}" --version

          else

            echo "Wrapper absent."

          fi

          echo
          echo "Recherche des sdkmanager :"

          find "${ANDROID_SDK_ROOT_PATH}" \
            -type f \
            -name "sdkmanager" \
            -print

          echo
          echo "Configuration Buildozer :"

          grep -nE \
            '^\[app\]|android\.' \
            buildozer.spec \
            || true

          echo
          echo "================================================"
          echo "FIN DES DIAGNOSTICS"
          echo "================================================"
