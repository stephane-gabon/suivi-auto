name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "33"
      ANDROID_MIN_API: "24"
      ANDROID_BUILD_TOOLS: "35.0.0"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            tar \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev

      # ============================================================
      # 5. PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Python build tools
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      # ============================================================
      # 6. INITIALIZE BUILDOZER
      # ============================================================
      - name: Initialize Buildozer Android environment
        run: |
          set -euxo pipefail

          buildozer android clean || true

      # ============================================================
      # 7. CONFIGURE ANDROID SDK ENVIRONMENT
      # ============================================================
      - name: Configure Android SDK environment
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=${ANDROID_API}" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=${ANDROID_MIN_API}" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

      # ============================================================
      # 8. INSTALL ANDROID COMMAND LINE TOOLS + SDK
      # ============================================================
      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"
          CMDLINE_TOOLS="$SDK/cmdline-tools/latest"
          SDKMANAGER="$CMDLINE_TOOLS/bin/sdkmanager"

          mkdir -p "$SDK/cmdline-tools"

          echo "Downloading Android Command Line Tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/commandlinetools.zip

          test -s /tmp/commandlinetools.zip

          rm -rf "$CMDLINE_TOOLS"

          mkdir -p "$CMDLINE_TOOLS"

          unzip -q \
            /tmp/commandlinetools.zip \
            -d "$CMDLINE_TOOLS"

          # Google place normalement les outils dans :
          # cmdline-tools/latest/cmdline-tools/*
          #
          # On les déplace directement dans latest/
          if [ -d "$CMDLINE_TOOLS/cmdline-tools" ]; then
            mv "$CMDLINE_TOOLS/cmdline-tools/"* \
              "$CMDLINE_TOOLS/"
            rm -rf "$CMDLINE_TOOLS/cmdline-tools"
          fi

          chmod +x "$SDKMANAGER"

          echo "Checking sdkmanager..."

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK components..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "Verifying Android SDK..."

          test -d "$SDK/platforms/android-${ANDROID_API}"

          test -d "$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          test -d "$SDK/platform-tools"

          echo "Android SDK successfully installed."

      # ============================================================
      # 9. SDKMANAGER COMPATIBILITY FOR P4A
      # ============================================================
      - name: Configure sdkmanager compatibility
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          MODERN_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          LEGACY_DIR="$SDK/tools/bin"

          LEGACY_SDKMANAGER="$LEGACY_DIR/sdkmanager"

          test -x "$MODERN_SDKMANAGER"

          mkdir -p "$LEGACY_DIR"

          ln -sf \
            "$MODERN_SDKMANAGER" \
            "$LEGACY_SDKMANAGER"

          echo "Legacy sdkmanager path:"

          ls -la "$LEGACY_DIR"

          echo "sdkmanager version:"

          "$LEGACY_SDKMANAGER" --version

      # ============================================================
      # 10. CACHE BUILDOZER DOWNLOADS
      # ============================================================
      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
          key: buildozer-android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-${{ runner.os }}-

      # ============================================================
      # 11. VERIFY LOCAL REPORTLAB RECIPE
      # ============================================================
      - name: Verify local ReportLab recipe
        run: |
          set -euxo pipefail

          echo "Checking local ReportLab recipe..."

          test -f \
            "p4a-recipes/reportlab/__init__.py"

          test -f \
            "p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

          echo "ReportLab recipe:"

          ls -lh \
            "p4a-recipes/reportlab/__init__.py"

          echo "ReportLab archive:"

          ls -lh \
            "p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

          echo "ReportLab recipe content:"

          sed -n '1,240p' \
            "p4a-recipes/reportlab/__init__.py"

      # ============================================================
      # 12. VERIFY BUILDOZER SPEC
      # ============================================================
      - name: Verify Buildozer local recipes configuration
        run: |
          set -euxo pipefail

          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo ""
          echo "Local recipes configuration:"
          grep -nE 'p4a\.local_recipes(_dir)?[[:space:]]*=' buildozer.spec || true

          if grep -Eq \
            '^[[:space:]]*p4a\.local_recipes_dir[[:space:]]*=[[:space:]]*p4a-recipes' \
            buildozer.spec
          then
            echo ""
            echo "OK: p4a.local_recipes_dir = p4a-recipes"
            exit 0
          fi

          if grep -Eq \
            '^[[:space:]]*p4a\.local_recipes[[:space:]]*=[[:space:]]*p4a-recipes' \
            buildozer.spec
          then
            echo ""
            echo "OK: p4a.local_recipes = p4a-recipes"
            exit 0
          fi

          echo ""
          echo "ERREUR : aucune configuration locale p4a-recipes trouvée."
          echo ""
          echo "Le buildozer.spec doit contenir :"
          echo ""
          echo "p4a.local_recipes_dir = p4a-recipes"
          echo ""
          exit 1

      # ============================================================
      # 13. PREPARE LOCAL REPORTLAB SOURCE
      # ============================================================
      - name: Prepare local ReportLab source
        run: |
          set -euxo pipefail

          RECIPE_DIR="$GITHUB_WORKSPACE/p4a-recipes/reportlab"

          REPORTLAB_ARCHIVE="$RECIPE_DIR/reportlab-fe660f227cac.tar.gz"

          REPORTLAB_SOURCE="$HOME/.buildozer/local-reportlab"

          echo "Recipe directory:"
          echo "$RECIPE_DIR"

          echo "Archive:"
          echo "$REPORTLAB_ARCHIVE"

          echo "Local extraction directory:"
          echo "$REPORTLAB_SOURCE"

          test -f "$RECIPE_DIR/__init__.py"

          test -f "$REPORTLAB_ARCHIVE"

          rm -rf "$REPORTLAB_SOURCE"

          mkdir -p "$REPORTLAB_SOURCE"

          echo "Testing ReportLab archive..."

          tar -tzf "$REPORTLAB_ARCHIVE" >/dev/null

          echo "Extracting ReportLab..."

          tar -xzf \
            "$REPORTLAB_ARCHIVE" \
            -C "$REPORTLAB_SOURCE"

          echo "Extracted files:"

          find "$REPORTLAB_SOURCE" \
            -maxdepth 3 \
            -type f \
            -print \
            | head -n 100

          EXTRACTED_DIR="$(
            find "$REPORTLAB_SOURCE" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              -quit
          )"

          if [ -z "$EXTRACTED_DIR" ]; then
            echo ""
            echo "ERREUR : impossible de trouver le dossier ReportLab extrait."

            find "$REPORTLAB_SOURCE" \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo ""
          echo "ReportLab source locale :"
          echo "$EXTRACTED_DIR"

          test -d "$EXTRACTED_DIR"

          echo "P4A_REPORTLAB_DIR=$EXTRACTED_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 14. VERIFY LOCAL REPORTLAB SOURCE
      # ============================================================
      - name: Verify local ReportLab source
        run: |
          set -euxo pipefail

          echo "P4A_REPORTLAB_DIR:"
          echo "$P4A_REPORTLAB_DIR"

          test -n "$P4A_REPORTLAB_DIR"

          test -d "$P4A_REPORTLAB_DIR"

          echo ""
          echo "ReportLab source directory:"

          ls -la "$P4A_REPORTLAB_DIR"

          echo ""
          echo "ReportLab source files:"

          find "$P4A_REPORTLAB_DIR" \
            -maxdepth 2 \
            -type f \
            -print \
            | head -n 100

          echo ""
          echo "IMPORTANT:"
          echo "python-for-android will use this local source."
          echo "It should NOT download ReportLab from hg.reportlab.com."

      # ============================================================
      # 15. CLEAN BUILDOZER BUILD DIRECTORIES
      # ============================================================
      - name: Clean Buildozer build directories
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          rm -rf bin

          mkdir -p bin

      # ============================================================
      # 16. VERIFY COMPLETE ANDROID ENVIRONMENT
      # ============================================================
      - name: Verify Android environment before Buildozer
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          echo "=================================================="
          echo "ANDROID ENVIRONMENT"
          echo "=================================================="

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo ""
          echo "=================================================="
          echo "REPORTLAB"
          echo "=================================================="

          echo "P4A_REPORTLAB_DIR=$P4A_REPORTLAB_DIR"

          test -n "$P4A_REPORTLAB_DIR"

          test -d "$P4A_REPORTLAB_DIR"

          echo ""
          echo "=================================================="
          echo "SDKMANAGER"
          echo "=================================================="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "=================================================="
          echo "AIDL"
          echo "=================================================="

          "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aidl" \
            --help >/dev/null

          echo ""
          echo "=================================================="
          echo "JAVA"
          echo "=================================================="

          java -version

          echo ""
          echo "=================================================="
          echo "PYTHON"
          echo "=================================================="

          python --version

          echo ""
          echo "=================================================="
          echo "CYTHON"
          echo "=================================================="

          cython --version

          echo ""
          echo "=================================================="
          echo "BUILDOZER"
          echo "=================================================="

          buildozer --version

          echo ""
          echo "=================================================="
          echo "P4A REPORTLAB SOURCE"
          echo "=================================================="

          find "$P4A_REPORTLAB_DIR" \
            -maxdepth 2 \
            -type f \
            -print \
            | head -n 50

      # ============================================================
      # 17. BUILD APK
      # ============================================================
      - name: Build Android APK
        run: |
          set -uo pipefail

          echo "=================================================="
          echo "PREPARING BUILD ENVIRONMENT"
          echo "=================================================="

          export ANDROIDSDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          export ANDROIDAPI="$ANDROID_API"
          export ANDROIDMINAPI="$ANDROID_MIN_API"

          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          # ========================================================
          # LOCAL REPORTLAB SOURCE
          # ========================================================

          REPORTLAB_ARCHIVE="$GITHUB_WORKSPACE/p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz"

          REPORTLAB_ROOT="$HOME/.buildozer/local-reportlab"

          echo "ReportLab archive:"
          echo "$REPORTLAB_ARCHIVE"

          test -f "$REPORTLAB_ARCHIVE"

          rm -rf "$REPORTLAB_ROOT"

          mkdir -p "$REPORTLAB_ROOT"

          echo ""
          echo "Extracting ReportLab archive..."

          tar -xzf \
            "$REPORTLAB_ARCHIVE" \
            -C "$REPORTLAB_ROOT"

          REPORTLAB_DIR="$(
            find "$REPORTLAB_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              -quit
          )"

          if [ -z "$REPORTLAB_DIR" ]; then
            echo "ERROR: ReportLab extraction directory not found."

            find "$REPORTLAB_ROOT" \
              -maxdepth 3 \
              -print

            exit 1
          fi

          # IMPORTANT:
          # p4a reads this exact environment variable.
          export P4A_REPORTLAB_DIR="$REPORTLAB_DIR"

          echo ""
          echo "=================================================="
          echo "REPORTLAB CONFIGURATION"
          echo "=================================================="

          echo "P4A_REPORTLAB_DIR=$P4A_REPORTLAB_DIR"

          test -d "$P4A_REPORTLAB_DIR"

          echo ""
          echo "ReportLab files:"

          find "$P4A_REPORTLAB_DIR" \
            -maxdepth 2 \
            -type f \
            -print \
            | head -n 100

          # ========================================================
          # VERIFY BUILDOZER CONFIGURATION
          # ========================================================

          echo ""
          echo "=================================================="
          echo "BUILDOZER LOCAL RECIPES"
          echo "=================================================="

          grep -n \
            "p4a.local_recipes" \
            buildozer.spec \
            || true

          if ! grep -Eq \
            '^[[:space:]]*p4a\.local_recipes[[:space:]]*=[[:space:]]*p4a-recipes' \
            buildozer.spec
          then
            echo ""
            echo "ERROR:"
            echo "buildozer.spec must contain:"
            echo ""
            echo "p4a.local_recipes = p4a-recipes"
            echo ""

            exit 1
          fi

          # ========================================================
          # VERIFY ENVIRONMENT
          # ========================================================

          echo ""
          echo "=================================================="
          echo "ENVIRONMENT CHECK"
          echo "=================================================="

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo ""
          echo "P4A_REPORTLAB_DIR=$P4A_REPORTLAB_DIR"

          echo ""
          echo "ANDROID_NDK=${ANDROID_NDK-<unset>}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME-<unset>}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT-<unset>}"

          # ========================================================
          # CRITICAL TEST:
          # Confirm Python sees P4A_REPORTLAB_DIR
          # ========================================================

          echo ""
          echo "=================================================="
          echo "PYTHON ENVIRONMENT CHECK"
          echo "=================================================="

          python -c '
          import os
          path = os.environ.get("P4A_REPORTLAB_DIR")
          print("P4A_REPORTLAB_DIR =", path)
          assert path, "P4A_REPORTLAB_DIR is missing"
          assert os.path.isdir(path), "P4A_REPORTLAB_DIR does not exist"
          '

          # ========================================================
          # BUILD
          # ========================================================

          echo ""
          echo "=================================================="
          echo "STARTING BUILDOZER"
          echo "=================================================="

          set +e

          buildozer -v android debug \
            2>&1 | tee buildozer-full.log

          BUILDOZER_STATUS=${PIPESTATUS[0]}

          set -e

          # ========================================================
          # REPORTLAB DIAGNOSTIC
          # ========================================================

          echo ""
          echo "=================================================="
          echo "REPORTLAB DOWNLOAD CHECK"
          echo "=================================================="

          if grep -Fq "hg.reportlab.com" buildozer-full.log; then
            echo ""
            echo "ERROR: p4a still attempted to download ReportLab."
            echo ""

            grep -Fn \
              "hg.reportlab.com" \
              buildozer-full.log \
              | tail -n 50

            echo ""
            echo "P4A_REPORTLAB_DIR=$P4A_REPORTLAB_DIR"

            exit 1
          fi

          echo "SUCCESS:"
          echo "No remote ReportLab download detected."

          # ========================================================
          # NETWORK DIAGNOSTICS
          # ========================================================

          echo ""
          echo "=================================================="
          echo "DOWNLOAD DIAGNOSTICS"
          echo "=================================================="

          grep -Ei \
            'HTTP Error|403|401|404|429|500|502|503|504|Gateway|Download failed|urllib|timeout|timed out' \
            buildozer-full.log \
            | tail -n 150 \
            || true

          # ========================================================
          # LAST LOG
          # ========================================================

          echo ""
          echo "=================================================="
          echo "LAST 250 LOG LINES"
          echo "=================================================="

          tail -n 250 buildozer-full.log

          exit "$BUILDOZER_STATUS"

          
      # ============================================================
      # 18. VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          set -euxo pipefail

          echo "Searching for APK..."

          find bin \
            -maxdepth 2 \
            -type f \
            -print

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERREUR : aucun APK généré."

            echo ""
            echo "Contents of bin/:"

            find bin \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo ""
          echo "APK generated successfully:"

          echo "$APK"

          ls -lh "$APK"

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error

      # ============================================================
      # 20. UPLOAD BUILDOZER LOG
      # ============================================================
      - name: Upload Buildozer diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer-full.log
          if-no-files-found: warn
