# ========================================================================
# WORKFLOW GITHUB ACTIONS
# Projet : Suivi Auto
# Fichier : .github/workflows/build-android.yml
# ========================================================================
#
# OBJECTIF
# --------
# Compiler l'application Kivy "Suivi Auto" en APK Android avec :
#
#   - Ubuntu 22.04
#   - Python hôte 3.10
#   - Python Android 3.10.11
#   - hostpython3 3.10.11
#   - Java 17 Temurin
#   - Buildozer 1.6.0
#   - Cython 0.29.37
#   - Android API 33
#   - Android min API 24
#   - Android Build Tools 34.0.0
#   - Android NDK 28c
#   - arm64-v8a
#   - armeabi-v7a
#
# DÉPENDANCES PYTHON DE L'APPLICATION
# ------------------------------------
#
#   - Kivy
#   - Plyer
#   - OpenPyXL
#
# Pandas est volontairement supprimé.
# ReportLab est volontairement supprimé.
#
# ------------------------------------------------------------------------
# CORRECTION IMPORTANTE - PIP PYTHON-FOR-ANDROID
# ------------------------------------------------------------------------
#
# Le build précédent échouait dans le venv interne de p4a avec :
#
#   ImportError: cannot import name 'open_rich_spinner'
#   from pip._internal.cli.spinners
#
# Ce pip n'est PAS le pip du runner GitHub Actions.
#
# Il s'agit du pip installé dans :
#
#   .buildozer/android/platform/build-*/build/venv/
#
# Python-for-android crée cet environnement pendant la compilation.
#
# Le workflow utilise donc un checkout local de python-for-android :
#
#   .p4a/
#
# puis applique deux corrections :
#
#   1. création du venv avec --clear ;
#   2. pip explicitement fixé à 25.2.
#
# Buildozer utilise ensuite :
#
#   p4a.source_dir = .p4a
#
# au lieu de télécharger une autre copie de p4a.
#
# ========================================================================


name: "Build Android - Suivi Auto"


# ========================================================================
# DÉCLENCHEURS
# ========================================================================

on:

  # Compilation automatique lors d'un push sur main.
  push:
    branches:
      - main

  # Compilation de contrôle pour les Pull Requests vers main.
  pull_request:
    branches:
      - main

  # Permet également de lancer manuellement le workflow depuis GitHub.
  workflow_dispatch:


# ========================================================================
# PERMISSIONS
# ========================================================================
#
# Le workflow n'a besoin que de lire le dépôt.
# ========================================================================

permissions:
  contents: read


# ========================================================================
# VARIABLES GLOBALES
# ========================================================================

env:

  # ----------------------------------------------------------------------
  # SDK Android utilisé par Buildozer.
  # ----------------------------------------------------------------------
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

  # ----------------------------------------------------------------------
  # Version des Android Command Line Tools.
  # ----------------------------------------------------------------------
  CMDLINE_TOOLS_VERSION: "11076708"

  # ----------------------------------------------------------------------
  # Configuration Android.
  # ----------------------------------------------------------------------
  ANDROID_API: "33"
  ANDROID_MIN_API: "24"
  ANDROID_BUILD_TOOLS: "34.0.0"

  # ----------------------------------------------------------------------
  # NDK.
  #
  # Buildozer utilise :
  #
  #   android.ndk = 28c
  #
  # Le package réellement fourni par sdkmanager est :
  #
  #   ndk;28.2.13676358
  # ----------------------------------------------------------------------
  ANDROID_NDK: "28c"
  ANDROID_NDK_PACKAGE: "28.2.13676358"

  # ----------------------------------------------------------------------
  # Architectures Android.
  # ----------------------------------------------------------------------
  ANDROID_ARCHS: "arm64-v8a,armeabi-v7a"

  # ----------------------------------------------------------------------
  # Version de python-for-android utilisée par le workflow.
  #
  # Cette valeur est utilisée comme branche Git.
  #
  # Le checkout local est ensuite patché avant d'être utilisé par
  # Buildozer.
  # ----------------------------------------------------------------------
  P4A_BRANCH: "master"

  # ----------------------------------------------------------------------
  # Version du pip qui sera installée dans le venv p4a.
  # ----------------------------------------------------------------------
  P4A_PIP_VERSION: "25.2"


# ========================================================================
# JOB PRINCIPAL
# ========================================================================

jobs:

  build-android:

    # Ubuntu 22.04 est utilisé volontairement pour conserver un
    # environnement stable et compatible avec la chaîne Kivy/p4a.
    runs-on: ubuntu-22.04


    steps:


      # ==================================================================
      # ÉTAPE 1 - RÉCUPÉRER LE CODE SOURCE
      # ==================================================================

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4


      # ==================================================================
      # ÉTAPE 2 - INSTALLER PYTHON 3.10
      # ==================================================================
      #
      # Python 3.10 est utilisé comme Python hôte.
      #
      # Attention :
      #
      # setup-python ne détermine PAS à lui seul le Python construit
      # pour Android.
      #
      # La version Android est également imposée dans buildozer.spec :
      #
      #   python3==3.10.11
      #   hostpython3==3.10.11
      #
      # Les deux doivent être identiques.
      # ==================================================================

      - name: "Installer Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ==================================================================
      # ÉTAPE 3 - INSTALLER JAVA 17
      # ==================================================================
      #
      # Java 17 est utilisé pour Gradle / Android.
      #
      # Le cache Gradle n'est volontairement pas activé afin de limiter
      # les problèmes liés à des caches incompatibles entre versions.
      # ==================================================================

      - name: "Installer Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==================================================================
      # ÉTAPE 4 - INSTALLER LES OUTILS SYSTÈME
      # ==================================================================
      #
      # Certains outils sont nécessaires à python-for-android et aux
      # recettes natives utilisées par Kivy.
      #
      # autopoint est explicitement installé car certains projets
      # Autotools en ont besoin.
      # ==================================================================

      - name: "Installer les dépendances système"
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      # ==================================================================
      # ÉTAPE 5 - INSTALLER BUILDOZER ET CYTHON
      # ==================================================================
      #
      # Buildozer est volontairement fixé à 1.6.0.
      #
      # Cython est fixé à 0.29.37 afin de conserver une chaîne compatible
      # avec la version de Kivy utilisée par le projet.
      # ==================================================================

      - name: "Installer Buildozer et Cython"
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0"

          python -m pip install \
            "Cython==0.29.37"

          echo
          echo "============================================================"
          echo "VERSIONS OUTILS"
          echo "============================================================"

          python --version
          python -m pip --version
          buildozer version
          cython --version


      # ==================================================================
      # ÉTAPE 6 - PRÉPARER LE SDK ANDROID
      # ==================================================================

      - name: "Préparer le SDK Android"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${ANDROID_HOME}"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"


      # ==================================================================
      # ÉTAPE 7 - INSTALLER LES ANDROID COMMAND LINE TOOLS
      # ==================================================================
      #
      # Version :
      #
      #   11076708
      #
      # Le dossier final est :
      #
      #   .android-sdk/cmdline-tools/latest/
      # ==================================================================

      - name: "Installer Android Command Line Tools"
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_ZIP="${RUNNER_TEMP}/commandlinetools.zip"
          TOOLS_TMP="${RUNNER_TEMP}/android-cmdline-tools"
          TOOLS_DIR="${ANDROID_HOME}/cmdline-tools/latest"

          rm -rf "${TOOLS_TMP}"
          rm -rf "${TOOLS_DIR}"

          mkdir -p "${TOOLS_TMP}"
          mkdir -p "${TOOLS_DIR}"

          echo "Téléchargement des Android Command Line Tools..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" \
            --output "${TOOLS_ZIP}"

          unzip -q \
            "${TOOLS_ZIP}" \
            -d "${TOOLS_TMP}"

          mv \
            "${TOOLS_TMP}/cmdline-tools/"* \
            "${TOOLS_DIR}/"

          rm -rf "${TOOLS_TMP}"
          rm -f "${TOOLS_ZIP}"

          echo
          echo "Version sdkmanager :"

          "${TOOLS_DIR}/bin/sdkmanager" --version


      # ==================================================================
      # ÉTAPE 8 - CRÉER LE WRAPPER SDKMANAGER
      # ==================================================================
      #
      # Buildozer 1.6.0 peut rechercher l'ancien chemin :
      #
      #   .android-sdk/tools/bin/sdkmanager
      #
      # alors que les Android Command Line Tools modernes utilisent :
      #
      #   .android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # Nous créons donc un wrapper compatible.
      #
      # IMPORTANT :
      #
      # SDK_ROOT doit remonter de :
      #
      #   .android-sdk/tools/bin/
      #
      # vers :
      #
      #   .android-sdk/
      #
      # donc :
      #
      #   ../..
      #
      # et non :
      #
      #   ../../..
      # ==================================================================

      - name: "Créer le wrapper sdkmanager"
        shell: bash
        run: |
          set -euo pipefail

          LEGACY_BIN="${ANDROID_HOME}/tools/bin"

          mkdir -p "${LEGACY_BIN}"

          cat > "${LEGACY_BIN}/sdkmanager" <<'EOF'
          #!/usr/bin/env bash

          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          SDK_ROOT="$(cd "${SCRIPT_DIR}/../.." && pwd)"

          exec "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "$@"
          EOF

          chmod +x "${LEGACY_BIN}/sdkmanager"

          echo "Version sdkmanager via wrapper :"

          "${LEGACY_BIN}/sdkmanager" --version


      # ==================================================================
      # ÉTAPE 9 - ACCEPTER LES LICENCES ET INSTALLER LE SDK
      # ==================================================================
      #
      # Le NDK 28c correspond au package :
      #
      #   ndk;28.2.13676358
      #
      # et non :
      #
      #   ndk;28c
      #
      # On n'utilise volontairement PAS :
      #
      #   yes | sdkmanager --licenses
      #
      # car cela peut provoquer un SIGPIPE / Broken pipe.
      # ==================================================================

      - name: "Installer les composants Android"
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          echo "============================================================"
          echo "ACCEPTATION DES LICENCES"
          echo "============================================================"

          printf 'y\n%.0s' {1..100} \
            | "${SDKMANAGER}" --licenses \
            || true

          echo
          echo "============================================================"
          echo "INSTALLATION DES COMPOSANTS"
          echo "============================================================"

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_PACKAGE}"


      # ==================================================================
      # ÉTAPE 10 - CONFIGURER LE PATH ANDROID
      # ==================================================================

      - name: "Configurer le PATH Android"
        shell: bash
        run: |
          set -euo pipefail

          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/tools/bin" >> "${GITHUB_PATH}"


      # ==================================================================
      # ÉTAPE 11 - NETTOYER LES ANCIENS ARTEFACTS
      # ==================================================================
      #
      # On supprime .buildozer afin de ne jamais réutiliser un ancien
      # environnement de compilation contenant un venv pip incohérent.
      #
      # Le SDK Android est conservé.
      # ==================================================================

      - name: "Nettoyer les artefacts Buildozer"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ==================================================================
      # ÉTAPE 12 - CLONER PYTHON-FOR-ANDROID
      # ==================================================================
      #
      # Buildozer utilisera ce checkout via :
      #
      #   p4a.source_dir = .p4a
      #
      # Cela nous permet de modifier le code p4a AVANT la compilation.
      #
      # C'est préférable à une modification de :
      #
      #   .buildozer/android/platform/python-for-android
      #
      # car ce dernier dossier n'existe qu'après que Buildozer ait
      # préparé sa plateforme.
      # ==================================================================

      - name: "Cloner python-for-android"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .p4a

          git clone \
            --depth 1 \
            --branch "${P4A_BRANCH}" \
            https://github.com/kivy/python-for-android.git \
            .p4a

          echo
          echo "============================================================"
          echo "VERSION PYTHON-FOR-ANDROID"
          echo "============================================================"

          git -C .p4a rev-parse HEAD
          git -C .p4a describe --tags --always \
            || true


      # ==================================================================
      # ÉTAPE 13 - CORRIGER LE VENV PIP DE PYTHON-FOR-ANDROID
      # ==================================================================
      #
      # CORRECTION CENTRALE DU BUILD ACTUEL.
      #
      # Python-for-android crée normalement :
      #
      #   python -m venv venv
      #
      # Nous le transformons en :
      #
      #   python -m venv --clear venv
      #
      # afin d'éviter qu'un ancien venv soit réutilisé.
      #
      # Ensuite p4a fait normalement :
      #
      #   pip install -U pip
      #
      # Nous le transformons en :
      #
      #   pip install -U pip==25.2
      #
      # afin de rendre la version de pip déterministe.
      #
      # Cette modification intervient AVANT que Buildozer ne lance p4a.
      # ==================================================================

      - name: "Corriger le venv et pip de python-for-android"
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PY=".p4a/pythonforandroid/build.py"

          if [[ ! -f "${BUILD_PY}" ]]; then
            echo "ERREUR : ${BUILD_PY} introuvable."
            exit 1
          fi

          echo "Recherche de la création du venv..."

          grep -n \
            "host_python, '-m', 'venv'" \
            "${BUILD_PY}" \
            || true

          echo
          echo "Recherche de la mise à jour pip..."

          grep -n \
            "pip install -U pip" \
            "${BUILD_PY}" \
            || true

          # --------------------------------------------------------------
          # Correction 1 :
          #
          # venv
          #   ->
          # venv --clear
          # --------------------------------------------------------------

          python - "${BUILD_PY}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])

          text = path.read_text()

          old = "shprint(host_python, '-m', 'venv', 'venv')"
          new = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

          if new in text:
              print("OK : venv --clear est déjà présent.")

          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)

              print("OK : venv --clear a été appliqué.")

          else:
              raise SystemExit(
                  "ERREUR : la commande de création du venv "
                  "n'a pas été trouvée dans build.py."
              )
          PY

          # --------------------------------------------------------------
          # Correction 2 :
          #
          # pip libre
          #   ->
          # pip==25.2
          # --------------------------------------------------------------

          python - "${BUILD_PY}" "${P4A_PIP_VERSION}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          pip_version = sys.argv[2]

          text = path.read_text()

          old = "pip install -U pip"
          new = f"pip install -U pip=={pip_version}"

          if new in text:
              print(f"OK : pip=={pip_version} est déjà présent.")

          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)

              print(
                  f"OK : pip est maintenant fixé à {pip_version}."
              )

          else:
              raise SystemExit(
                  "ERREUR : la commande 'pip install -U pip' "
                  "n'a pas été trouvée dans build.py."
              )
          PY

          echo
          echo "============================================================"
          echo "VÉRIFICATION DU PATCH"
          echo "============================================================"

          grep -n \
            -E \
            "venv.*--clear|pip install -U pip==${P4A_PIP_VERSION}" \
            "${BUILD_PY}"

          echo
          echo "Patch python-for-android appliqué avec succès."


      # ==================================================================
      # ÉTAPE 14 - CONFIGURER buildozer.spec POUR LE P4A LOCAL
      # ==================================================================
      #
      # Buildozer supporte officiellement :
      #
      #   p4a.source_dir
      #
      # Nous faisons pointer cette option vers :
      #
      #   .p4a
      #
      # Le workflow devient ainsi totalement déterministe concernant
      # la version de python-for-android utilisée.
      #
      # Le script ci-dessous conserve les commentaires et remplace
      # uniquement une éventuelle ancienne ligne p4a.source_dir.
      # ==================================================================

      - name: "Configurer p4a.source_dir dans buildozer.spec"
        shell: bash
        run: |
          set -euo pipefail

          test -f buildozer.spec

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")

          text = path.read_text()

          # --------------------------------------------------------------
          # Supprimer uniquement une éventuelle ligne active ou commentée
          # concernant p4a.source_dir.
          #
          # Les autres commentaires du fichier sont conservés.
          # --------------------------------------------------------------

          text = re.sub(
              r"(?m)^[ \t]*#?[ \t]*p4a\.source_dir[ \t]*=.*\n?",
              "",
              text,
          )

          # --------------------------------------------------------------
          # Ajouter la configuration dans la section [app].
          # --------------------------------------------------------------

          match = re.search(
              r"(?m)^\[app\][ \t]*$",
              text,
          )

          if not match:
              raise SystemExit(
                  "ERREUR : section [app] introuvable dans buildozer.spec."
              )

          insertion = (
              "\n"
              "# ================================================================\n"
              "# PYTHON-FOR-ANDROID PERSONNALISÉ\n"
              "# ================================================================\n"
              "#\n"
              "# Le workflow utilise un checkout local de p4a situé dans .p4a.\n"
              "# Ce checkout est corrigé avant la compilation afin d'éviter\n"
              "# les incohérences de pip dans le venv temporaire de p4a.\n"
              "# ================================================================\n"
              "p4a.source_dir = .p4a\n"
          )

          position = match.end()

          text = (
              text[:position]
              + insertion
              + text[position:]
          )

          path.write_text(text)

          print("OK : p4a.source_dir = .p4a")
          PY

          echo
          echo "Configuration p4a.source_dir :"

          grep -n \
            "p4a.source_dir" \
            buildozer.spec


      # ==================================================================
      # ÉTAPE 15 - VALIDER buildozer.spec
      # ==================================================================
      #
      # Cette étape évite de lancer une compilation de plusieurs dizaines
      # de minutes avec une configuration incorrecte.
      # ==================================================================

      - name: "Valider buildozer.spec"
        shell: bash
        run: |
          set -euo pipefail

          test -f buildozer.spec
          test -d .p4a

          # --------------------------------------------------------------
          # Configuration Android.
          # --------------------------------------------------------------

          grep -Eq \
            '^[[:space:]]*android\.api[[:space:]]*=[[:space:]]*33[[:space:]]*$' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*android\.minapi[[:space:]]*=[[:space:]]*24[[:space:]]*$' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*android\.sdk_build_tools[[:space:]]*=[[:space:]]*34\.0\.0[[:space:]]*$' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*android\.ndk[[:space:]]*=[[:space:]]*28c[[:space:]]*$' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*android\.sdk_path[[:space:]]*=[[:space:]]*\.android-sdk[[:space:]]*$' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*android\.skip_update[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
            buildozer.spec

          grep -Eq \
            '^[[:space:]]*android\.archs[[:space:]]*=[[:space:]]*arm64-v8a,armeabi-v7a[[:space:]]*$' \
            buildozer.spec

          # --------------------------------------------------------------
          # Python Android.
          # --------------------------------------------------------------

          grep -Eq \
            'python3==3\.10\.11' \
            buildozer.spec

          grep -Eq \
            'hostpython3==3\.10\.11' \
            buildozer.spec

          # --------------------------------------------------------------
          # P4A local.
          # --------------------------------------------------------------

          grep -Eq \
            '^[[:space:]]*p4a\.source_dir[[:space:]]*=[[:space:]]*\.p4a[[:space:]]*$' \
            buildozer.spec

          echo
          echo "buildozer.spec : configuration valide."


      # ==================================================================
      # ÉTAPE 16 - VÉRIFIER LES DÉPENDANCES DE L'APPLICATION
      # ==================================================================
      #
      # Pandas et ReportLab ne doivent plus apparaître comme dépendances
      # actives.
      #
      # Les commentaires sont ignorés avant les recherches.
      # ==================================================================

      - name: "Vérifier les dépendances Python"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DÉPENDANCES APPLICATION"
          echo "============================================================"

          # --------------------------------------------------------------
          # requirements.txt
          # --------------------------------------------------------------

          if [[ -f requirements.txt ]]; then

            echo
            echo "requirements.txt :"

            cat requirements.txt

            ACTIVE_REQUIREMENTS="$(
              sed \
                '/^[[:space:]]*#/d' \
                requirements.txt
            )"

            if echo "${ACTIVE_REQUIREMENTS}" | grep -Eiq \
              '(^|[[:space:],=])pandas([[:space:],=]|$)|reportlab'; then

              echo "ERREUR : Pandas ou ReportLab est encore présent."
              exit 1

            fi

          fi

          # --------------------------------------------------------------
          # buildozer.spec
          # --------------------------------------------------------------

          ACTIVE_SPEC="$(
            sed \
              '/^[[:space:]]*#/d' \
              buildozer.spec
          )"

          if echo "${ACTIVE_SPEC}" | grep -Eiq \
            '(^|[[:space:],=])pandas([[:space:],=]|$)|reportlab'; then

            echo "ERREUR : Pandas ou ReportLab est encore référencé."
            exit 1

          fi

          echo
          echo "Dépendances validées."


      # ==================================================================
      # ÉTAPE 17 - VÉRIFIER L'ABSENCE DE REPORTLAB DANS LE CODE
      # ==================================================================
      #
      # Cette vérification ignore les lignes de commentaires.
      # ==================================================================

      - name: "Vérifier la suppression de ReportLab"
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche de références actives à ReportLab..."

          if find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.buildozer/*" \
            -not -path "./.p4a/*" \
            -print0 \
            | xargs -0 grep -nEi \
                '^[[:space:]]*(from|import).*reportlab' \
                2>/dev/null; then

            echo
            echo "ERREUR : une importation active de ReportLab existe."
            exit 1

          fi

          echo "Aucune importation active de ReportLab."


      # ==================================================================
      # ÉTAPE 18 - PRÉCHARGER XZ
      # ==================================================================
      #
      # Le téléchargement SourceForge avait précédemment échoué.
      #
      # Tukaani est utilisé directement avec plusieurs tentatives.
      #
      # L'archive est placée à l'endroit attendu par python-for-android.
      # ==================================================================

      - name: "Précharger xz 5.2.4"
        shell: bash
        run: |
          set -euo pipefail

          XZ_VERSION="5.2.4"

          XZ_DIR=".buildozer/android/platform/build-${ANDROID_ARCHS//,/_}/packages/liblzma"

          XZ_ARCHIVE="${XZ_DIR}/xz-${XZ_VERSION}.tar.gz"

          mkdir -p "${XZ_DIR}"

          echo "Téléchargement de xz ${XZ_VERSION}..."

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 5 \
            "https://tukaani.org/xz/xz-${XZ_VERSION}.tar.gz" \
            --output "${XZ_ARCHIVE}"

          echo
          echo "Vérification MD5..."

          echo \
            "5ace3264bdd00c65eeec2891346f65e6  ${XZ_ARCHIVE}" \
            | md5sum -c -

          echo
          echo "xz ${XZ_VERSION} préchargé."


      # ==================================================================
      # ÉTAPE 19 - VALIDER L'ENVIRONNEMENT COMPLET
      # ==================================================================

      - name: "Valider l'environnement"
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${PATH}"

          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version


          echo
          echo "============================================================"
          echo "PYTHON"
          echo "============================================================"

          python --version
          python -m pip --version


          echo
          echo "============================================================"
          echo "BUILDOZER"
          echo "============================================================"

          buildozer version


          echo
          echo "============================================================"
          echo "CYTHON"
          echo "============================================================"

          cython --version


          echo
          echo "============================================================"
          echo "SDKMANAGER"
          echo "============================================================"

          sdkmanager --version


          echo
          echo "============================================================"
          echo "ADB"
          echo "============================================================"

          adb version


          echo
          echo "============================================================"
          echo "AAPT"
          echo "============================================================"

          command -v aapt


          echo
          echo "============================================================"
          echo "NDK"
          echo "============================================================"

          test -d \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_PACKAGE}"

          echo \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_PACKAGE}"


          echo
          echo "============================================================"
          echo "PYTHON-FOR-ANDROID"
          echo "============================================================"

          test -d .p4a

          git -C .p4a rev-parse HEAD


          echo
          echo "============================================================"
          echo "PATCH PIP P4A"
          echo "============================================================"

          grep -n \
            -E \
            "venv.*--clear|pip install -U pip==${P4A_PIP_VERSION}" \
            .p4a/pythonforandroid/build.py


      # ==================================================================
      # ÉTAPE 20 - AFFICHER LA CONFIGURATION FINALE
      # ==================================================================
      #
      # Cette étape est volontairement conservée pour faciliter le
      # diagnostic directement depuis les logs GitHub Actions.
      # ==================================================================

      - name: "Afficher la configuration finale"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDOZER.SPEC FINAL"
          echo "============================================================"

          cat buildozer.spec

          echo
          echo "============================================================"
          echo "P4A BUILD.PY PATCHÉ"
          echo "============================================================"

          grep -n \
            -E \
            "venv.*--clear|pip install -U pip==${P4A_PIP_VERSION}" \
            .p4a/pythonforandroid/build.py


      # ==================================================================
      # ÉTAPE 21 - COMPILATION APK DEBUG
      # ==================================================================
      #
      # Buildozer utilise maintenant :
      #
      #   p4a.source_dir = .p4a
      #
      # Le code p4a patché sera donc utilisé directement.
      #
      # PIPESTATUS[0] permet de récupérer le vrai code retour de
      # Buildozer malgré l'utilisation de tee.
      # ==================================================================

      - name: "Compiler l'APK Android"
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 \
            | tee buildozer.log

          BUILD_STATUS="${PIPESTATUS[0]}"

          echo
          echo "============================================================"
          echo "CODE RETOUR BUILDOZER : ${BUILD_STATUS}"
          echo "============================================================"

          exit "${BUILD_STATUS}"


      # ==================================================================
      # ÉTAPE 22 - DIAGNOSTIC EN CAS D'ÉCHEC
      # ==================================================================
      #
      # Cette étape s'exécute même lorsque Buildozer échoue.
      #
      # Elle affiche :
      #
      #   - les dernières lignes ;
      #   - les Traceback ;
      #   - les ImportError ;
      #   - les erreurs C/C++ ;
      #   - les erreurs Buildozer.
      # ==================================================================

      - name: "Afficher le diagnostic Buildozer"
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "DIAGNOSTIC BUILDOZER"
          echo "============================================================"

          if [[ -f buildozer.log ]]; then

            echo
            echo "------------------------------------------------------------"
            echo "300 DERNIÈRES LIGNES"
            echo "------------------------------------------------------------"

            tail -n 300 buildozer.log


            echo
            echo "------------------------------------------------------------"
            echo "ERREURS PRINCIPALES"
            echo "------------------------------------------------------------"

            grep -n -E \
              "Traceback|ImportError|ModuleNotFoundError|ERROR:|error:|FAILED|Build failed" \
              buildozer.log \
              | tail -n 150 \
              || true

          else

            echo "buildozer.log introuvable."

          fi


      # ==================================================================
      # ÉTAPE 23 - UPLOAD DU LOG
      # ==================================================================
      #
      # Le log complet est conservé même en cas d'échec.
      # ==================================================================

      - name: "Uploader le log Buildozer"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn


      # ==================================================================
      # ÉTAPE 24 - RECHERCHER L'APK / AAB
      # ==================================================================

      - name: "Rechercher les artefacts Android"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "ARTEFACTS ANDROID"
          echo "============================================================"

          find bin \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # ==================================================================
      # ÉTAPE 25 - PUBLIER L'APK / AAB
      # ==================================================================

      - name: "Uploader les artefacts Android"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
