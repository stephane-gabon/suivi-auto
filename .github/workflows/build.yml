name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-setuptools \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            wget \
            tar \
            curl

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"

          if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r "$SDK/cmdline-tools/cmdline-tools/"* \
              "$SDK/cmdline-tools/latest/"
          fi

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Android NDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "ndk;28.0.13004108"

          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Initialize Buildozer
        run: |
          buildozer android clean || true

          buildozer -v android debug --help >/dev/null || true

          echo "===== python-for-android ====="
          if [ -d ".buildozer/android/platform/python-for-android" ]; then
            cd .buildozer/android/platform/python-for-android
            git rev-parse HEAD || true
            git describe --tags --always || true
            git log -1 --oneline || true
          else
            echo "python-for-android non encore initialisé"
          fi

      - name: Prepare ReportLab recipe
        run: |
          P4A="$HOME/.buildozer/android/platform/python-for-android"
          RECIPE="$P4A/pythonforandroid/recipes/reportlab"

          echo "===== Recherche python-for-android ====="
          if [ ! -d "$P4A" ]; then
            echo "ERREUR: python-for-android introuvable"
            exit 1
          fi

          echo "P4A=$P4A"

          echo "===== Ancienne recette ReportLab ====="
          if [ -f "$RECIPE/__init__.py" ]; then
            sed -n '1,160p' "$RECIPE/__init__.py"
          fi

          mkdir -p "$RECIPE"

          cat > "$RECIPE/__init__.py" <<'PYRECIPE'
          from pythonforandroid.recipe import PythonRecipe


          class ReportLabRecipe(PythonRecipe):
            """
            ReportLab recipe using the GitHub mirror instead of the
            obsolete Mercurial hg.reportlab.com source.
            """

            version = "4.4.3"
            url = "https://github.com/MrBitBucket/reportlab-mirror/archive/refs/tags/{version}.tar.gz"

            depends = ["python3", "freetype"]

            site_packages_name = "reportlab"


            recipe = ReportLabRecipe()
            PYRECIPE

              echo "===== Nouvelle recette ReportLab ====="
                cat "$RECIPE/__init__.py"

      - name: Verify Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== sdkmanager ====="
          sdkmanager --version

          echo "===== Platforms ====="
          ls -la "$SDK/platforms" || true

          echo "===== Build Tools ====="
          ls -la "$SDK/build-tools" || true

          echo "===== AIDL ====="
          if [ -x "$SDK/build-tools/33.0.2/aidl" ]; then
            "$SDK/build-tools/33.0.2/aidl" --version
          else
            echo "AIDL introuvable"
            exit 1
          fi

      - name: Build APK
        env:
          P4A_REPORTLAB_RECIPE: "1"
        run: |
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "===== APK généré ====="
          find bin -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERREUR: aucun APK généré"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-maintenance-apk
          path: bin/*.apk


