name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      ANDROID_NDK_VERSION: "28c"

      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            gettext \
            gettext-base \
            libffi-dev \
            libssl-dev \
            zlib1g-dev


      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          buildozer --version


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          mkdir -p "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"


      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ============================================================
      # COMMAND LINE TOOLS
      # ============================================================

      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TEMP="$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$SDK"
          mkdir -p "$TEMP"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" \
            -O "$TEMP/cmdline-tools.zip"

          unzip -q \
            "$TEMP/cmdline-tools.zip" \
            -d "$TEMP"

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$TEMP/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "===== sdkmanager ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version


      # ============================================================
      # LICENCES
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses \
            || true


      # ============================================================
      # SDK
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"


      # ============================================================
      # NDK 28c
      # ============================================================

      - name: Install Android NDK 28c
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          test -f "$NDK/source.properties"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "===== NDK ====="

          cat "$NDK/source.properties"


      # ============================================================
      # VERIFICATION
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          echo "======================================"
          echo "SDK"
          echo "======================================"

          test -d "$SDK"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/35.0.0"

          echo "SDK OK"

          echo "======================================"
          echo "SDKMANAGER"
          echo "======================================"

          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "sdkmanager OK"

          echo "======================================"
          echo "AIDL"
          echo "======================================"

          test -x "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "AIDL OK"

          echo "======================================"
          echo "NDK"
          echo "======================================"

          test -d "$NDK"
          test -f "$NDK/source.properties"

          grep "Pkg.Revision" \
            "$NDK/source.properties"

          echo "NDK 28c OK"


      # ============================================================
      # IMPORTANT :
      # NE PAS lancer "buildozer android p4a -- --help"
      # ============================================================

      - name: Prepare Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export ANDROIDNDK="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"

          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "ENVIRONNEMENT BUILDOZER"
          echo "======================================"

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo
          echo "sdkmanager:"
          which sdkmanager

          sdkmanager --version

          echo
          echo "NDK:"
          grep "Pkg.Revision" \
            "$ANDROIDNDK/source.properties"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build APK
        shell: bash
        timeout-minutes: 90
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$SDK/ndk/28.2.13676358"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export ANDROIDNDK="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"

          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "BUILD ANDROID"
          echo "======================================"

          java -version

          buildozer --version

          echo
          echo "SDKMANAGER:"
          which sdkmanager
          sdkmanager --version

          echo
          echo "NDK:"
          grep "Pkg.Revision" \
            "$ANDROIDNDK/source.properties"

          echo
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo
          echo "BUILD APK"

          buildozer -v android debug


      # ============================================================
      # APK
      # ============================================================

      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "APK PRODUIT"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"

          echo "APK trouvé : $APK"

          ls -lh "$APK"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error


