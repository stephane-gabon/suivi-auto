# ================================================================
# WORKFLOW GITHUB ACTIONS - SUIVI AUTO
# ================================================================
#
# Ce workflow compile l'application Kivy "Suivi Auto" pour Android
# avec Buildozer / python-for-android.
#
# ENVIRONNEMENT CIBLE
# -------------------
#
#   Système        : Ubuntu 22.04
#   Python runner  : Python 3.10
#   Python Android : Python 3.10.11
#   Host Python    : Python 3.10.11
#   Java            : Temurin 17
#   Buildozer       : 1.6.0
#   Cython          : 0.29.37
#   Android API     : 33
#   Android min API : 24
#   Build Tools     : 34.0.0
#   Android NDK     : 28c
#   NDK package     : 28.2.13676358
#
# ARCHITECTURES
# -------------
#
#   arm64-v8a
#   armeabi-v7a
#
# DÉPENDANCES PYTHON DE L'APPLICATION
# ------------------------------------
#
#   kivy
#   plyer
#   openpyxl
#
# Pandas a été supprimé.
# ReportLab a été supprimé.
#
# IMPORTANT
# ---------
#
# Le Python du runner GitHub et le Python utilisé par
# python-for-android sont deux choses différentes.
#
# Le runner utilise Python 3.10 afin d'exécuter Buildozer.
#
# Dans buildozer.spec, python-for-android reçoit explicitement :
#
#   python3==3.10.11
#   hostpython3==3.10.11
#
# Les deux versions doivent être identiques.
#
# ================================================================


name: "Build Android - Suivi Auto"


# ================================================================
# DÉCLENCHEMENT DU WORKFLOW
# ================================================================
#
# Le workflow est lancé :
#
#   - lors d'un push sur main ;
#   - lors d'une Pull Request vers main ;
#   - manuellement depuis GitHub Actions.
#
# ================================================================

on:

  # Compilation automatique après chaque push sur main.
  push:
    branches:
      - main

  # Vérification automatique des Pull Requests.
  pull_request:
    branches:
      - main

  # Permet de lancer manuellement le workflow depuis GitHub.
  workflow_dispatch:


# ================================================================
# PERMISSIONS
# ================================================================
#
# Le workflow n'a besoin que de lire le dépôt.
#
# ================================================================

permissions:
  contents: read


# ================================================================
# VARIABLES GLOBALES
# ================================================================
#
# Ces variables permettent d'éviter de répéter les chemins
# Android SDK dans toutes les étapes.
#
# ================================================================

env:

  # Répertoire du SDK Android utilisé par Buildozer.
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk

  # Certaines versions d'outils Android utilisent encore
  # ANDROID_SDK_ROOT.
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

  # Version des Android Command Line Tools.
  CMDLINE_TOOLS_VERSION: "11076708"

  # Version de l'Android API utilisée pour compiler.
  ANDROID_API: "33"

  # Version minimale Android supportée par l'application.
  ANDROID_MIN_API: "24"

  # Version des Android Build Tools.
  ANDROID_BUILD_TOOLS: "34.0.0"

  # Version du NDK utilisée par le projet.
  #
  # Buildozer attend ici le nom logique :
  #
  #   28c
  #
  # tandis que sdkmanager installe le package :
  #
  #   ndk;28.2.13676358
  #
  ANDROID_NDK: "28c"

  # Version exacte du package NDK installé avec sdkmanager.
  ANDROID_NDK_PACKAGE: "28.2.13676358"

  # Architectures Android compilées.
  ANDROID_ARCHS: "arm64-v8a,armeabi-v7a"


# ================================================================
# JOB PRINCIPAL
# ================================================================

jobs:

  build-android:

    # Ubuntu 22.04 est utilisé volontairement pour conserver
    # un environnement stable et compatible avec la chaîne
    # Buildozer / python-for-android.
    runs-on: ubuntu-22.04


    # ============================================================
    # ÉTAPES DU JOB
    # ============================================================

    steps:


      # ==========================================================
      # ÉTAPE 01 - RÉCUPÉRER LE CODE SOURCE
      # ==========================================================
      #
      # Cette étape récupère le dépôt GitHub dans le runner.
      #
      # ==========================================================

      - name: "01 - Récupérer le code source"
        uses: actions/checkout@v4


      # ==========================================================
      # ÉTAPE 02 - INSTALLER PYTHON 3.10
      # ==========================================================
      #
      # Ce Python sert principalement à exécuter Buildozer et
      # les outils Python utilisés par le workflow.
      #
      # ATTENTION :
      #
      # Cette version du runner n'impose PAS à elle seule la
      # version Python embarquée dans Android.
      #
      # La version Android sera imposée dans buildozer.spec avec :
      #
      #   python3==3.10.11
      #   hostpython3==3.10.11
      #
      # ==========================================================

      - name: "02 - Installer Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ==========================================================
      # ÉTAPE 03 - INSTALLER JAVA 17
      # ==========================================================
      #
      # Java 17 est utilisé par la chaîne Android/Gradle.
      #
      # Temurin est utilisé comme distribution OpenJDK.
      #
      # Le cache Gradle n'est volontairement pas activé ici afin
      # de privilégier la reproductibilité du build.
      #
      # ==========================================================

      - name: "03 - Installer Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================================
      # ÉTAPE 04 - INSTALLER LES DÉPENDANCES SYSTÈME
      # ==========================================================
      #
      # Ces paquets sont nécessaires à différentes étapes de la
      # compilation de python-for-android et de ses dépendances.
      #
      # autopoint et libtool sont notamment nécessaires à certains
      # composants utilisant Autotools.
      #
      # ==========================================================

      - name: "04 - Installer les dépendances système"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "MISE À JOUR DES DÉPÔTS APT"
          echo "============================================================"

          sudo apt-get update

          echo ""
          echo "============================================================"
          echo "INSTALLATION DES OUTILS SYSTÈME"
          echo "============================================================"

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES OUTILS PRINCIPAUX"
          echo "============================================================"

          git --version
          zip -v | head -n 2
          unzip -v | head -n 2
          wget --version | head -n 1
          curl --version | head -n 1
          autoconf --version | head -n 1
          automake --version | head -n 1
          autopoint --version | head -n 1
          libtool --version
          cmake --version | head -n 1


      # ==========================================================
      # ÉTAPE 05 - VÉRIFIER PYTHON ET INSTALLER BUILDOZER
      # ==========================================================
      #
      # Cette étape vérifie que le runner utilise bien Python 3.10.
      #
      # Puis elle installe :
      #
      #   Buildozer 1.6.0
      #   Cython 0.29.37
      #
      # La version exacte Python Android est définie séparément
      # dans buildozer.spec.
      #
      # ==========================================================

      - name: "05 - Vérifier Python et installer Buildozer"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "PYTHON DU RUNNER"
          echo "============================================================"

          python --version
          python3 --version

          echo ""
          echo "Emplacement de Python :"

          command -v python
          command -v python3

          echo ""
          echo "Version Python détaillée :"

          python - <<'PY'
          import sys

          print("Version :", sys.version)
          print("Exécutable :", sys.executable)

          if sys.version_info[:2] != (3, 10):
              raise SystemExit(
                  "ERREUR : le runner doit utiliser Python 3.10."
              )

          print("OK : le runner utilise Python 3.10.")
          PY

          echo ""
          echo "============================================================"
          echo "INSTALLATION DE BUILDOZER ET CYTHON"
          echo "============================================================"

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"

          echo ""
          echo "============================================================"
          echo "VERSIONS INSTALLÉES"
          echo "============================================================"

          python --version
          python -m pip --version
          buildozer --version
          cython --version


      # ==========================================================
      # ÉTAPE 06 - PRÉPARER LE RÉPERTOIRE ANDROID SDK
      # ==========================================================
      #
      # Le SDK est installé dans le dépôt de travail :
      #
      #   .android-sdk
      #
      # Cela permet à Buildozer d'utiliser explicitement ce SDK
      # plutôt qu'un SDK éventuellement présent dans le runner.
      #
      # ==========================================================

      - name: "06 - Préparer le répertoire Android SDK"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo ""
          echo "============================================================"
          echo "PRÉPARATION DU SDK ANDROID"
          echo "============================================================"

          mkdir -p "${SDK_ROOT}"

          echo "SDK Android : ${SDK_ROOT}"


      # ==========================================================
      # ÉTAPE 07 - TÉLÉCHARGER LES ANDROID COMMAND LINE TOOLS
      # ==========================================================
      #
      # Une version précise des Command Line Tools est utilisée
      # afin d'éviter qu'une modification future de Google ne rende
      # le workflow non reproductible.
      #
      # ==========================================================

      - name: "07 - Installer les Android Command Line Tools"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"
          TOOLS_DIR="${SDK_ROOT}/cmdline-tools"

          echo ""
          echo "============================================================"
          echo "INSTALLATION DES ANDROID COMMAND LINE TOOLS"
          echo "============================================================"

          rm -rf "${TOOLS_DIR}"
          mkdir -p "${TOOLS_DIR}"

          cd "${TOOLS_DIR}"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p latest

          mv cmdline-tools/* latest/

          rm -rf cmdline-tools
          rm -f commandlinetools.zip

          echo ""
          echo "Command Line Tools installés :"

          ls -la "${TOOLS_DIR}/latest/bin"


      # ==========================================================
      # ÉTAPE 08 - CONFIGURER LE PATH ANDROID
      # ==========================================================
      #
      # Les outils modernes sont situés dans :
      #
      #   cmdline-tools/latest/bin
      #
      # Le wrapper sdkmanager utilisé plus loin est situé dans :
      #
      #   tools/bin
      #
      # Le platform-tools est également ajouté au PATH.
      #
      # ==========================================================

      - name: "08 - Configurer le PATH Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo ""
          echo "============================================================"
          echo "CONFIGURATION DU PATH ANDROID"
          echo "============================================================"

          mkdir -p "${SDK_ROOT}/tools/bin"

          {
            echo "${SDK_ROOT}/platform-tools"
            echo "${SDK_ROOT}/cmdline-tools/latest/bin"
            echo "${SDK_ROOT}/tools/bin"
          } >> "${GITHUB_PATH}"

          echo ""
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

          echo ""
          echo "PATH Android configuré."


      # ==========================================================
      # ÉTAPE 09 - CRÉER LE WRAPPER SDKMANAGER
      # ==========================================================
      #
      # Certaines parties de Buildozer/python-for-android peuvent
      # encore rechercher le chemin historique :
      #
      #   .android-sdk/tools/bin/sdkmanager
      #
      # Les versions modernes du SDK utilisent cependant :
      #
      #   .android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # Le wrapper fait le pont entre les deux chemins.
      #
      # IMPORTANT :
      #
      # Depuis tools/bin/sdkmanager :
      #
      #   ../.. = .android-sdk
      #
      # et non ../../..
      #
      # ==========================================================

      - name: "09 - Créer le wrapper sdkmanager"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"
          SCRIPT_DIR="${SDK_ROOT}/tools/bin"

          echo ""
          echo "============================================================"
          echo "CRÉATION DU WRAPPER SDKMANAGER"
          echo "============================================================"

          mkdir -p "${SCRIPT_DIR}"

          cat > "${SCRIPT_DIR}/sdkmanager" <<'EOF'
          #!/usr/bin/env bash

          set -e

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          # Depuis :
          #
          #   .android-sdk/tools/bin
          #
          # deux niveaux vers le haut donnent :
          #
          #   .android-sdk
          #
          SDK_ROOT="$(cd "${SCRIPT_DIR}/../.." && pwd)"

          exec "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "$@"
          EOF

          chmod +x "${SCRIPT_DIR}/sdkmanager"

          echo ""
          echo "Wrapper créé :"
          ls -l "${SCRIPT_DIR}/sdkmanager"

          echo ""
          echo "Test du wrapper :"
          "${SCRIPT_DIR}/sdkmanager" --version


      # ==========================================================
      # ÉTAPE 10 - ACCEPTER LES LICENCES ANDROID
      # ==========================================================
      #
      # Un nombre FINI de réponses "y" est envoyé.
      #
      # On évite volontairement :
      #
      #   yes | sdkmanager --licenses
      #
      # car cette construction peut provoquer un SIGPIPE / Broken
      # pipe lorsque sdkmanager termine avant "yes".
      #
      # ==========================================================

      - name: "10 - Accepter les licences Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo ""
          echo "============================================================"
          echo "ACCEPTATION DES LICENCES ANDROID"
          echo "============================================================"

          printf 'y\n%.0s' {1..100} \
            | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
                --sdk_root="${SDK_ROOT}" \
                --licenses

          echo ""
          echo "Licences Android traitées."


      # ==========================================================
      # ÉTAPE 11 - INSTALLER LES COMPOSANTS ANDROID
      # ==========================================================
      #
      # Installation des composants strictement nécessaires :
      #
      #   platform-tools
      #   Android API 33
      #   Build Tools 34.0.0
      #   NDK 28.2.13676358
      #
      # IMPORTANT :
      #
      # Le package SDK du NDK est :
      #
      #   ndk;28.2.13676358
      #
      # tandis que Buildozer utilise :
      #
      #   android.ndk = 28c
      #
      # ==========================================================

      - name: "11 - Installer les composants Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo ""
          echo "============================================================"
          echo "INSTALLATION DES COMPOSANTS ANDROID"
          echo "============================================================"

          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_PACKAGE}"

          echo ""
          echo "============================================================"
          echo "COMPOSANTS ANDROID INSTALLÉS"
          echo "============================================================"

          echo ""
          echo "Platform Tools :"
          ls -ld "${SDK_ROOT}/platform-tools"

          echo ""
          echo "Android Platform :"
          ls -ld "${SDK_ROOT}/platforms/android-${ANDROID_API}"

          echo ""
          echo "Build Tools :"
          ls -ld "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

          echo ""
          echo "NDK :"
          ls -ld "${SDK_ROOT}/ndk/${ANDROID_NDK_PACKAGE}"


      # ==========================================================
      # ÉTAPE 12 - VALIDER BUILDOZER.SPEC
      # ==========================================================
      #
      # Cette étape vérifie que les paramètres Android essentiels
      # sont bien présents dans la section [app].
      #
      # Elle vérifie également le point critique concernant Python :
      #
      #   python3==3.10.11
      #   hostpython3==3.10.11
      #
      # Cela permet de détecter immédiatement une régression avant
      # de lancer une compilation longue.
      #
      # ==========================================================

      - name: "12 - Valider buildozer.spec"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "VALIDATION DE BUILDOZER.SPEC"
          echo "============================================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERREUR : buildozer.spec est absent."
            exit 1
          fi

          echo ""
          echo "Fichier buildozer.spec :"
          sed -n '1,260p' buildozer.spec

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES PARAMÈTRES ANDROID"
          echo "============================================================"

          grep -Eq '^[[:space:]]*android\.api[[:space:]]*=[[:space:]]*33[[:space:]]*$' \
            buildozer.spec

          grep -Eq '^[[:space:]]*android\.minapi[[:space:]]*=[[:space:]]*24[[:space:]]*$' \
            buildozer.spec

          grep -Eq '^[[:space:]]*android\.sdk_build_tools[[:space:]]*=[[:space:]]*34\.0\.0[[:space:]]*$' \
            buildozer.spec

          grep -Eq '^[[:space:]]*android\.ndk[[:space:]]*=[[:space:]]*28c[[:space:]]*$' \
            buildozer.spec

          grep -Eq '^[[:space:]]*android\.sdk_path[[:space:]]*=[[:space:]]*\.android-sdk[[:space:]]*$' \
            buildozer.spec

          grep -Eq '^[[:space:]]*android\.archs[[:space:]]*=[[:space:]]*arm64-v8a,armeabi-v7a[[:space:]]*$' \
            buildozer.spec

          grep -Eq '^[[:space:]]*android\.skip_update[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
            buildozer.spec

          echo ""
          echo "Paramètres Android : OK"

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES VERSIONS PYTHON"
          echo "============================================================"

          if ! grep -Eq \
            '^[[:space:]]*requirements[[:space:]]*=.*python3==3\.10\.11.*hostpython3==3\.10\.11' \
            buildozer.spec; then

            echo ""
            echo "ERREUR : buildozer.spec doit contenir :"
            echo ""
            echo "python3==3.10.11"
            echo "hostpython3==3.10.11"
            echo ""
            echo "Les deux versions doivent être identiques."
            exit 1
          fi

          echo ""
          echo "Python 3.10.11 pour python3 : OK"
          echo "Python 3.10.11 pour hostpython3 : OK"

          echo ""
          echo "Validation buildozer.spec : OK"


      # ==========================================================
      # ÉTAPE 13 - VÉRIFIER LA SUPPRESSION DE REPORTLAB
      # ==========================================================
      #
      # ReportLab n'est plus utilisé par l'application.
      #
      # Cette vérification ignore les commentaires afin d'éviter
      # qu'une mention documentaire de "reportlab" ne provoque
      # inutilement une erreur.
      #
      # ==========================================================

      - name: "13 - Vérifier la suppression de ReportLab"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DE REPORTLAB"
          echo "============================================================"

          echo ""
          echo "Recherche des références actives..."

          FOUND=0

          while IFS= read -r -d '' file; do

            if grep -vE '^[[:space:]]*#' "${file}" \
              | grep -iE 'reportlab|report_lab'; then

              echo ""
              echo "ERREUR : référence active à ReportLab trouvée dans :"
              echo "${file}"

              FOUND=1
            fi

          done < <(
            find . \
              -type f \
              \( \
                -name "*.py" \
                -o -name "requirements.txt" \
                -o -name "buildozer.spec" \
                -o -path "./p4a.local_recipes/*" \
              \) \
              -print0
          )

          if [ "${FOUND}" -ne 0 ]; then
            echo ""
            echo "ReportLab doit être complètement supprimé."
            exit 1
          fi

          echo ""
          echo "Aucune référence active à ReportLab trouvée."
          echo "Vérification ReportLab : OK."


      # ==========================================================
      # ÉTAPE 14 - VÉRIFIER LES DÉPENDANCES PYTHON
      # ==========================================================
      #
      # Les dépendances Python utilisées par l'application sont :
      #
      #   - kivy
      #   - plyer
      #   - openpyxl
      #
      # Python 3.10.11 est défini dans buildozer.spec pour :
      #
      #   - python3
      #   - hostpython3
      #
      # Pandas a été supprimé.
      #
      # OpenPyXL suffit pour générer directement les fichiers Excel.
      #
      # ReportLab a également été supprimé.
      #
      # ==========================================================

      - name: "14 - Vérifier les dépendances Python"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "REQUIREMENTS.TXT"
          echo "============================================================"

          if [ -f requirements.txt ]; then
            cat requirements.txt
          else
            echo "requirements.txt absent."
            echo "Les dépendances seront lues depuis buildozer.spec."
          fi

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DES DÉPENDANCES INTERDITES"
          echo "============================================================"

          if [ -f requirements.txt ]; then

            if grep -vE '^[[:space:]]*#|^[[:space:]]*$' requirements.txt \
              | grep -iE '^pandas([<>=!~]|$)'; then

              echo ""
              echo "ERREUR : Pandas est encore présent dans requirements.txt."
              echo "Pandas doit être supprimé du projet."

              exit 1
            fi

          fi

          if [ -f requirements.txt ]; then

            if grep -vE '^[[:space:]]*#|^[[:space:]]*$' requirements.txt \
              | grep -iE '^reportlab([<>=!~]|$)'; then

              echo ""
              echo "ERREUR : ReportLab est encore présent dans requirements.txt."

              exit 1
            fi

          fi

          echo ""
          echo "============================================================"
          echo "DÉPENDANCES ATTENDUES"
          echo "============================================================"

          echo "Kivy      : requis"
          echo "Plyer     : requis"
          echo "OpenPyXL  : requis"
          echo "Pandas    : supprimé"
          echo "ReportLab : supprimé"

          echo ""
          echo "Dépendances Python : configuration cohérente."


      # ==========================================================
      # ÉTAPE 15 - NETTOYER L'ANCIEN ENVIRONNEMENT BUILDOZER
      # ==========================================================
      #
      # Le dossier .buildozer peut contenir :
      #
      #   - d'anciennes recettes ;
      #   - une ancienne version Python ;
      #   - un ancien état python-for-android ;
      #   - des fichiers partiellement compilés.
      #
      # On supprime donc :
      #
      #   .buildozer
      #   bin
      #
      # MAIS on conserve :
      #
      #   .android-sdk
      #
      # car il vient d'être préparé explicitement par le workflow.
      #
      # ==========================================================

      - name: "15 - Nettoyer l'ancien environnement Buildozer"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "NETTOYAGE BUILDOZER"
          echo "============================================================"

          rm -rf .buildozer
          rm -rf bin

          echo ""
          echo "Anciens fichiers Buildozer supprimés."

          echo ""
          echo "Vérification du SDK Android :"

          if [ ! -d ".android-sdk" ]; then
            echo "ERREUR : .android-sdk ne doit pas être supprimé."
            exit 1
          fi

          echo ".android-sdk conservé."


      # ==========================================================
      # ÉTAPE 16 - PRÉCHARGER L'ARCHIVE XZ 5.2.4
      # ==========================================================
      #
      # Certaines compilations de python-for-android peuvent avoir
      # besoin de l'archive xz 5.2.4.
      #
      # Cette archive est téléchargée AVANT le lancement de
      # Buildozer afin d'éviter qu'une connexion réseau instable
      # interrompe la compilation au milieu du processus.
      #
      # IMPORTANT
      # ---------
      #
      # Nous n'utilisons plus SourceForge ici.
      #
      # L'ancienne URL SourceForge pouvait retourner une erreur HTTP
      # et "wget" terminait alors avec le code retour 8.
      #
      # L'archive est maintenant récupérée depuis l'infrastructure
      # officielle Tukaani.
      #
      # Le fichier est ensuite vérifié avec son empreinte MD5.
      #
      # MD5 attendu :
      #
      #   5ace3264bdd00c65eeec2891346f65e6
      #
      # Le fichier est placé exactement dans le répertoire attendu
      # par python-for-android :
      #
      #   .buildozer/android/platform/
      #   build-arm64-v8a_armeabi-v7a/packages/liblzma/
      #
      # ==========================================================

      - name: "16 - Précharger l'archive xz 5.2.4"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "PRÉCHARGEMENT DE XZ 5.2.4"
          echo "============================================================"

          XZ_DIR="${GITHUB_WORKSPACE}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/liblzma"
          XZ_FILE="${XZ_DIR}/xz-5.2.4.tar.gz"

          # Création du répertoire utilisé par python-for-android.
          mkdir -p "${XZ_DIR}"

          echo ""
          echo "Répertoire cible :"
          echo "${XZ_DIR}"

          echo ""
          echo "Fichier cible :"
          echo "${XZ_FILE}"

          echo ""
          echo "============================================================"
          echo "TÉLÉCHARGEMENT DE XZ 5.2.4"
          echo "============================================================"

          # URL officielle Tukaani.
          XZ_URL="https://tukaani.org/xz/xz-5.2.4.tar.gz"

          echo ""
          echo "URL :"
          echo "${XZ_URL}"

          # Suppression d'une éventuelle archive incomplète.
          rm -f "${XZ_FILE}"

          # Téléchargement avec suivi des redirections.
          #
          # -f : échoue sur les erreurs HTTP
          # -L : suit les redirections
          # --retry : effectue plusieurs tentatives
          # --retry-all-errors : réessaie également certaines erreurs
          # --connect-timeout : limite le temps d'établissement
          # --max-time : limite la durée totale d'une tentative
          #
          curl \
            --fail \
            --location \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "${XZ_URL}" \
            --output "${XZ_FILE}"

          echo ""
          echo "Téléchargement terminé."

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION DE L'ARCHIVE"
          echo "============================================================"

          # Vérification que le fichier existe réellement.
          if [ ! -f "${XZ_FILE}" ]; then
            echo ""
            echo "ERREUR : l'archive xz n'a pas été téléchargée."
            exit 1
          fi

          # Vérification que le fichier n'est pas vide.
          if [ ! -s "${XZ_FILE}" ]; then
            echo ""
            echo "ERREUR : l'archive xz téléchargée est vide."
            exit 1
          fi

          echo ""
          echo "Taille de l'archive :"
          ls -lh "${XZ_FILE}"

          echo ""
          echo "Empreinte MD5 :"

          md5sum "${XZ_FILE}"

          echo ""
          echo "Vérification MD5 attendue :"

          echo "5ace3264bdd00c65eeec2891346f65e6  ${XZ_FILE}" \
            | md5sum -c -

          echo ""
          echo "============================================================"
          echo "XZ 5.2.4 : ARCHIVE VALIDÉE"
          echo "============================================================"

          echo ""
          echo "L'archive est prête pour python-for-android."


      # ==========================================================
      # ÉTAPE 17 - VÉRIFICATION FINALE DE L'ENVIRONNEMENT
      # ==========================================================
      #
      # Cette étape vérifie :
      #
      #   1. Python du runner ;
      #   2. Java ;
      #   3. Buildozer ;
      #   4. SDK Android ;
      #   5. sdkmanager moderne ;
      #   6. wrapper sdkmanager ;
      #   7. AIDL ;
      #   8. NDK ;
      #   9. archive liblzma.
      #
      # La version Python Android est vérifiée séparément dans
      # buildozer.spec.
      #
      # ==========================================================

      - name: "17 - Vérification finale de l'environnement Android"
        shell: bash
        run: |
          set -e

          SDK_ROOT="${GITHUB_WORKSPACE}/.android-sdk"

          echo ""
          echo "============================================================"
          echo "ENVIRONNEMENT FINAL"
          echo "============================================================"

          echo ""
          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version

          echo ""
          echo "============================================================"
          echo "PYTHON DU RUNNER"
          echo "============================================================"

          python --version
          command -v python

          python - <<'PY'
          import sys

          print("Version complète :", sys.version)
          print("Exécutable       :", sys.executable)

          if sys.version_info[:2] != (3, 10):
              raise SystemExit(
                  "ERREUR : Python du runner différent de 3.10."
              )

          print("Python runner : OK")
          PY

          echo ""
          echo "============================================================"
          echo "BUILDOZER"
          echo "============================================================"

          buildozer --version

          echo ""
          echo "============================================================"
          echo "SDK ANDROID"
          echo "============================================================"

          echo "SDK :"
          echo "${SDK_ROOT}"

          echo ""
          echo "sdkmanager moderne :"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version

          echo ""
          echo "sdkmanager wrapper :"
          "${SDK_ROOT}/tools/bin/sdkmanager" --version

          echo ""
          echo "AIDL :"
          "${SDK_ROOT}/build-tools/34.0.0/aidl" --version || true

          echo ""
          echo "NDK installé dans le SDK :"
          ls -ld "${SDK_ROOT}/ndk/28.2.13676358"

          echo ""
          echo "Archive liblzma préchargée :"

          ls -lh \
            "${GITHUB_WORKSPACE}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/liblzma/xz-5.2.4.tar.gz"

          echo ""
          echo "============================================================"
          echo "ENVIRONNEMENT : OK"
          echo "============================================================"


      # ==========================================================
      # ÉTAPE 18 - DIAGNOSTIC FINAL AVANT COMPILATION
      # ==========================================================
      #
      # Cette étape vérifie l'environnement qui sera utilisé par
      # Buildozer avant de lancer la compilation.
      #
      # IMPORTANT :
      #
      # Le virtualenv interne de python-for-android n'existe pas
      # nécessairement encore à ce stade.
      #
      # On ne tente donc pas de modifier directement :
      #
      #   .buildozer/android/platform/build-*/build/venv
      #
      # On vérifie uniquement les outils disponibles sur le runner
      # et la configuration du projet.
      #
      # ==========================================================

      - name: "18 - Diagnostic final avant compilation"
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "DIAGNOSTIC FINAL"
          echo "============================================================"

          echo ""
          echo "============================================================"
          echo "PYTHON DU RUNNER"
          echo "============================================================"

          python --version
          python -m pip --version

          echo ""
          echo "============================================================"
          echo "BUILDOZER"
          echo "============================================================"

          buildozer --version

          echo ""
          echo "============================================================"
          echo "CYTHON"
          echo "============================================================"

          cython --version

          echo ""
          echo "============================================================"
          echo "CONFIGURATION PYTHON ANDROID"
          echo "============================================================"

          grep -nE \
            '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec \
            || true

          echo ""
          echo "============================================================"
          echo "CONFIGURATION ANDROID"
          echo "============================================================"

          grep -nE \
            '^[[:space:]]*android\.' \
            buildozer.spec \
            || true

          echo ""
          echo "============================================================"
          echo "REQUIREMENTS.TXT"
          echo "============================================================"

          if [ -f requirements.txt ]; then
            cat requirements.txt
          else
            echo "requirements.txt absent."
          fi

          echo ""
          echo "============================================================"
          echo "ENVIRONNEMENT PRÊT POUR BUILDOZER"
          echo "============================================================"


      # ==========================================================
      # ÉTAPE 19 - COMPILER L'APK ANDROID
      # ==========================================================
      #
      # La sortie complète de Buildozer est enregistrée dans :
      #
      #   buildozer.log
      #
      # PIPESTATUS[0] permet de récupérer le véritable code retour
      # de Buildozer malgré l'utilisation de "tee".
      #
      # ==========================================================

      - name: "19 - Compiler l'application Android"
        shell: bash
        run: |
          set -o pipefail

          echo ""
          echo "============================================================"
          echo "DÉMARRAGE DE LA COMPILATION ANDROID"
          echo "============================================================"

          echo ""
          echo "Heure de début :"
          date

          echo ""
          echo "Python runner :"
          python --version

          echo ""
          echo "Buildozer :"
          buildozer --version

          echo ""
          echo "Compilation en cours..."

          buildozer -v android debug 2>&1 | tee buildozer.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "============================================================"
          echo "FIN DE BUILDOZER"
          echo "============================================================"

          echo "Code retour Buildozer : ${BUILD_STATUS}"

          if [ "${BUILD_STATUS}" -ne 0 ]; then
            echo ""
            echo "ERREUR : la compilation Buildozer a échoué."
            exit "${BUILD_STATUS}"
          fi

          echo ""
          echo "Compilation Buildozer terminée avec succès."


      # ==========================================================
      # ÉTAPE 20 - AFFICHER LA FIN DU LOG EN CAS D'ERREUR
      # ==========================================================
      #
      # Cette étape s'exécute même si Buildozer a échoué.
      #
      # Elle affiche les dernières lignes du log ainsi que les
      # messages d'erreur importants.
      #
      # ==========================================================

      - name: "20 - Analyser le log Buildozer"
        if: always()
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "ANALYSE DU LOG BUILDOZER"
          echo "============================================================"

          if [ ! -f buildozer.log ]; then
            echo "buildozer.log absent."
            exit 0
          fi

          echo ""
          echo "============================================================"
          echo "300 DERNIÈRES LIGNES"
          echo "============================================================"

          tail -n 300 buildozer.log

          echo ""
          echo "============================================================"
          echo "RECHERCHE DES ERREURS"
          echo "============================================================"

          grep -nEi \
            'error:|error |failed|fatal|traceback|exception|build failed' \
            buildozer.log \
            | tail -n 100 \
            || true


      # ==========================================================
      # ÉTAPE 21 - ARCHIVER LE LOG BUILDOZER
      # ==========================================================
      #
      # Le log est conservé dans GitHub Actions même lorsque le
      # build échoue.
      #
      # Cela permet d'analyser précisément la prochaine erreur
      # sans devoir relancer immédiatement la compilation.
      #
      # ==========================================================

      - name: "21 - Archiver le log Buildozer"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "buildozer-log"
          path: buildozer.log
          if-no-files-found: warn


      # ==========================================================
      # ÉTAPE 22 - RECHERCHER L'APK / AAB PRODUIT
      # ==========================================================
      #
      # Buildozer place normalement les fichiers finaux dans :
      #
      #   bin/
      #
      # Cette étape permet de confirmer leur présence.
      #
      # ==========================================================

      - name: "22 - Rechercher les fichiers Android générés"
        if: success()
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "FICHIERS ANDROID GÉNÉRÉS"
          echo "============================================================"

          echo ""
          echo "Répertoire bin :"

          if [ -d bin ]; then
            find bin \
              -maxdepth 2 \
              -type f \
              \( \
                -name "*.apk" \
                -o -name "*.aab" \
              \) \
              -print
          else
            echo "ERREUR : le répertoire bin est absent."
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "VÉRIFICATION APK"
          echo "============================================================"

          APK_COUNT=$(find bin -maxdepth 2 -type f -name "*.apk" | wc -l)

          echo "Nombre d'APK : ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo ""
            echo "ERREUR : aucun APK n'a été généré."
            exit 1
          fi

          echo ""
          echo "APK trouvé."


      # ==========================================================
      # ÉTAPE 23 - PUBLIER LES FICHIERS APK / AAB
      # ==========================================================
      #
      # Les fichiers Android sont publiés comme artefacts GitHub.
      #
      # Le nom de l'artefact permet de distinguer clairement le
      # résultat du build Android.
      #
      # ==========================================================

      - name: "23 - Publier les fichiers APK et AAB"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "suivi-auto-android"
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: warn
