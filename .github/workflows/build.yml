name: Suivi Auto - Build APK Android

# ============================================================
# DÉCLENCHEMENT DU WORKFLOW
# ============================================================
#
# Le workflow se lance :
#   - à chaque push sur la branche main ;
#   - manuellement depuis GitHub Actions.
#
# Le déclenchement manuel est très pratique pour tester une
# modification du workflow sans devoir faire un nouveau commit.
# ============================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# JOB PRINCIPAL
# ============================================================

jobs:

  build-apk:

    # Ubuntu 22.04 est utilisé volontairement pour avoir un
    # environnement stable et compatible avec Buildozer /
    # python-for-android.
    runs-on: ubuntu-22.04


    steps:

      # ========================================================
      # 1. RÉCUPÉRATION DU PROJET
      # ========================================================

      - name: "1 - Checkout du dépôt"
        uses: actions/checkout@v4


      # ========================================================
      # 2. PYTHON
      # ========================================================
      #
      # Buildozer sera exécuté avec Python 3.10.
      # Cela évite d'utiliser une version Python différente de
      # celle prévue pour notre environnement.
      # ========================================================

      - name: "2 - Installer Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # ========================================================
      # 3. JAVA
      # ========================================================
      #
      # Java 17 est utilisé pour les outils Android modernes.
      # ========================================================

      - name: "3 - Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"


      # ========================================================
      # 4. DÉPENDANCES SYSTÈME
      # ========================================================
      #
      # Ces paquets sont nécessaires à Buildozer / p4a et aux
      # compilations natives Android.
      # ========================================================

      - name: "4 - Installer les dépendances système"
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            rsync \
            file \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      # ========================================================
      # 5. VÉRIFICATION JAVA / PYTHON
      # ========================================================

      - name: "5 - Vérifier Java et Python"
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo
          echo "========================================"
          echo "PYTHON"
          echo "========================================"
          python --version

          echo
          echo "========================================"
          echo "JAVA_HOME"
          echo "========================================"
          echo "$JAVA_HOME"


      # ========================================================
      # 6. INSTALLATION DE BUILDOZER
      # ========================================================
      #
      # On installe les versions explicitement afin d'éviter
      # qu'une mise à jour automatique d'un paquet ne modifie
      # le comportement du build.
      # ========================================================

      - name: "6 - Installer Buildozer et Cython"
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"


      # ========================================================
      # 7. CONFIGURATION DU SDK ANDROID
      # ========================================================
      #
      # IMPORTANT :
      #
      # On installe ici le SDK dans le répertoire utilisé par
      # Buildozer :
      #
      #   ~/.buildozer/android/platform/android-sdk
      #
      # Cela évite d'avoir deux SDK différents.
      # ========================================================

      - name: "7 - Installer et configurer Android SDK"
        shell: bash
        run: |
          set -euxo pipefail

          # ----------------------------------------------------
          # Répertoires Android
          # ----------------------------------------------------

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME"

          # ----------------------------------------------------
          # Version officielle des command-line tools.
          # ----------------------------------------------------

          CMDLINE_TOOLS_VERSION="11076708"

          CMDLINE_TOOLS_ZIP="/tmp/android-cmdline-tools.zip"

          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"

          # ----------------------------------------------------
          # Installation des command-line tools.
          # ----------------------------------------------------

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then

            echo "Téléchargement des Android Command Line Tools..."

            rm -rf /tmp/android-cmdline-tools
            mkdir -p /tmp/android-cmdline-tools

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=30 \
              -O "$CMDLINE_TOOLS_ZIP" \
              "$CMDLINE_TOOLS_URL"

            unzip -q "$CMDLINE_TOOLS_ZIP" \
              -d /tmp/android-cmdline-tools

            rm -rf "$ANDROID_HOME/cmdline-tools/latest"

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            cp -a \
              /tmp/android-cmdline-tools/cmdline-tools/. \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          # ----------------------------------------------------
          # Ajouter les outils Android au PATH.
          # ----------------------------------------------------

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          # Variables persistantes pour les étapes suivantes.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # ----------------------------------------------------
          # Vérification sdkmanager.
          # ----------------------------------------------------

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --version


      # ========================================================
      # 8. ACCEPTATION DES LICENCES ANDROID
      # ========================================================
      #
      # Cette étape est volontairement séparée de l'installation.
      #
      # Elle accepte automatiquement toutes les licences Android
      # demandées par sdkmanager.
      #
      # Le "yes" évite que GitHub Actions reste bloqué en attente
      # d'une réponse interactive.
      # ========================================================

      - name: "8 - Accepter automatiquement les licences Android"
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "ACCEPTATION DES LICENCES ANDROID"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses || true

          echo
          echo "Vérification des licences..."

          mkdir -p "$ANDROID_HOME/licenses"

          # On réexécute sdkmanager --licenses.
          # Si aucune licence n'est en attente, la commande
          # termine normalement.
          "$SDKMANAGER" --licenses < /dev/null || true


      # ========================================================
      # 9. INSTALLATION DES COMPOSANTS ANDROID
      # ========================================================
      #
      # Nous avons besoin de :
      #
      #   platform-tools
      #   Android API 33
      #   Build Tools 34.0.0
      #
      # Le NDK est traité séparément car son identifiant exact
      # doit être découvert auprès de sdkmanager.
      # ========================================================

      - name: "9 - Installer Android API 33 et Build Tools"
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

          echo
          echo "Composants Android installés :"

          "$SDKMANAGER" --list_installed || true


      # ========================================================
      # 10. TROUVER ET INSTALLER LE NDK 28
      # ========================================================
      #
      # ATTENTION :
      #
      # "28c" n'est PAS un identifiant sdkmanager valide.
      #
      # sdkmanager utilise un identifiant du genre :
      #
      #   ndk;28.2.xxxxxxx
      #
      # On demande donc à sdkmanager quelle version 28.x est
      # réellement disponible, puis on l'installe.
      # ========================================================

      - name: "10 - Installer le NDK 28"
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "RECHERCHE DU NDK 28"
          echo "========================================"

          # Récupérer les identifiants NDK 28 disponibles.
          mapfile -t NDK_PACKAGES < <(
            "$SDKMANAGER" --list 2>/dev/null |
            grep -oE 'ndk;28\.[0-9]+\.[0-9]+' |
            sort -Vu
          )

          if [ "${#NDK_PACKAGES[@]}" -eq 0 ]; then
            echo
            echo "ERREUR : aucun NDK 28 disponible."
            echo
            echo "NDK disponibles :"
            "$SDKMANAGER" --list 2>/dev/null |
              grep -E 'ndk;28' || true
            exit 1
          fi

          # On prend la dernière version 28.x disponible.
          NDK_PACKAGE="${NDK_PACKAGES[${#NDK_PACKAGES[@]}-1]}"

          echo "NDK choisi : $NDK_PACKAGE"

          # Installation.
          "$SDKMANAGER" "$NDK_PACKAGE"

          # Extraire la version.
          NDK_VERSION="${NDK_PACKAGE#ndk;}"

          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "ERREUR : le NDK n'a pas été installé dans :"
            echo "$NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo
          echo "NDK installé :"
          echo "$NDK_PATH"

          echo
          echo "Contenu :"
          ls -la "$NDK_PATH"


      # ========================================================
      # 11. VÉRIFICATION COMPLÈTE DE L'ENVIRONNEMENT ANDROID
      # ========================================================

      - name: "11 - Vérifier l'environnement Android"
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "VARIABLES"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo
          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          sdkmanager --version

          echo
          echo "========================================"
          echo "ADB"
          echo "========================================"

          adb version

          echo
          echo "========================================"
          echo "AAPT"
          echo "========================================"

          which aapt

          file "$(which aapt)"

          echo
          echo "========================================"
          echo "PLATFORM ANDROID 33"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"

          echo "API 33 OK"

          echo
          echo "========================================"
          echo "BUILD TOOLS 34.0.0"
          echo "========================================"

          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "Build Tools 34.0.0 OK"

          echo
          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -d "$ANDROID_NDK_HOME"

          test -f "$ANDROID_NDK_HOME/source.properties"

          cat "$ANDROID_NDK_HOME/source.properties"

          echo
          echo "NDK OK"


      # ========================================================
      # 12. VÉRIFICATION DU PROJET
      # ========================================================
      #
      # Cette étape permet de détecter immédiatement une
      # référence résiduelle à ReportLab.
      #
      # Le workflow doit maintenant être totalement indépendant
      # de ReportLab.
      # ========================================================

      - name: "12 - Vérifier que ReportLab est supprimé"
        shell: bash
        run: |
          set -euxo pipefail

          echo "Recherche de références à ReportLab..."

          if grep -RniE \
            "reportlab|generer_rapport_pdf" \
            . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer; then

            echo
            echo "ERREUR : une référence à ReportLab existe encore."
            echo "Supprime ces références avant de construire l'APK."
            exit 1

          fi

          echo "Aucune référence à ReportLab détectée."


      # ========================================================
      # 13. VÉRIFIER LE BUILDOZER.SPEC
      # ========================================================
      #
      # On refuse explicitement :
      #
      #   reportlab
      #   p4a.local_recipes
      #
      # afin d'éviter de réintroduire accidentellement l'ancien
      # système de recette ReportLab.
      # ========================================================

      - name: "13 - Vérifier buildozer.spec"
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOZER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo
          echo "Vérification des dépendances..."

          if grep -niE "reportlab|p4a\.local_recipes" buildozer.spec; then
            echo
            echo "ERREUR : buildozer.spec contient encore une"
            echo "référence à ReportLab ou p4a.local_recipes."
            exit 1
          fi

          echo "buildozer.spec OK."


      # ========================================================
      # 14. NETTOYAGE DU CACHE BUILDOZER
      # ========================================================
      #
      # IMPORTANT :
      #
      # Après les anciens essais ReportLab, le cache Buildozer
      # peut conserver des recettes ou fichiers téléchargés.
      #
      # On repart donc volontairement de zéro.
      # ========================================================

      - name: "14 - Nettoyer complètement Buildozer"
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          echo "Cache Buildozer supprimé."

          if [ -d "p4a-recipes" ]; then
            echo
            echo "Contenu de p4a-recipes détecté :"
            find p4a-recipes -maxdepth 3 -type f -print || true
          fi


      # ========================================================
      # 15. CONSTRUIRE L'APK
      # ========================================================
      #
      # Le build est maintenant lancé.
      #
      # Buildozer utilisera le buildozer.spec présent dans le
      # dépôt.
      # ========================================================

      - name: "15 - Construire l'APK"
        shell: bash
        run: |
          set -euxo pipefail

          buildozer android debug


      # ========================================================
      # 16. RECHERCHER L'APK
      # ========================================================
      #
      # Cette étape est exécutée même si la compilation échoue.
      # Elle est donc utile pour diagnostiquer le résultat.
      # ========================================================

      - name: "16 - Rechercher les APK générés"
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "FICHIERS APK / AAB"
          echo "========================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -not -path "./.git/*" \
            -print || true


      # ========================================================
      # 17. AFFICHER LES DERNIERS LOGS EN CAS D'ÉCHEC
      # ========================================================
      #
      # Si Buildozer échoue, on conserve quelques informations
      # supplémentaires dans les logs GitHub Actions.
      # ========================================================

      - name: "17 - Diagnostic en cas d'échec"
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "DIAGNOSTIC DU BUILD"
          echo "========================================"

          echo
          echo "Python :"
          python --version || true

          echo
          echo "Buildozer :"
          buildozer --version || true

          echo
          echo "Java :"
          java -version || true

          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME:-non défini}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME:-non défini}"

          echo
          echo "SDK :"
          ls -la "${ANDROID_HOME:-/non-defini}" || true

          echo
          echo "NDK :"
          ls -la "${ANDROID_NDK_HOME:-/non-defini}" || true

          echo
          echo "Buildozer directories :"
          find .buildozer \
            -maxdepth 4 \
            -type d \
            -print 2>/dev/null | head -200 || true


      # ========================================================
      # 18. PUBLIER L'APK
      # ========================================================
      #
      # L'APK apparaît dans GitHub Actions :
      #
      #   Summary
      #      -> Artifacts
      #         -> suivi-auto-apk
      #
      # Cette étape ne s'exécute que si le build a réussi.
      # ========================================================

      - name: "18 - Publier l'APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: "bin/*.apk"
          if-no-files-found: error
          retention-days: 14
