name: Build Android APK

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          java -version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade buildozer==1.6.0 cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE="$RUNNER_TEMP/cmdline-tools"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK"
          mkdir -p "$CMDLINE"

          echo "Téléchargement Android Command Line Tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" \
            -O "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$CMDLINE"

          rm -rf "$SDK/cmdline-tools"
          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$CMDLINE/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          echo "Création de l'ancien chemin attendu par Buildozer..."

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "===== sdkmanager ====="
          "$SDK/tools/bin/sdkmanager" --version

          echo "===== Acceptation licences ====="

          yes | "$SDK/tools/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

          echo "===== Installation SDK ====="

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "===== Vérification ====="

          test -x "$SDK/tools/bin/sdkmanager"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/33.0.2"
          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "SDK OK"
          echo "sdkmanager OK"
          echo "AIDL OK"

      - name: Prepare python-for-android
        shell: bash
        run: |
          set -e

          echo "Installation de python-for-android..."

          python3 -m pip install --upgrade \
            python-for-android

          echo "===== python-for-android ====="

          python3 -c "
          import pythonforandroid
          print('python-for-android:', getattr(pythonforandroid, '__version__', 'unknown'))
          "

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== Java ====="
          java -version

          echo "===== SDK ====="
          echo "$SDK"

          echo "===== Platform ====="
          ls -la "$SDK/platforms/android-33"

          echo "===== Build Tools ====="
          ls -la "$SDK/build-tools/33.0.2"

          echo "===== AIDL ====="
          "$SDK/build-tools/33.0.2/aidl" --version || true

      - name: Verify ReportLab source
        shell: bash
        run: |
          set -e

          echo "===== Test ReportLab PyPI ====="

          python3 -m pip download \
            --no-deps \
            --only-binary=:all: \
            reportlab \
            -d "$RUNNER_TEMP/reportlab-test" || true

          ls -la "$RUNNER_TEMP/reportlab-test" || true

      - name: Clean previous Android build
        shell: bash
        run: |
          set -e

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -e

          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"

          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"

          echo "===== Environment ====="
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDAPI=${ANDROIDAPI:-33}"
          echo "ANDROIDMINAPI=${ANDROIDMINAPI:-24}"
          java -version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Build ====="

          buildozer -v android debug

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "===== APK généré ====="

          find bin -maxdepth 1 -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error

