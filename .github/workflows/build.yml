name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      # NDK 28c
      ANDROID_NDK_VERSION: "28c"

      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. DEPENDANCES LINUX
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            tar \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            gettext \
            gettext-base \
            libffi-dev \
            libssl-dev \
            zlib1g-dev


      # ============================================================
      # 5. BUILDOZER
      # ============================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"

          buildozer --version


      # ============================================================
      # 6. CHEMINS ANDROID
      # ============================================================
      - name: Configure Android paths
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          NDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

          mkdir -p "$SDK"

          {
            echo "ANDROIDSDK=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"

            echo "ANDROIDNDK=$NDK"
            echo "ANDROID_NDK=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"

            echo "ANDROIDAPI=33"
            echo "ANDROIDMINAPI=24"
          } >> "$GITHUB_ENV"

          {
            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/build-tools/35.0.0"
          } >> "$GITHUB_PATH"


      # ============================================================
      # 7. CACHE BUILDOZER
      # ============================================================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ============================================================
      # 8. INSTALL COMMAND LINE TOOLS
      # ============================================================
      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TEMP="$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$SDK"
          mkdir -p "$TEMP"

          echo "======================================"
          echo "INSTALLATION ANDROID CMDLINE TOOLS"
          echo "======================================"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" \
            -O "$TEMP/cmdline-tools.zip"

          unzip -q \
            "$TEMP/cmdline-tools.zip" \
            -d "$TEMP"

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$TEMP/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          chmod +x "$SDK/cmdline-tools/latest/bin/"*

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # --------------------------------------------------------
          # COMPATIBILITE BUILDOZER 1.6.0
          #
          # Buildozer cherche encore :
          #
          # android-sdk/tools/bin/sdkmanager
          #
          # Le sdkmanager moderne est ici :
          #
          # android-sdk/cmdline-tools/latest/bin/sdkmanager
          #
          # On crée donc le chemin attendu par Buildozer.
          # --------------------------------------------------------

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools/bin"

          ln -s \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "======================================"
          echo "SDKMANAGER MODERNE"
          echo "======================================"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "======================================"
          echo "SDKMANAGER COMPATIBILITE BUILDOZER"
          echo "======================================"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "sdkmanager OK"


      # ============================================================
      # 9. LICENCES ANDROID
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"

          touch "$HOME/.android/repositories.cfg"

          echo "======================================"
          echo "LICENCES ANDROID"
          echo "======================================"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses \
            >/dev/null 2>&1 || true

          echo "Licences configurées."


      # ============================================================
      # 10. INSTALL SDK
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "======================================"
          echo "INSTALL SDK 33"
          echo "======================================"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "======================================"
          echo "VERIFICATION SDK"
          echo "======================================"

          test -d "$SDK/platforms/android-33"

          test -d "$SDK/build-tools/35.0.0"

          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "SDK 33 OK"
          echo "Build Tools 35 OK"
          echo "AIDL OK"


      # ============================================================
      # 11. INSTALL NDK 28c
      # ============================================================
      - name: Install Android NDK 28c
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          NDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "======================================"
          echo "INSTALLATION NDK 28c"
          echo "======================================"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;28.2.13676358"

          REAL_NDK="$SDK/ndk/28.2.13676358"

          test -d "$REAL_NDK"

          test -f "$REAL_NDK/source.properties"

          echo "======================================"
          echo "NDK INSTALLE"
          echo "======================================"

          cat "$REAL_NDK/source.properties"

          # Chemin attendu par Buildozer/p4a
          rm -rf "$NDK"

          ln -s \
            "$REAL_NDK" \
            "$NDK"

          echo "======================================"
          echo "NDK 28c ACTIF"
          echo "======================================"

          ls -ld "$NDK"

          test -f "$NDK/source.properties"

          grep "Pkg.Revision" \
            "$NDK/source.properties"


      # ============================================================
      # 12. VERIFICATION COMPLETE
      # ============================================================
      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          NDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo "======================================"
          echo "SDKMANAGER"
          echo "======================================"

          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "======================================"
          echo "COMPATIBILITE BUILDOZER"
          echo "======================================"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "======================================"
          echo "SDK"
          echo "======================================"

          test -d "$SDK/platforms/android-33"

          test -d "$SDK/build-tools/35.0.0"

          echo "SDK OK"

          echo "======================================"
          echo "AIDL"
          echo "======================================"

          test -x "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "AIDL OK"

          echo "======================================"
          echo "NDK"
          echo "======================================"

          test -d "$NDK"

          test -f "$NDK/source.properties"

          cat "$NDK/source.properties"

          grep "Pkg.Revision" \
            "$NDK/source.properties"

          echo "NDK 28c OK"


      # ============================================================
      # 13. INITIALISATION BUILDOZER / P4A
      # ============================================================
      - name: Initialize Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "INITIALISATION BUILDOZER"
          echo "======================================"

          buildozer android p4a -- --help


      # ============================================================
      # 14. NETTOYAGE
      # ============================================================
      - name: Clean previous Android build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/dists

          echo "Ancien build supprimé."


      # ============================================================
      # 15. BUILD APK
      # ============================================================
      - name: Build APK
        shell: bash
        timeout-minutes: 90
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          NDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export ANDROIDNDK="$NDK"
          export ANDROID_NDK="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"

          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "ENVIRONNEMENT FINAL"
          echo "======================================"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"

          echo "======================================"
          echo "SDKMANAGER"
          echo "======================================"

          command -v sdkmanager

          sdkmanager --version

          echo "======================================"
          echo "NDK"
          echo "======================================"

          test -f "$ANDROIDNDK/source.properties"

          cat "$ANDROIDNDK/source.properties"

          grep "Pkg.Revision" \
            "$ANDROIDNDK/source.properties"

          echo "======================================"
          echo "AIDL"
          echo "======================================"

          test -x "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"

          buildozer --version

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          buildozer -v android debug


      # ============================================================
      # 16. VERIFIER APK
      # ============================================================
      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "APK PRODUIT"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

          ls -lh "$APK"


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error


