name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "33"
      ANDROID_MIN_API: "24"
      ANDROID_BUILD_TOOLS: "35.0.0"
      JAVA_VERSION: "17"

    steps:

      # ---------------------------------------------------------
      # 1. Récupération du projet
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Dépendances système
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev

      # ---------------------------------------------------------
      # 5. Buildozer / Cython
      # ---------------------------------------------------------
      - name: Install Python build tools
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      # ---------------------------------------------------------
      # 6. Initialisation / nettoyage Buildozer
      # ---------------------------------------------------------
      - name: Initialize Buildozer Android environment
        run: |
          set -euxo pipefail

          buildozer android clean || true

      # ---------------------------------------------------------
      # 7. Configuration Android SDK
      # ---------------------------------------------------------
      - name: Configure Android SDK environment
        run: |
          set -euxo pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=${ANDROID_API}" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=${ANDROID_MIN_API}" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo
          echo "=========================================="
          echo "Android SDK configuration"
          echo "=========================================="
          echo "ANDROIDSDK=$SDK"
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROIDAPI=${ANDROID_API}"
          echo "ANDROIDMINAPI=${ANDROID_MIN_API}"

      # ---------------------------------------------------------
      # 8. Installer Android Command Line Tools
      # ---------------------------------------------------------
      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"
          CMDLINE_TOOLS="$SDK/cmdline-tools/latest"
          SDKMANAGER="$CMDLINE_TOOLS/bin/sdkmanager"

          echo
          echo "=========================================="
          echo "Installation Android Command Line Tools"
          echo "=========================================="

          echo "SDK = $SDK"
          echo "SDKMANAGER = $SDKMANAGER"

          # -----------------------------------------------------
          # Télécharger les Android Command Line Tools
          # -----------------------------------------------------

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/commandlinetools.zip

          # -----------------------------------------------------
          # Installer les outils
          # -----------------------------------------------------

          rm -rf "$CMDLINE_TOOLS"

          mkdir -p "$CMDLINE_TOOLS"

          unzip -q \
            /tmp/commandlinetools.zip \
            -d "$CMDLINE_TOOLS"

          # L'archive Google contient :
          #
          # cmdline-tools/
          #   bin/
          #   lib/
          #   source.properties
          #
          # On veut :
          #
          # latest/
          #   bin/
          #   lib/
          #   source.properties

          if [ -d "$CMDLINE_TOOLS/cmdline-tools" ]; then
            mv "$CMDLINE_TOOLS/cmdline-tools/"* \
               "$CMDLINE_TOOLS/"

            rm -rf "$CMDLINE_TOOLS/cmdline-tools"
          fi

          chmod +x "$SDKMANAGER"

          # -----------------------------------------------------
          # Vérifier sdkmanager
          # -----------------------------------------------------

          echo
          echo "=========================================="
          echo "Vérification sdkmanager"
          echo "=========================================="

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --version

          # -----------------------------------------------------
          # Accepter les licences
          # -----------------------------------------------------

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          # -----------------------------------------------------
          # Installer les composants Android
          #
          # Le NDK n'est volontairement PAS installé ici.
          # python-for-android détecte et installe lui-même
          # la version recommandée (actuellement r28c).
          # -----------------------------------------------------

          echo
          echo "=========================================="
          echo "Installation des composants Android"
          echo "=========================================="

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          # -----------------------------------------------------
          # Vérifications
          # -----------------------------------------------------

          echo
          echo "=========================================="
          echo "Vérifications Android SDK"
          echo "=========================================="

          test -d "$SDK/platforms/android-${ANDROID_API}"

          test -d "$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          test -x "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aidl"

          test -d "$SDK/platform-tools"

          echo
          echo "SDK Manager :"
          "$SDKMANAGER" --version

          echo
          echo "Android Platform :"
          ls -ld "$SDK/platforms/android-${ANDROID_API}"

          echo
          echo "Build Tools :"
          ls -ld "$SDK/build-tools/${ANDROID_BUILD_TOOLS}"

          echo
          echo "Platform Tools :"
          ls -ld "$SDK/platform-tools"

      # ---------------------------------------------------------
      # 9. Compatibilité sdkmanager avec python-for-android
      # ---------------------------------------------------------
      - name: Configure sdkmanager compatibility
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          MODERN_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          LEGACY_DIR="$SDK/tools/bin"
          LEGACY_SDKMANAGER="$LEGACY_DIR/sdkmanager"

          echo
          echo "=========================================="
          echo "Configuration compatibilité sdkmanager"
          echo "=========================================="

          echo "SDK = $SDK"
          echo "sdkmanager moderne = $MODERN_SDKMANAGER"
          echo "sdkmanager legacy = $LEGACY_SDKMANAGER"

          # Vérifier le sdkmanager moderne
          test -x "$MODERN_SDKMANAGER"

          # Créer le chemin attendu par certaines versions
          # de python-for-android
          mkdir -p "$LEGACY_DIR"

          # Créer un lien symbolique
          ln -sf \
            "$MODERN_SDKMANAGER" \
            "$LEGACY_SDKMANAGER"

          # -----------------------------------------------------
          # Vérification
          # -----------------------------------------------------

          echo
          echo "Contenu de tools/bin :"

          ls -la "$LEGACY_DIR"

          echo
          echo "Test sdkmanager via chemin legacy :"

          "$LEGACY_SDKMANAGER" --version

          echo
          echo "sdkmanager legacy correctement configuré."

      # ---------------------------------------------------------
      # 10. Vérifier la recette ReportLab locale
      # ---------------------------------------------------------
      - name: Verify local ReportLab recipe
        run: |
          set -euxo pipefail

          echo
          echo "=========================================="
          echo "Vérification recette ReportLab"
          echo "=========================================="

          test -f p4a-recipes/reportlab/__init__.py

          test -f \
            p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz

          echo
          echo "Archive ReportLab :"

          ls -lh \
            p4a-recipes/reportlab/reportlab-fe660f227cac.tar.gz

          echo
          echo "Recette ReportLab :"

          sed -n '1,200p' \
            p4a-recipes/reportlab/__init__.py

      # ---------------------------------------------------------
      # 11. Nettoyage des répertoires Buildozer du projet
      # ---------------------------------------------------------
      - name: Clean Buildozer build directories
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # ---------------------------------------------------------
      # 12. Vérification finale de l'environnement Android
      # ---------------------------------------------------------
      - name: Verify Android environment before Buildozer
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          echo
          echo "=========================================="
          echo "Environnement Android final"
          echo "=========================================="

          echo
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "sdkmanager moderne:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo
          echo "sdkmanager legacy:"
          "$SDK/tools/bin/sdkmanager" --version

          echo
          echo "AIDL:"
          "$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aidl" --help >/dev/null

          echo
          echo "Java:"
          java -version

          echo
          echo "Python:"
          python --version

          echo
          echo "Cython:"
          cython --version

          echo
          echo "Buildozer:"
          buildozer --version

      # ---------------------------------------------------------
      # 13. Construction APK
      # ---------------------------------------------------------
      - name: Build Android APK
        run: |
          set -euxo pipefail

          export ANDROIDSDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"

          export ANDROIDAPI="$ANDROID_API"
          export ANDROIDMINAPI="$ANDROID_MIN_API"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          echo
          echo "=========================================="
          echo "Lancement Buildozer"
          echo "=========================================="

          buildozer -v android debug

      # ---------------------------------------------------------
      # 14. Vérifier que l'APK existe
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          set -euxo pipefail

          echo
          echo "=========================================="
          echo "Vérification APK"
          echo "=========================================="

          echo
          echo "Contenu de bin/ :"

          find bin \
            -maxdepth 2 \
            -type f \
            -print

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          echo
          echo "APK généré :"
          echo "$APK"

          echo
          echo "Taille :"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 15. Publier l'APK comme artefact GitHub
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error
