name: Suivi Auto - Build APK Android

# ============================================================
# DÉCLENCHEMENT
# ============================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# JOB
# ============================================================

jobs:

  build-apk:

    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # 1. RÉCUPÉRER LE CODE
      # ========================================================

      - name: "1 - Checkout du dépôt"
        uses: actions/checkout@v4


      # ========================================================
      # 2. PYTHON 3.10
      # ========================================================

      - name: "2 - Installer Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip


      # ========================================================
      # 3. JAVA 17
      #
      # IMPORTANT :
      # Pas de cache: gradle.
      #
      # Le projet utilise Buildozer/python-for-android et
      # n'est pas un projet Gradle GitHub classique.
      # ========================================================

      - name: "3 - Installer Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # 4. DÉPENDANCES SYSTÈME
      # ========================================================

      - name: "4 - Installer les dépendances système"
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            rsync \
            file \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      # ========================================================
      # 5. VÉRIFIER PYTHON ET JAVA
      # ========================================================

      - name: "5 - Vérifier Python et Java"
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo
          echo "========================================"
          echo "JAVA_HOME"
          echo "========================================"

          echo "$JAVA_HOME"


      # ========================================================
      # 6. BUILDOZER + CYTHON
      # ========================================================

      - name: "6 - Installer Buildozer et Cython"
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.37"


      # ========================================================
      # 7. ANDROID SDK
      # ========================================================

      - name: "7 - Installer Android SDK"
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          CMDLINE_TOOLS_VERSION="11076708"

          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"

          CMDLINE_TOOLS_ZIP="/tmp/android-cmdline-tools.zip"

          mkdir -p "$ANDROID_HOME"

          # ----------------------------------------------------
          # Installer sdkmanager uniquement s'il n'existe pas.
          # ----------------------------------------------------

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then

            rm -rf /tmp/android-cmdline-tools

            mkdir -p /tmp/android-cmdline-tools

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=30 \
              -O "$CMDLINE_TOOLS_ZIP" \
              "$CMDLINE_TOOLS_URL"

            unzip -q \
              "$CMDLINE_TOOLS_ZIP" \
              -d /tmp/android-cmdline-tools

            rm -rf "$ANDROID_HOME/cmdline-tools/latest"

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            cp -a \
              /tmp/android-cmdline-tools/cmdline-tools/. \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          # ----------------------------------------------------
          # Variables persistantes.
          # ----------------------------------------------------

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          # ----------------------------------------------------
          # Vérification.
          # ----------------------------------------------------

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --version


      # ========================================================
      # 8. ACCEPTER LES LICENCES
      # ========================================================
      #
      # Cette étape doit être AVANT l'installation des composants
      # Android.
      #
      # "yes" répond automatiquement "y" aux licences.
      # ========================================================

      - name: "8 - Accepter les licences Android"
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "LICENCES ANDROID"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses

          echo
          echo "Licences Android acceptées."


      # ========================================================
      # 9. ANDROID PLATFORM + BUILD TOOLS
      # ========================================================

      - name: "9 - Installer Android API 33 et Build Tools 34"
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

          echo
          echo "========================================"
          echo "COMPOSANTS INSTALLÉS"
          echo "========================================"

          "$SDKMANAGER" --list_installed


      # ========================================================
      # 10. TROUVER ET INSTALLER NDK 28
      # ========================================================

      - name: "10 - Installer le NDK 28"
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================"
          echo "RECHERCHE NDK 28"
          echo "========================================"

          mapfile -t NDK_PACKAGES < <(
            "$SDKMANAGER" --list 2>/dev/null |
            grep -oE 'ndk;28\.[0-9]+\.[0-9]+' |
            sort -Vu
          )

          if [ "${#NDK_PACKAGES[@]}" -eq 0 ]; then

            echo
            echo "ERREUR : aucun NDK 28 trouvé."

            echo
            echo "NDK disponibles :"

            "$SDKMANAGER" --list 2>/dev/null |
              grep -E 'ndk;28' || true

            exit 1
          fi

          NDK_PACKAGE="${NDK_PACKAGES[${#NDK_PACKAGES[@]}-1]}"

          echo
          echo "NDK sélectionné : $NDK_PACKAGE"

          "$SDKMANAGER" "$NDK_PACKAGE"

          NDK_VERSION="${NDK_PACKAGE#ndk;}"

          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then

            echo "ERREUR : NDK absent :"
            echo "$NDK_PATH"

            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo
          echo "NDK installé :"
          echo "$NDK_PATH"


      # ========================================================
      # 11. VÉRIFICATION ENVIRONNEMENT ANDROID
      # ========================================================

      - name: "11 - Vérifier l'environnement Android"
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID_HOME"
          echo "========================================"

          echo "$ANDROID_HOME"

          echo
          echo "========================================"
          echo "ANDROID_NDK_HOME"
          echo "========================================"

          echo "$ANDROID_NDK_HOME"

          echo
          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          sdkmanager --version

          echo
          echo "========================================"
          echo "ADB"
          echo "========================================"

          adb version

          echo
          echo "========================================"
          echo "AAPT"
          echo "========================================"

          which aapt

          file "$(which aapt)"

          echo
          echo "========================================"
          echo "ANDROID API 33"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-33"

          echo "API 33 OK"

          echo
          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "Build Tools 34.0.0 OK"

          echo
          echo "========================================"
          echo "NDK"
          echo "========================================"

          test -d "$ANDROID_NDK_HOME"

          test -f "$ANDROID_NDK_HOME/source.properties"

          cat "$ANDROID_NDK_HOME/source.properties"

          echo
          echo "NDK OK"


      # ========================================================
      # 12. VÉRIFIER QU'IL N'Y A PLUS DE REPORTLAB
      # ========================================================

      - name: "12 - Vérifier la suppression de ReportLab"
        shell: bash
        run: |
          set -euxo pipefail

          echo "Recherche de ReportLab..."

          if grep -RniE \
            "reportlab|generer_rapport_pdf" \
            . \
            --exclude-dir=.git \
            --exclude-dir=.buildozer; then

            echo
            echo "ERREUR : ReportLab est encore référencé."

            exit 1
          fi

          echo
          echo "Aucune référence à ReportLab."


      # ========================================================
      # 13. VÉRIFIER BUILDOZER.SPEC
      # ========================================================

      - name: "13 - Vérifier buildozer.spec"
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOZER.SPEC"
          echo "========================================"

          cat buildozer.spec

          echo
          echo "Vérification..."

          if grep -niE \
            "reportlab|p4a\.local_recipes" \
            buildozer.spec; then

            echo
            echo "ERREUR : buildozer.spec contient encore"
            echo "ReportLab ou p4a.local_recipes."

            exit 1
          fi

          echo
          echo "buildozer.spec OK."


      # ========================================================
      # 14. SUPPRIMER LES ANCIENS CACHES
      # ========================================================

      - name: "14 - Nettoyer Buildozer"
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer

          echo "Ancien cache Buildozer supprimé."

          if [ -d "p4a-recipes" ]; then

            echo
            echo "ATTENTION : p4a-recipes existe encore."

            find p4a-recipes \
              -maxdepth 3 \
              -type f \
              -print

          fi


      # ========================================================
      # 15. CONSTRUIRE L'APK
      # ========================================================

      - name: "15 - Construire l'APK"
        shell: bash
        run: |
          set -euxo pipefail

          buildozer android debug


      # ========================================================
      # 16. RECHERCHER L'APK
      # ========================================================

      - name: "16 - Rechercher les APK générés"
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "APK / AAB"
          echo "========================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -not -path "./.git/*" \
            -print || true


      # ========================================================
      # 17. DIAGNOSTIC EN CAS D'ÉCHEC
      # ========================================================

      - name: "17 - Diagnostic en cas d'échec"
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "DIAGNOSTIC"
          echo "========================================"

          echo
          echo "Python :"
          python --version || true

          echo
          echo "Buildozer :"
          buildozer --version || true

          echo
          echo "Java :"
          java -version || true

          echo
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME:-non défini}"

          echo
          echo "ANDROID_NDK_HOME :"
          echo "${ANDROID_NDK_HOME:-non défini}"

          echo
          echo "NDK :"
          ls -la "${ANDROID_NDK_HOME:-/non-defini}" || true

          echo
          echo "Buildozer :"
          find .buildozer \
            -maxdepth 5 \
            -type f \
            -print 2>/dev/null |
            head -200 || true


      # ========================================================
      # 18. PUBLIER L'APK
      # ========================================================

      - name: "18 - Publier l'APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-auto-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
